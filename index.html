        check(d, c) {
          const p = Catalogue.getProducts(c).find(x => x.id === d.pid); if (!p || p.archived) return c.t('st.err.product');
          if (!posInt(d.g)) return c.t('st.err.qty'); if (!KINDS.includes(d.kind)) return c.t('st.err.kind');
          if (d.g > Math.max(0, onHand(c, d.pid))) return c.t('st.err.over', { x: c.fmt.kg(Math.max(0, onHand(c, d.pid))) }); return null;
        }
      },
      'stock.count': {
        prefix: 'IV', voidable: false, perm: 'stock',
        check(d, c) {
          const p = Catalogue.getProducts(c).find(x => x.id === d.pid); if (!p || p.archived) return c.t('st.err.product');
          if (!natInt(d.counted)) return c.t('st.err.qty');
          if (d.expected !== onHand(c, d.pid) || d.delta !== d.counted - d.expected) return c.t('st.err.stale'); return null;
        }
      }
    },
    settings: {
      'stock.vendreSansStock': { type: 'enum', def: 'avertir', options: ['avertir', 'bloquer'], group: 'achats',
        optionLabels: { avertir: { fr: 'Avertir seulement', ar: 'تنبيه فقط' }, bloquer: { fr: 'Bloquer la vente', ar: 'منع البيع' } },
        label: { fr: 'Vendre au-delà du stock', ar: 'البيع فوق المخزون' },
        help: { fr: 'Avertir : la vente passe (utile si un arrivage n’est pas encore saisi) ; le déficit sera couvert par le prochain arrivage. Bloquer : la vente est refusée.', ar: 'تنبيه: يمر البيع (مفيد إذا لم تُسجَّل إرسالية بعد) ويُغطى العجز بالإرسالية القادمة. منع: يُرفض البيع.' } }
    },
    strings: {
      fr: { 'st.err.product': 'Produit introuvable ou archivé.', 'st.err.qty': 'Quantité invalide : nombre de grammes, entier.', 'st.err.kind': 'Type de perte inconnu.', 'st.err.over': 'Perte supérieure au stock disponible ({x}).', 'st.err.stale': 'Le stock a changé depuis le comptage : recomptez.', 'st.err.noStock': 'Stock insuffisant pour {p} : disponible {x}.', 'st.err.voidSold': 'Cet arrivage est déjà en partie vendu : annulez d’abord les ventes concernées.' },
      ar: { 'st.err.product': 'المنتج غير موجود أو مؤرشف.', 'st.err.qty': 'كمية غير صالحة: عدد صحيح من الغرامات.', 'st.err.kind': 'نوع الخسارة غير معروف.', 'st.err.over': 'الخسارة تتجاوز المخزون المتاح ({x}).', 'st.err.stale': 'تغيّر المخزون منذ الجرد: أعد الجرد.', 'st.err.noStock': 'مخزون غير كافٍ لـ {p}: المتاح {x}.', 'st.err.voidSold': 'هذه الإرسالية بيع جزء منها: ألغِ المبيعات المعنية أولاً.' }
    },
    init(core) {
      Prix.setCostProvider(core, pid => { const s = of(core, pid), p = Catalogue.getProducts(core).find(x => x.id === pid); return s.nextCpk && p ? { cost: s.nextCpk, lossPm: p.lossPm } : null; });
      Ventes.addSaleGuard(core, (d, c) => {
        if (c.getSetting('stock.vendreSansStock') !== 'bloquer') return null;
        const need = new Map(); d.lines.forEach(l => need.set(l.pid, (need.get(l.pid) || 0) + l.g));
        for (const [pid, g] of need) { const have = onHand(c, pid); if (g > Math.max(0, have)) { const p = Catalogue.getProducts(c).find(x => x.id === pid); return c.t('st.err.noStock', { p: p ? p.fr : pid, x: c.fmt.kg(Math.max(0, have)) }); } }
        return null;
      });
      Achats.addArrivalGuard(core, (op, c) => {                              // annuler un arrivage ne doit pas laisser des ventes sans stock
        const before = state(c).byPid, after = replay(c, new Set([op.n])).byPid;
        for (const [pid, s] of after) if (s.deficit > (before.get(pid) || empty(pid)).deficit) return c.t('st.err.voidSold');
        return null;
      });
    }
  };

  /* ------------------------------------------------------------ exemple */
  function seed(core, by) {   // quelques ventes d'exemple sur les arrivages d'exemple
    const prods = Catalogue.getProducts(core).filter(p => !p.archived), now = core.now(), DAY = 86400000, made = [];
    prods.slice(0, 6).forEach((p, i) => { const s = onHand(core, p.id); if (s > 0 && Prix.priceOf(core, p.id).cpk) made.push(Ventes.record(core, { items: [{ pid: p.id, unit: 'kg', qm: Math.min(s, 60000 + i * 15000) }], by, t: now - (i % 3) * DAY })); });
    return made;
  }
  return { module: module_, KINDS, replay, state, of, onHand, list, totalValue, saleCost, dayReport, movements, recordLoss, count, seed };
});
</script>
<script>/* ============================================================================
   M11 — CAISSES CONSIGNÉES  (dépend de Catalogue M3, Clients M4, Ventes M7, Achats M9)
   Une caisse qui sort chez un client est un mouvement. Rien n'est stocké : les soldes
   (caisses dehors, consigne détenue) sont rejoués depuis le journal, comme le stock.
   Écriture :
     crate.move  KM####  {who:'c'|'s', id, crate, dir, q, mode?, cons?, dep, sale?, note?}
       who 'c' = client (id = C####)   dir : out (sort) | back (revient) | keep (client garde/perd la caisse)
       who 's' = fournisseur (id = FR####)  dir : in (on reçoit ses caisses) | back (on les rend)
       q    = nombre de caisses (entier ≥ 1)
       mode = 'avec' | 'suivi' (client, à la sortie)   cons = consigne DA par caisse (instantané à la sortie)
       dep  = DA : sortie avec argent = q × cons (le client paie) ; retour = remboursement ;
              keep = consigne conservée par le commerce (pas d'argent) ; sinon 0
       sale = vente T#### liée (facultatif)
   Remboursement d'un retour : consigne détenue ÷ caisses dehors × q (arrondi bas ; le solde exact au dernier).
   Droits : perm 'caisses' (gérant + dépannage) ; 'keep' et fournisseurs exigent 'consignes' (gérant).
   Contrôle dans la couche de données : solde jamais négatif, montants rejoués, mode du client respecté.
   ========================================================================== */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory(require('../noyau/noyau.js'), require('../m3/m3-catalogue.js'), require('../m4/clients.js'), require('../m5/prix.js'), require('../m7/ventes.js'), require('../m9/achats.js'));
  else root.Consignes = factory(root.Noyau, root.Catalogue, root.Clients, root.Prix, root.Ventes, root.Achats);
})(typeof self !== 'undefined' ? self : this, function (Noyau, Catalogue, Clients, Prix, Ventes, Achats) {
  'use strict';
  const DIRS = { c: ['out', 'back', 'keep'], s: ['in', 'back'] }, MAX_Q = 10000;
  const posInt = n => Number.isInteger(n) && n > 0;
  const fail = (code, msg) => { const e = new Error(msg); e.code = code; return e; };

  /** Mode réellement appliqué à un client : le réglage global prime, sinon le choix du client. */
  function modeOf(core, cl) {
    const g = core.getSetting('consigne.clients'); if (g === 'aucun' || g === 'suivi') return g;
    return cl && cl.consigne ? cl.consigne : 'avec';
  }

  /* ------------------------------------------------- rejeu (une seule règle, partout) */
  const key = (who, id, crate) => who + ':' + id + ':' + crate;
  /** Applique un mouvement à la table. Retourne un message d'erreur ou null. `want` : montants attendus pour le contrôle. */
  function step(map, d, core) {
    const k = key(d.who, d.id, d.crate), b = map.get(k) || { who: d.who, id: d.id, crate: d.crate, out: 0, held: 0 };
    let err = null;
    if (d.who === 'c') {
      if (d.dir === 'out') {
        const want = d.mode === 'avec' ? d.q * d.cons : 0;
        if (d.dep !== want) err = core.t('cs.err.dep');
        else { b.out += d.q; b.held += d.dep; }
      } else {
        if (d.q > b.out) err = core.t('cs.err.over', { x: b.out });
        else {
          const part = d.q === b.out ? b.held : Math.floor(b.held * d.q / b.out);
          if (d.dep !== part) err = core.t('cs.err.dep'); else { b.out -= d.q; b.held -= d.dep; }
        }
      }
    } else {
      if (d.dir === 'in') b.out += d.q;
      else if (d.q > b.out) err = core.t('cs.err.overS', { x: b.out }); else b.out -= d.q;
      if (!err && d.dep !== 0) err = core.t('cs.err.dep');
    }
    map.set(k, b); return err;
  }
  /** Rejoue tous les mouvements vivants (sauf `exclude`). Retourne {map, errors}. */
  function replay(core, exclude) {
    const map = new Map(), errors = [];
    for (const o of core.live('crate.move')) { if (exclude && exclude.has(o.n)) continue; const e = step(map, o.d, core); if (e) errors.push({ n: o.n, id: o.id, err: e }); }
    return { map, errors };
  }

  /* ------------------------------------------------------------ contrôles */
  function checkMove(d, core) {
    if (!d || (d.who !== 'c' && d.who !== 's')) return core.t('cs.err.who');
    if (!DIRS[d.who].includes(d.dir)) return core.t('cs.err.dir');
    if (!posInt(d.q) || d.q > MAX_Q) return core.t('cs.err.qty');
    const cr = Catalogue.getCrates(core).find(c => c.id === d.crate); if (!cr || (cr.archived && d.dir === 'out')) return core.t('cs.err.crate');
    if (d.who === 'c') {
      const cl = Clients.getClient(core, d.id); if (!cl) return core.t('cl.err.notfound');
      if (d.dir === 'out') {
        if (cl.archived) return core.t('cr.err.archived');
        const m = modeOf(core, cl); if (m === 'aucun') return core.t('cs.err.noMode');
        if (d.mode !== m) return core.t('cs.err.mode');
        if (d.cons !== cr.consigne) return core.t('cs.err.cons');
      }
      if (d.dir === 'keep' && !core.can('consignes')) throw fail('FORBIDDEN', core.t('cs.err.keepPerm'));
      if (d.dir !== 'out' && ('mode' in d || 'cons' in d)) return core.t('cs.err.shape');
    } else {
      if (!core.can('consignes')) throw fail('FORBIDDEN', core.t('cs.err.supPerm'));
      if (!core.getSetting('consigne.fournisseurs')) return core.t('cs.err.supOff');
      const s = Achats.getSupplier(core, d.id); if (!s) return core.t('cs.err.supplier');
      if (s.archived) return core.t('cs.err.supplierArch');
    }
    if (d.sale != null) {
      const sl = Ventes.getSale(core, d.sale);
      if (d.who !== 'c' || d.dir !== 'out' || !sl || core.isVoided(sl.n) || sl.d.cid !== d.id) return core.t('cs.err.sale');
    }
    if (d.note != null && (typeof d.note !== 'string' || d.note.length > 200)) return core.t('cs.err.note');
    const map = replay(core).map; return step(map, d, core);
  }

  /* ------------------------------------------------------------- lecture */
  const crateName = (core, id) => { const c = Catalogue.getCrates(core).find(x => x.id === id); return c ? Catalogue.crateName ? Catalogue.crateName(c, core.getPref ? core.getPref('lang') : 'fr') : c.name : id; };
  function rows(core, who) {
    const { map } = replay(core), out = new Map();
    for (const b of map.values()) {
      if (b.who !== who) continue;
      const r = out.get(b.id) || { id: b.id, crates: [], out: 0, held: 0 };
      if (b.out || b.held) r.crates.push({ crate: b.crate, out: b.out, held: b.held });
      r.out += b.out; r.held += b.held; out.set(b.id, r);
    }
    return [...out.values()].filter(r => r.out > 0 || r.held > 0);
  }
  /** Clients ayant des caisses dehors, du plus gros solde au plus petit. */
  function clients(core) {
    return rows(core, 'c').map(r => { const cl = Clients.getClient(core, r.id); return Object.assign(r, { name: cl ? cl.name : r.id, mode: cl ? modeOf(core, cl) : 'avec' }); })
      .sort((a, b) => b.out - a.out || b.held - a.held || a.name.localeCompare(b.name));
  }
  function suppliers(core) {
    return rows(core, 's').map(r => { const s = Achats.getSupplier(core, r.id); return Object.assign(r, { name: s ? s.name : r.id }); }).sort((a, b) => b.out - a.out || a.name.localeCompare(b.name));
  }
  /** Solde d'un client ou fournisseur : [{crate, out, held}] + totaux. */
  function balanceOf(core, who, id) {
    const r = rows(core, who).find(x => x.id === id); return r || { id, crates: [], out: 0, held: 0 };
  }
  /** Vue d'ensemble : caisses dehors par type, consigne détenue (dette envers les clients). */
  function totals(core) {
    const { map } = replay(core), per = new Map(); let outC = 0, held = 0, outS = 0;
    for (const b of map.values()) {
      const p = per.get(b.crate) || { crate: b.crate, clients: 0, suppliers: 0, held: 0 }; per.set(b.crate, p);
      if (b.who === 'c') { p.clients += b.out; p.held += b.held; outC += b.out; held += b.held; } else { p.suppliers += b.out; outS += b.out; }
    }
    return { clientsOut: outC, suppliersOwed: outS, held, perCrate: [...per.values()].filter(p => p.clients || p.suppliers || p.held) };
  }
  /** Mouvements d'argent de la journée (pour la trésorerie M13) : consignes encaissées, remboursées, conservées. */
  function dayCash(core, dayKey) {
    let inn = 0, out = 0, kept = 0;
    for (const o of core.live('crate.move')) {
      if (o.d.who !== 'c' || Prix.dayKey(o.t) !== dayKey) continue;
      if (o.d.dir === 'out') inn += o.d.dep; else if (o.d.dir === 'back') out += o.d.dep; else kept += o.d.dep;
    }
    return { in: inn, out, kept, net: inn - out };
  }
  const moves = (core, who, id) => core.live('crate.move').filter(o => o.d.who === who && o.d.id === id).reverse();
  /** Caisses à sortir pour un panier : lignes vendues « caisse » groupées par type de caisse (arrondi au-dessus). */
  function suggest(core, items) {
    const prods = Catalogue.getProducts(core), per = new Map();
    for (const i of items || []) {
      if (i.unit !== 'caisse') continue; const p = prods.find(x => x.id === i.pid); if (!p || !p.crate) continue;
      per.set(p.crate, (per.get(p.crate) || 0) + i.qm);
    }
    return [...per].map(([crate, qm]) => ({ crate, q: Math.ceil(qm / 1000) })).filter(x => x.q > 0);
  }

  /* ------------------------------------------------------------- écriture */
  function recordOut(core, o) {
    const cl = Clients.getClient(core, o.cid); if (!cl) throw fail('CHECK', core.t('cl.err.notfound'));
    const cr = Catalogue.getCrates(core).find(c => c.id === o.crate); if (!cr) throw fail('CHECK', core.t('cs.err.crate'));
    const mode = modeOf(core, cl), d = { who: 'c', id: o.cid, crate: o.crate, dir: 'out', q: o.q, mode, cons: cr.consigne, dep: mode === 'avec' ? o.q * cr.consigne : 0 };
    if (o.sale) d.sale = o.sale; if (o.note) d.note = o.note;
    return core.append('crate.move', d, { by: o.by, t: o.t });
  }
  /** Retour de caisses : le remboursement est calculé ici et rejoué par le contrôle. */
  function recordBack(core, o) {
    const b = balanceOf(core, 'c', o.cid).crates.find(x => x.crate === o.crate) || { out: 0, held: 0 };
    const dep = o.q === b.out ? b.held : (b.out ? Math.floor(b.held * o.q / b.out) : 0);
    const d = { who: 'c', id: o.cid, crate: o.crate, dir: o.keep ? 'keep' : 'back', q: o.q, dep }; if (o.note) d.note = o.note;
    return core.append('crate.move', d, { by: o.by, t: o.t });
  }
  /** Fournisseur : dir 'in' (reçu avec un arrivage) ou 'back' (rendu). */
  function recordSupplier(core, o) {
    const d = { who: 's', id: o.sid, crate: o.crate, dir: o.dir, q: o.q, dep: 0 }; if (o.note) d.note = o.note;
    return core.append('crate.move', d, { by: o.by, t: o.t });
  }
  /** Remboursement prévu pour un retour (aperçu avant validation). */
  function refundPreview(core, cid, crate, q) {
    const b = balanceOf(core, 'c', cid).crates.find(x => x.crate === crate) || { out: 0, held: 0 };
    return { out: b.out, held: b.held, refund: q === b.out ? b.held : (b.out ? Math.floor(b.held * q / b.out) : 0), ok: q > 0 && q <= b.out };
  }

  const module_ = {
    id: 'consignes', version: '0.1.0', deps: ['catalogue', 'clients', 'prix', 'ventes', 'achats'],
    types: {
      'crate.move': {
        prefix: 'KM', perm: 'caisses', check: checkMove,
        voidGuard(op, core) { const r = replay(core, new Set([op.n])); return r.errors.length ? core.t('cs.err.voidMove') : null; }
      }
    },
    strings: {
      fr: { 'cs.err.who': 'Mouvement invalide : client ou fournisseur attendu.', 'cs.err.dir': 'Sens du mouvement invalide.', 'cs.err.qty': 'Nombre de caisses : entier de 1 à 10 000.', 'cs.err.crate': 'Type de caisse introuvable ou archivé.',
        'cs.err.noMode': 'Les caisses ne sont pas gérées pour ce client (réglage « aucun »).', 'cs.err.mode': 'Mode de consigne différent de celui du client.', 'cs.err.cons': 'Consigne différente de celle du type de caisse.',
        'cs.err.dep': 'Montant de consigne incohérent.', 'cs.err.over': 'Ce client n’a que {x} caisse(s) dehors.', 'cs.err.overS': 'Vous ne détenez que {x} caisse(s) de ce fournisseur.',
        'cs.err.keepPerm': 'Seul le gérant peut garder la consigne d’une caisse non rendue.', 'cs.err.supPerm': 'Seul le gérant gère les caisses des fournisseurs.', 'cs.err.supOff': 'Le suivi des caisses fournisseurs est désactivé dans les réglages.',
        'cs.err.supplier': 'Fournisseur introuvable.', 'cs.err.supplierArch': 'Fournisseur archivé.', 'cs.err.sale': 'Vente liée invalide (annulée, d’un autre client, ou pas une sortie).', 'cs.err.note': 'Note trop longue.',
        'cs.err.shape': 'Champs inattendus pour ce sens.', 'cs.err.voidMove': 'Annulation refusée : des mouvements postérieurs deviendraient incohérents (annulez-les d’abord).', 'cs.err.voidSale': 'Cette vente a des caisses sorties : annulez d’abord le mouvement de caisses.' },
      ar: { 'cs.err.who': 'حركة غير صالحة: زبون أو مورّد مطلوب.', 'cs.err.dir': 'اتجاه الحركة غير صالح.', 'cs.err.qty': 'عدد الصناديق: عدد صحيح من 1 إلى 10000.', 'cs.err.crate': 'نوع الصندوق غير موجود أو مؤرشف.',
        'cs.err.noMode': 'الصناديق غير مُدارة لهذا الزبون (إعداد «بدون»).', 'cs.err.mode': 'نمط الوديعة يختلف عن نمط الزبون.', 'cs.err.cons': 'الوديعة تختلف عن وديعة نوع الصندوق.',
        'cs.err.dep': 'مبلغ الوديعة غير متناسق.', 'cs.err.over': 'لدى هذا الزبون {x} صندوق(صناديق) فقط في الخارج.', 'cs.err.overS': 'لا تملك إلا {x} صندوق(صناديق) من هذا المورّد.',
        'cs.err.keepPerm': 'المسير وحده يمكنه الاحتفاظ بوديعة صندوق لم يُرجع.', 'cs.err.supPerm': 'المسير وحده يدير صناديق الموردين.', 'cs.err.supOff': 'متابعة صناديق الموردين معطلة في الإعدادات.',
        'cs.err.supplier': 'المورّد غير موجود.', 'cs.err.supplierArch': 'المورّد مؤرشف.', 'cs.err.sale': 'بيع مرتبط غير صالح (ملغى أو لزبون آخر أو ليس خروجًا).', 'cs.err.note': 'ملاحظة طويلة جدًا.',
        'cs.err.shape': 'حقول غير متوقعة لهذا الاتجاه.', 'cs.err.voidMove': 'الإلغاء مرفوض: حركات لاحقة ستصبح غير متناسقة (ألغها أولًا).', 'cs.err.voidSale': 'هذا البيع له صناديق خرجت: ألغِ حركة الصناديق أولًا.' }
    },
    init(core) {
      Ventes.addVoidGuard(core, (op, c) => c.live('crate.move').some(m => m.d.sale === op.id) ? c.t('cs.err.voidSale') : null);
    }
  };

  /* ------------------------------------------------------------ exemple */
  function seed(core, by) {
    const cl = Clients.getClients ? Clients.getClients(core).filter(c => !c.archived) : [], crates = Catalogue.getCrates(core).filter(c => !c.archived), made = [];
    if (!crates.length) return made;
    cl.slice(0, 3).forEach((c, i) => { try { made.push(recordOut(core, { cid: c.id, crate: crates[0].id, q: 6 + 4 * i, by })); if (i === 0) made.push(recordBack(core, { cid: c.id, crate: crates[0].id, q: 2, by })); } catch (e) { /* mode 'aucun' : on passe */ } });
    return made;
  }
  return { module: module_, modeOf, replay, checkMove, clients, suppliers, balanceOf, totals, dayCash, moves, suggest, recordOut, recordBack, recordSupplier, refundPreview, crateName, seed };
});
</script>
<script>/* ============================================================================
   M12 — RETOURS CLIENTS  (dépend de Catalogue M3, Clients M4, Crédit M8, Prix M5, Ventes M7, Stock M10)
   Un retour est toujours lié à une vente T#### : on rend des grammes d'une ou plusieurs lignes.
   Écriture :
     sale.return  RT####  {sale, cid, lines:[{i, g, dest:'stock'|'perte', amount}], value, toDebt, cash, pay?, motif}
       i      = index de la ligne dans la vente            g = grammes rendus (cumul ≤ grammes vendus)
       amount = DA rendus pour cette ligne : cumul proportionnel au prix de la ligne (le dernier retour solde exactement)
       dest   = stock : la marchandise est remise en stock au revient réel de la ligne vendue ;
                perte : elle est jetée (le coût de la vente reste une perte)
       value  = Σ amount = ce que le commerce rend au client
       toDebt = part qui réduit la dette du client (jamais plus que la part à crédit de CETTE vente non encore rendue,

    },
    ar: {
      'sh.app': 'خضر الجملة', 'sh.home': 'الرئيسية', 'sh.hello': 'ماذا تريد أن تفعل؟', 'sh.tools': 'أدوات', 'sh.lock': 'قفل',
      's.vente': 'البيع', 's.clients': 'الزبائن والدين', 's.caisses': 'الصناديق (الودائع)', 's.prix': 'أسعار اليوم', 's.achats': 'المشتريات والشحنات', 's.stock': 'المخزون والخسائر',
      's.retours': 'مرتجعات الزبائن', 's.journee': 'اليوم والصندوق', 's.stats': 'الإحصائيات', 's.tickets': 'التذاكر', 's.catalogue': 'الكتالوج', 's.sauvegarde': 'النسخ الاحتياطي', 's.reglages': 'الدخول والإعدادات',
      'sh.bk.never': 'لم يتم أي نسخ احتياطي: اضغط هنا', 'sh.bk.orange': 'حان وقت نسخ احتياطي جديد: اضغط هنا', 'sh.bk.red': 'النسخة قديمة جداً: أنجزها الآن', 'sh.bk.ok': 'النسخ الاحتياطي محدّث',
      'sh.seed': 'تحميل بيانات مثال', 'sh.seed.help': 'منتجات وأسعار وزبائن ومشتريات وهمية للتجربة. لا يمكن حذفها واحدة واحدة: المسح الكامل فقط.',
      'sh.seeded': 'تم تحميل الأمثلة', 'sh.wipe': 'مسح كل البيانات', 'sh.wipe.help': 'يمسح كل السجل في هذا الجهاز (المبيعات، الزبائن، الأسعار، الرموز). أنجز نسخة احتياطية قبل ذلك. اكتب EFFACER للتأكيد.',
      'sh.wipe.go': 'مسح نهائي', 'sh.wipe.bad': 'اكتب EFFACER بالضبط', 'sh.close': 'إغلاق', 'sh.ver': 'الإصدار {v} · {n} تسجيل', 'sh.offline': 'يعمل بدون إنترنت بعد التثبيت.',
      'sh.upd': 'إصدار جديد جاهز', 'sh.upd.go': 'تحديث'
    }
  };
  core.addStrings(S_);
  const T = (k, v) => core.t(k, v);

  /* ---- écrans : id, icône, droit requis, fichier source déjà intégré dans __SCREENS */
  const MENU = [
    { id: 'vente', ic: '🛒', perm: 'vendre', main: true },
    { id: 'clients', ic: '👥', perm: 'client.voir' },
    { id: 'prix', ic: '🏷️', perm: 'prix.voir' },
    { id: 'tickets', ic: '🧾', perm: 'vendre' },
    { id: 'caisses', ic: '📦', perm: 'caisses' },
    { id: 'retours', ic: '↩️', perm: 'retours' },
    { id: 'achats', ic: '🚚', perm: 'achats' },
    { id: 'stock', ic: '📊', perm: 'stock.voir' },
    { id: 'journee', ic: '💰', perm: 'rapport.cloture' },
    { id: 'stats', ic: '📈', perm: 'stats' },
    { id: 'catalogue', ic: '🥬', perm: 'catalogue.voir' },
    { id: 'sauvegarde', ic: '💾', perm: 'sauvegarde' },
    { id: 'reglages', ic: '⚙️', perm: 'reglages' }
  ];
  const allowed = () => MENU.filter(m => window.__SCREENS[m.id] && core.can(m.perm));

  let toastT = null;
  function toast(m) { const r = $('sh-toast'); r.innerHTML = '<div>' + esc(m) + '</div>'; clearTimeout(toastT); toastT = setTimeout(() => { r.innerHTML = ''; }, 3200); }

  /* ---- affichage */
  let cur = null;
  function applyPrefs() {
    const th = core.getPref('theme'), de = document.documentElement;
    if (th === 'auto') de.removeAttribute('data-theme'); else de.setAttribute('data-theme', th);
    de.lang = core.getPref('lang'); de.dir = core.dir();
  }
  function homeHtml() {
    const l = allowed(), bk = core.can('sauvegarde') ? Backup.status(core) : null;
    const tile = m => '<button class="sh-tile' + (m.main ? ' main' : '') + '" data-go="' + m.id + '"><span class="ic">' + m.ic + '</span><b>' + esc(T('s.' + m.id)) + '</b></button>';
    return '<p class="sh-hello">' + esc(T('sh.hello')) + '</p>' +
      (bk && bk.level !== 'ok' ? '<button class="sh-bk ' + (bk.level === 'red' ? 'bad' : 'warn') + '" data-go="sauvegarde">💾 ' + esc(T('sh.bk.' + bk.level)) + '</button>' : '') +
      '<div class="sh-grid">' + l.map(tile).join('') + '</div>' +
      (core.can('reglages') ? '<div class="sh-tools"><button data-a="tools">' + esc(T('sh.tools')) + '</button></div>' : '');
  }
  function syncBar() {
    const home = !cur, role = Acces.of(core).role;
    $('sh-title').textContent = home ? T('sh.app') : T('s.' + cur);
    $('sh-back').hidden = home;
    $('sh-lang').textContent = core.getPref('lang') === 'fr' ? 'ع' : 'FR';
    $('sh-role').textContent = T('role.' + role); $('sh-role').className = 'sh-role' + (role === 'depannage' ? ' dep' : '');
  }
  function renderHome() { $('sh-home').innerHTML = homeHtml(); }

  const FRAME_CSS = '.head .lang,.head .sample,.head [data-a="lock"],.head [data-a="theme"],[data-a="openTools"],header.top #b-lang,header.top #b-theme,.head .rolepill{display:none!important}header.top{display:none!important}';
  function shim() {
    /* exécuté DANS le cadre, avant le script de l'écran */
    const P = window.parent, G = P.__ggl;
    G.libs.forEach(n => { if (P[n]) window[n] = P[n]; });
    window.Noyau = Object.assign({}, P.Noyau, { create: () => G.core });
    window.Gate = {
      mount(core, o) {
        const acc = P.Acces.of(core);
        document.addEventListener('pointerdown', () => acc.touch(), true);
        return { show() {}, lock() { P.__ggl.lock(); }, start() { if (o.onEnter) o.onEnter(); }, get visible() { return false; } };
      }
    };
    window.__GGL_FRAME = true;
  }
  function frameDoc(id) {
    const sc = window.__SCREENS[id];
    const s = '<' + 'script>(' + shim.toString() + ')();<' + '/script>';
    return '<!doctype html><html lang="' + core.getPref('lang') + '" dir="' + core.dir() + '"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">' +
      '<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet"><style>' + sc.css + FRAME_CSS + '</style></head><body>' + sc.body + s + '<' + 'script>' + sc.js.replace(/<\/script/gi, '<\\/script') + '<' + '/script></body></html>';
  }
  function go(id) {
    if (id && !allowed().some(m => m.id === id)) { toast(T('err.FORBIDDEN')); return; }
    leave();
    cur = id || null; Acces.of(core).touch();
    if (!cur) { $('sh-frame').hidden = true; $('sh-home').hidden = false; renderHome(); }
    else { $('sh-home').hidden = true; const f = $('sh-frame'); f.hidden = false; gen++; core.on = gated; f.srcdoc = frameDoc(cur); }
    syncBar();
  }
  function leave() { gen++; core.on = _on; const f = $('sh-frame'); f.srcdoc = ''; f.hidden = true; }

  /* ---- outils (gérant) */
  function sheet(html) { const r = $('sh-sheet'); r.innerHTML = html ? '<div class="scrim" data-a="shut"></div><div class="box">' + html + '</div>' : ''; }
  function toolsSheet() {
    sheet('<h3>' + esc(T('sh.tools')) + '</h3><p>' + esc(T('sh.ver', { v: VERSION, n: core.fmt.int(core.all().length) })) + '</p><p>' + esc(T('sh.offline')) + '</p>' +
      '<button class="btn" data-a="seed">' + esc(T('sh.seed')) + '</button><p>' + esc(T('sh.seed.help')) + '</p>' +
      '<button class="btn danger" data-a="wipe">' + esc(T('sh.wipe')) + '</button>' +
      '<button class="btn" data-a="shut">' + esc(T('sh.close')) + '</button>');
  }
  function wipeSheet() {
    sheet('<h3>' + esc(T('sh.wipe')) + '</h3><p>' + esc(T('sh.wipe.help')) + '</p><input id="sh-conf" type="text" autocomplete="off" autocapitalize="characters" dir="ltr">' +
      '<button class="btn danger" data-a="wipeok">' + esc(T('sh.wipe.go')) + '</button><button class="btn" data-a="shut">' + esc(T('sh.close')) + '</button>');
  }
  function seedAll() {
    if (!Catalogue.getProducts(core).length) Catalogue.seed(core);
    Prix.seed(core);
    if (!Achats.getSuppliers(core).length) { Achats.seed(core); Stock.seed(core); }
    if (!Clients.getClients(core).length) Credit.seed(core);
    if (!Journee.expenses(core).length) Journee.seed(core);
    toast(T('sh.seeded'));
  }

  document.addEventListener('click', async e => {
    const g = e.target.closest('[data-go]'); if (g) { go(g.dataset.go); return; }
    const b = e.target.closest('[data-a]'); if (!b) return; const a = b.dataset.a;
    try {
      if (a === 'home') go(null);
      else if (a === 'lang') core.setPref('lang', core.getPref('lang') === 'fr' ? 'ar' : 'fr');
      else if (a === 'theme') { const o = ['auto', 'light', 'dark']; core.setPref('theme', o[(o.indexOf(core.getPref('theme')) + 1) % 3]); }
      else if (a === 'lock') lock();
      else if (a === 'tools') toolsSheet();
      else if (a === 'shut') sheet('');
      else if (a === 'seed') { seedAll(); sheet(''); renderHome(); }
      else if (a === 'wipe') wipeSheet();
      else if (a === 'wipeok') {
        if ($('sh-conf').value.trim() !== 'EFFACER') { toast(T('sh.wipe.bad')); return; }
        await core.flush(); await core.adapter.clear(); location.reload();
      }
    } catch (x) { toast(x && x.message ? x.message : String(x)); }
  });

  /* ---- porte */
  let gateUi = null;
  function lock() { sheet(''); leave(); cur = null; gateUi.lock(); }
  gateUi = Gate.mount(core, {
    el: $('gate'), toast,
    onShow() { sheet(''); leave(); cur = null; $('shell').hidden = true; },
    onEnter() { $('shell').hidden = false; go(null); }
  });
  window.__ggl = { core, libs: LIBS, lock, go, toast, version: VERSION };
  onShell('lang', () => { applyPrefs(); if (!gateUi.visible) { syncBar(); if (!cur) renderHome(); } });
  onShell('theme', applyPrefs);
  applyPrefs();
  gateUi.start();

  /* ---- PWA : service worker + mise à jour */
  if ('serviceWorker' in navigator && location.protocol !== 'file:' && !window.__NO_SW) {
    navigator.serviceWorker.register('sw.js').then(reg => {
      const ready = w => { $('upd').classList.add('on'); $('upd-go').onclick = () => w.postMessage('skip'); };
      if (reg.waiting && navigator.serviceWorker.controller) ready(reg.waiting);
      reg.addEventListener('updatefound', () => { const w = reg.installing; if (w) w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) ready(w); }); });
    }).catch(() => { /* hors HTTPS : pas de mode hors ligne, l'app marche quand même */ });
    let reloaded = false; navigator.serviceWorker.addEventListener('controllerchange', () => { if (!reloaded) { reloaded = true; location.reload(); } });
  }
})();
</script>
</body>
</html>
