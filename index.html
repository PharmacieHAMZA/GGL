d: d.v, motif: 'erreur' }); },\n    voidOk: () => { Retours.voidReturn(core, S.sheet.id, t('m_' + S.sheet.motif), undefined); S.sheet = null; toast(t('voided')); },\n    closeSheet: () => { S.sheet = null; },\n    openTools: () => openSheet({ type: 'tools' }), openWipe: () => openSheet({ type: 'wipe' }),\n    seedAll: () => {\n      if (!Catalogue.getProducts(core).length) Catalogue.seed(core); Prix.seed(core); if (!Achats.getSuppliers(core).length) { Achats.seed(core); Stock.seed(core); }\n      if (!Clients.getClients(core).length) { const c = Clients.createClient(core, { name: 'Restaurant Le Palmier', ceiling: 200000 }); const p = Catalogue.getProducts(core).find(x => x.draw === 'tom') || Catalogue.getProducts(core)[0]; Ventes.record(core, { cid: c.id, paid: 2000, items: [{ pid: p.id, unit: 'kg', qm: 40000 }] }); }\n      toast(t('seeded'));\n    },\n    wipeOk: () => { core.flush().then(() => Promise.reject(new Error(\"off\"))).then(() => location.reload()); return 'none'; },\n    runTests: () => {\n      S.sheet.busy = true; renderSheet();\n      setTimeout(async () => {\n        try {\n          const ix = typeof indexedDB !== 'undefined' ? indexedDB : null, all = [];\n          all.push(...await TestsNoyau.run(Noyau, { indexedDB: ix })); all.push(...await TestsM3.run(Noyau, Catalogue, Dessins)); all.push(...await TestsM12.run(Noyau, Acces, Reglages, Catalogue));\n          all.push(...await TestsM4M8.run(Noyau, Acces, Reglages, Clients, Credit)); all.push(...await TestsM5.run(Noyau, Acces, Reglages, Catalogue, Clients, Prix, Dessins));\n          all.push(...await TestsM7.run(Noyau, Acces, Reglages, Catalogue, Clients, Credit, Prix, Ventes)); all.push(...await TestsM9.run(Noyau, Acces, Reglages, Catalogue, Clients, Prix, Achats));\n          all.push(...await TestsM10.run(Noyau, Acces, Reglages, Catalogue, Clients, Credit, Prix, Ventes, Achats, Stock));\n          all.push(...await TestsM12R.run(Noyau, Acces, Reglages, Catalogue, Clients, Credit, Prix, Ventes text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }\n.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }\n.seg button { min-height: 48px; border-radius: 12px; border: 1px solid var(--line); font-weight: 700; }\n.seg button[aria-pressed=\"true\"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }\n.total { display: flex; justify-content: space-between; align-items: baseline; padding: 4px 4px; }\n.total b { font-family: var(--display); font-size: 2.2rem; font-weight: 800; font-variant-numeric: tabular-nums; }\n.sum { display: flex; flex-direction: column; gap: 4px; padding: 12px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; font-variant-numeric: tabular-nums; }\n.sum div { display: flex; justify-content: space-between; gap: 10px; }\n.paper .ln { display: flex; flex-direction: column; gap: 1px; }\n.tile.nop { opacity: .5; }\n.tile .flag { position: absolute; top: 6px; inset-inline-start: 6px; font-size: .68rem; font-weight: 700; padding: 1px 7px; border-radius: 99px; background: var(--warn-bg); color: var(--warn); }\n.tabbar { position: sticky; bottom: calc(env(safe-area-inset-bottom, 0px) + 6px); display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 6px; }\n.tabbar button { min-height: 52px; border-radius: 12px; font-weight: 700; color: var(--muted); }\n.tabbar button[aria-current=\"page\"] { background: var(--accent); color: var(--accent-ink); }\n.stat4 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }\n.stat4 div { background: var(--bg); border-radius: 12px; padding: 8px 12px; }\n.stat4 small { display: block; color: var(--muted); font-size: .75rem; }\n.stat4 b { font-variant-numeric: tabular-nums; }\n:root { --tile-s: 70%; --tile-l: 90%; }\n@media (prefers-color-scheme: dark) { :root:not([data-theme=\"light\"]) { --tile-s: 28%; --tile-l: 22%; } }\n:root[data-theme=\"dark\"] { --tile-s: 28%; --tile-l: 22%; }\n/* Porte d'entrée : styles autonomes (préfixe g-), utilisent les jetons de la page s'ils existent. */\n.g-wrap{max-width:420px;margin:0 auto;padding:28px 16px 20px;text-align:center;color:var(--ink,#1d2a1f)}\n.g-wrap h2{font-size:22px;margin:0 0 6px;letter-spacing:-.01em;text-transform:none;color:inherit}\n.g-muted{color:var(--muted,#66705f);font-size:14px}\n.g-dots{display:flex;gap:12px;justify-content:center;margin:20px 0 8px;min-height:20px}\n.g-dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--muted,#66705f);display:block}\n.g-dots i.on{background:var(--accent,#2f7d3a);border-color:var(--accent,#2f7d3a)}\n.g-msg{min-height:44px;font-size:14px;color:var(--bad,#b3261e)}.g-msg.info{color:var(--muted,#66705f)}\n.g-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:8px auto 0;max-width:300px;direction:ltr}\n.g-pad button{min-height:64px;border-radius:18px;border:1px solid var(--line,#e2e0d6);background:var(--surface,#fff);color:var(--ink,#1d2a1f);font:inherit;font-size:24px;font-weight:600;cursor:pointer;touch-action:manipulation}\n.g-pad button:active{background:var(--accent-soft,#e3f1e2)}.g-pad .go{background:var(--accent,#2f7d3a);color:var(--accent-ink,#fff);border-color:var(--accent,#2f7d3a)}\n.g-code{font-family:ui-monospace,Menlo,monospace;font-size:26px;font-weight:700;letter-spacing:.06em;direction:ltr;padding:16px;border:2px dashed var(--accent,#2f7d3a);border-radius:14px;margin:16px 0;background:var(--accent-soft,#e3f1e2);color:var(--accent,#2f7d3a)}\n.g-btn{display:block;width:100%;min-height:52px;margin:8px 0;border-radius:14px;border:1px solid var(--line,#e2e0d6);background:var(--surface,#fff);color:var(--ink,#1d2a1f);font:inherit;font-weight:700;cursor:pointer}\n.g-btn.primary{background:var(--accent,#2f7d3a);color:var(--accent-ink,#fff);border-color:var(--accent,#2f7d3a)}.g-btn:disabled{opacity:.45}\n.g-row{display:flex;gap:8px}.g-row .g-btn{flex:1}\n.g-chip{min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line,#e2e0d6);background:var(--surface,#fff);color:var(--ink,#1d2a1f);font:inherit;font-weight:600;cursor:pointer;margin-top:14px}\n.g-ack{display:flex;gap:10px;align-items:center;justify-content:center;margin:14px 0}.g-ack input{width:24px;height:24px}\n.g-input{width:100%;min-height:52px;border-radius:12px;border:1px solid var(--line,#e2e0d6);background:var(--surface,#fff);color:var(--ink,#1d2a1f);font:inherit;text-align:center;margin-top:14px;padding:8px 12px}\n","body":"\n<div id=\"gate\"><\/div>\n<div class=\"app\" id=\"app\"><\/div>\n<div id=\"sheet-root\"><\/div>\n<div id=\"toast-root\"><\/div>\n","js":"/* Écrans Journée (M13) : espèces attendues, fond de caisse, dépenses, clôture, résultat du jour, historique. */\n(async function () {\n  'use strict';\n  const core = Noyau.create({ adapter: 'auto', auto: { name: 'ggl-m13-test', key: 'ggl.m13.test' } });\n  await core.init();\n  [Acces, Reglages, Catalogue, Clients, Credit, Prix, Ventes, Achats, Stock, Consignes, Retours, Journee].forEach(m => core.use(m.module));\n  const acc = Acces.of(core), can = p => core.can(p);\n\n  const TX = {\n    fr: {\n      banner: 'Version test : données gardées sur cet appareil seulement', back: 'Retour', close: 'Fermer', cancel: 'Annuler', lockBtn: 'Verrouiller', themeBtn: 'Thème', tDay: 'Journée', tHist: 'Historique', navDay: 'Jour', navHist: 'Historique',\n      expected: 'Espèces attendues dans le tiroir', opening: 'Fond d’ouverture', oSaisi: 'saisi', oCloture: 'repris de la clôture du {d}', oAucun: 'aucun', inLbl: 'Entrées', outLbl: 'Sorties',\n      i_sales: 'Ventes au comptant', i_payments: 'Versements clients', i_deposits: 'Consignes encaissées', o_arrivals: 'Arrivages payés', o_suppliers: 'Fournisseurs payés', o_expenses: 'Dépenses', o_returns: 'Retours rendus en espèces', o_refunds: 'Consignes remboursées',\n      sales: 'Ventes du jour', nSales: 'tickets', credit: 'Dont à crédit', retVal: 'Retours clients', result: 'Résultat du jour', rRev: 'Chiffre d’affaires net', rCost: 'Coût des marchandises', rMargin: 'Marge brute', rLoss: 'Pertes de stock', rRecv: 'Pertes à la réception', rExp: 'Dépenses', rNet: 'Résultat', estimated: 'Inclut des coûts estimés.',\n      top: 'Produits vendus', voids: 'Annulations', noVoid: 'Aucune annulation.', byWho: 'par',\n      openBtn: 'Fond de caisse', expBtn: 'Dépense', closeBtn: 'Clôturer la journée', closed: 'Journée clôturée', counted: 'Compté', diff: 'Écart', stale: 'Le rapport a changé depuis la clôture.', after: '{n} opération(s) après la clôture.', voidClose: 'Annuler la clôture',\n      openTitle: 'Fond de caisse', openSub: 'Espèces dans le tiroir à l’ouverture', openOk: 'Enregistrer le fond', expTitle: 'Nouvelle dépense', cat: 'Catégorie', c_transport: 'Transport', c_salaire: 'Salaire', c_loyer: 'Loyer', c_energie: 'Énergie', c_autre: 'Autre', expOk: 'Enregistrer la dépense',\n      closeTitle: 'Clôture de la journée', countLbl: 'Espèces comptées dans le tiroir', closeOk: 'Clôturer', note: 'Note', n_none: 'Aucune', n_pieces: 'Pièces manquantes', n_erreur: 'Erreur de rendu', n_autre: 'Autre', da: 'DA',\n      voidTitle: 'Annuler la clôture', voidOk: 'Annuler la clôture', voidMotif: 'Motif', m_recompte: 'Recomptage', m_erreur: 'Erreur de saisie',\n      done: 'Enregistré : {n}', voided: 'Clôture annulée', histNone: 'Aucune journée enregistrée.', noClose: 'Non clôturée', denied: 'Réservé au gérant.',\n      tools: 'Outils', seedAll: 'Charger exemples (ventes, achats, caisses, retours, fond, dépenses)', seeded: 'Exemples chargés', toggleTr: 'Basculer transport par arrivage / global', setNow: 'Transport : {v}',\n      runTests: 'Lancer tous les tests', running: 'Exécution…', result_: '{ok}/{n} réussis', wipe: 'Effacer toutes les données de ce test', wipeWarn: 'Tout sera effacé, code gérant compris. Vous recommencerez à zéro.', wipeDo: 'Tout effacer'\n    },\n    ar: {\n      banner: 'نسخة تجريبية: البيانات ناديق، مرتجعات، رصيد، مصروفات)', seeded: 'تم تحميل الأمثلة', toggleTr: 'تبديل النقل: لكل شحنة / عام', setNow: 'النقل: {v}',\n      runTests: 'تشغيل كل الاختبارات', running: 'جارٍ التنفيذ…', result_: 'نجح {ok}/{n}', wipe: 'مسح كل بيانات هذا الاختبار', wipeWarn: 'سيُمسح كل شيء بما فيه رمز المسير. ستبدأ من الصفر.', wipeDo: 'مسح الكل'\n    }\n  };\n  const pre = o => Object.fromEntries(Object.entries(o).map(([k, v]) => ['ju.' + k, v]));\n  core.addStrings({ fr: pre(TX.fr), ar: pre(TX.ar) });\n\n  const S = { tab: 'day', key: null, sheet: null };\n  const LANG = () => core.getPref('lang'), t = (k, v) => core.t('ju.' + k, v);\n  const esc = s => String(s == null ? '' : s).replace(/[&<>\"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;' }[c]));\n  const money = n => core.fmt.da(Math.round(n)), kgTxt = g => core.fmt.kg(g), fmt = n => core.fmt.int(n);\n  const errText = e => { if (e.code === 'GUARD' || e.code === 'CHECK' || e.code === 'FORBIDDEN') return e.message; const k = 'err.' + e.code, s = core.t(k); return s !== k ? s : (e.message || String(e)); };\n  const idTxt = id => id.replace(/^([A-Z]+)(\\d+)$/, '$1-$2');\n  const curKey = () => S.key || Prix.dayKey(core.now());\n  const dateOf = key => { const [y, m, d] = key.split('-').map(Number); return core.fmt.date(new Date(y, m - 1, d, 12).getTime()); };\n  const pname = id => { const p = Catalogue.getProducts(core).find(x => x.id === id); return p ? (LANG() === 'ar' && p.ar ? p.ar : p.fr) : id; };\n  const nOf = s => parseInt(s || '0', 10) || 0;\n  const sgn = n => (n > 0 ? '+' : n < 0 ? '−' : '') + money(Math.abs(n));\n\n  function header() {\n    return '<header class=\"head\"><div class=\"head-row\"><h1>' + t(S.tab === 'day' ? 'tDay' : 'tHist') + (S.tab === 'day' ? ' · ' + dateOf(curKey()) : '') + '<\/h1><button class=\"icon-btn\" data-a=\"theme\" aria-label=\"' + t('themeBtn') + '\">◐<\/button><button class=\"icon-btn\" data-a=\"lock\" aria-label=\"' + t('lockBtn') + '\">🔒<\/button><\/div>' +\n      '<div class=\"lang\" role=\"group\"><button data-a=\"lang\" data-v=\"fr\" aria-pressed=\"' + (LANG() === 'fr') + '\">FR<\/button><button data-a=\"lang\" data-v=\"ar\" aria-pressed=\"' + (LANG() === 'ar') + '\">ع<\/button><\/div>' +\n      '<div class=\"pillrow\"><span class=\"rolepill ' + (acc.role === 'depannage' ? 'dep' : '') + '\">' + esc(core.t('role.' + acc.role)) + '<\/span><span class=\"sample\">' + t('banner') + '<\/span><\/div><\/header>';\n  }\n  const nav = () => '<nav class=\"tabbar\"><button data-a=\"tab\" data-v=\"day\" ' + (S.tab === 'day' ? 'aria-current=\"page\"' : '') + '>' + t('navDay') + '<\/button><button data-a=\"tab\" data-v=\"hist\" ' + (S.tab === 'hist' ? 'aria-current=\"page\"' : '') + '>' + t('navHist') + '<\/button><\/nav>';\n  const row = (l, v, cls) => '<div class=\"row-between\"><span class=\"sub\">' + l + '<\/span><b' + (cls ? ' style=\"color:var(--' + cls + ')\"' : '') + '>' + v + '<\/b><\/div>';\n\n  function screenDay() {\n    const key = curKey(), r = Journee.report(core, key), o = r.opening, isToday = key === Prix.dayKey(core.now());\n    const oSrc = o.src === 'saisi' ? t('oSaisi') : o.src === 'cloture' ? t('oCloture', { d: dateOf(o.from) }) : t('oAucun');\n    let h = '<div class=\"card\"><span class=\"label\" style=\"margin:0\">' + t('expected') + '<\/span><span class=\"big\">' + money(r.expected) + '<\/span>' + row(t('opening'), money(o.amount) + ' · ' + oSrc) + '<\/div>';\n    if (r.closed) {\n      const c = r.closed; h += '<div class=\"card\"><div class=\"row-between\"><b>' + t('closed') + ' · ' + idTxt(c.id) + '<\/b><span class=\"pill ' + (c.diff === 0 ? 'ok' : 'bad') + '\">' + (c.diff === 0 ? '✓' : sgn(c.diff)) + '<\/span><\/div>' + row(t('counted'), money(c.counted)) + row(t('diff'), sgn(c.diff), c.diff < 0 ? 'bad' : c.diff > 0 ? 'ok' : '') +\n        (c.note ? '<span class=\"sub\">' + esc(c.note) + '<\/span>' : '') + (c.stale ? '<span class=\"note warn\">' + t('stale') + '<\/span>' : '') + (r.afterClose ? '<span class=\"note warn\">' + t('after', { n: r.afterClose }) + '<\/span>' : '') + (can('annuler') ? '<button class=\"linkish\" data-a=\"openVoid\">' + t('voidClose') + '<\/button>' : '') + '<\/div>';\n    } else h += '<div class=\"row2\"><button class=\"btn ghost\" data-a=\"openOpen\"' + (r.opening.src === 'saisi' ? ' disabled' : '') + '>' + t('openBtn') + '<\/button>' + (can('depenses') ? '<button class=\"btn ghost\" data-a=\"openExp\">' + t('expBtn') + '<\/button>' : '') + '<\/div><button class=\"btn\" data-a=\"openClose\">' + t('closeBtn') + '<\/button>';\n    h += '<div class=\"card\"><b>' + t('inLbl') + ' · ' + money(r.inTotal) + '<\/b>' + ['sales', 'payments', 'deposits'].map(k => row(t('i_' + k), money(r.cashIn[k]))).join('') + '<\/div>' +\n      '<div class=\"card\"><b>' + t('outLbl') + ' · ' + money(r.outTotal) + '<\/b>' + ['arrivals', 'suppliers', 'expenses', 'returns', 'refunds'].map(k => row(t('o_' + k), money(r.cashOut[k]))).join('') + '<\/div>' +\n      '<div class=\"card\"><b>' + t('sales') + '<\/b>' + row(r.sales.count + ' ' + t('nSales') + ' · ' + kgTxt(r.sales.kg), money(r.sales.total)) + row(t('credit'), money(r.sales.credit)) + (r.returns.count ? row(t('retVal'), '−' + money(r.returns.value)) : '') + '<\/div>';\n    if (r.byProduct.length) h += '<div class=\"label\">' + t('top') + '<\/div><div class=\"card\" style=\"padding-block:4px\">' + r.byProduct.slice(0, 6).map(x => '<div class=\"line\"><div class=\"grow\"><b>' + esc(pname(x.pid)) + '<\/b><small>' + kgTxt(x.g) + '<\/small><\/div><span class=\"amt\">' + money(x.amount) + '<\/span><\/div>').join('') + '<\/div>';\n    if (r.result) { const z = r.result; h += '<div class=\"label\">' + t('result') + '<\/div><div class=\"card\">' + row(t('rRev'), money(z.revenue)) + row(t('rCost'), '−' + money(z.cost)) + row(t('rMargin'), money(z.margin)) + row(t('rLoss'), '−' + money(z.lossValue)) + row(t('rRecv'), '−' + money(z.receptionLoss)) + row(t('rExp'), '−' + money(z.expenses)) + '<\/div><div class=\"total\"><span ', { n: idTxt(o.id) })); },\n    expOk: () => { const o = Journee.addExpense(core, S.sheet.cat, nOf(S.sheet.val)); S.sheet = null; toast(t('done', { n: idTxt(o.id) })); },\n    closeOk: () => { const o = Journee.closeDay(core, nOf(S.sheet.val), { key: curKey(), note: NOTES[S.sheet.note] }); S.sheet = null; toast(t('done', { n: idTxt(o.id) })); },\n    voidOk: () => { const c = Journee.closeOf(core, curKey()); core.void(c.n, t('m_' + S.sheet.motif)); S.sheet = null; toast(t('voided')); },\n    closeSheet: () => { S.sheet = null; },\n    openTools: () => openSheet({ type: 'tools' }), openWipe: () => openSheet({ type: 'wipe' }),\n    toggleTr: () => { const nv = core.getSetting('achats.transport') === 'global' ? 'arrivage' : 'global'; core.setSetting('achats.transport', nv); toast(t('setNow', { v: nv })); },\n    seedAll: () => {\n      if (!Catalogue.getProducts(core).length) Catalogue.seed(core); Prix.seed(core); if (!Achats.getSuppliers(core).length) { Achats.seed(core); Stock.seed(core); }\n      if (!Clients.getClients(core).length) ['Restaurant Le Palmier', 'Épicerie Nour'].forEach((n, i) => Clients.createClient(core, { name: n, ceiling: 200000, consigne: i ? 'suivi' : 'avec' }));\n      if (!Consignes.clients(core).length) Consignes.seed(core); if (!Retours.list(core).length) Retours.seed(core); if (!Journee.expenses(core).length) Journee.seed(core); toast(t('seeded'));\n    },\n    wipeOk: () => { core.flush().then(() => Promise.reject(new Error(\"off\"))).then(() => location.reload()); return 'none'; },\n    runTests: () => {\n      S.sheet.busy = true; renderSheet();\n      setTimeout(async () => {\n        try {\n          const ix = typeof indexedDB !== 'undefined' ? indexedDB : null, all = [];\n          all.push(...await TestsNoyau.run(Noyau, { indexedDB: ix })); all.push(...await TestsM3.run(Noyau, Catalogue, Dessins)); all.push(...await TestsM12.run(Noyau, Acces, Reglages, Catalogue));\n          all.push(...await TestsM4M8.run(Noyau, Acces, Reglages, C ng:0 16px;border-radius:999px;border:1px solid var(--line,#e2e0d6);background:var(--surface,#fff);color:var(--ink,#1d2a1f);font:inherit;font-weight:600;cursor:pointer;margin-top:14px}\n.g-ack{display:flex;gap:10px;align-items:center;justify-content:center;margin:14px 0}.g-ack input{width:24px;height:24px}\n.g-input{width:100%;min-height:52px;border-radius:12px;border:1px solid var(--line,#e2e0d6);background:var(--surface,#fff);color:var(--ink,#1d2a1f);font:inherit;text-align:center;margin-top:14px;padding:8px 12px}\n","body":"\n<div id=\"gate\"><\/div>\n<div class=\"app\" id=\"app\"><\/div>\n<div id=\"sheet-root\"><\/div>\n<div id=\"toast-root\"><\/div>\n","js":"/* Écrans Statistiques (M14) : résumé, produits, clients, fournisseurs, dettes ; période au choix. Lecture seule. */\n(async function () {\n  'use strict';\n  const core = Noyau.create({ adapter: 'auto', auto: { name: 'ggl-m14-test', key: 'ggl.m14.test' } });\n  await core.init();\n  [Acces, Reglages, Catalogue, Clients, Credit, Prix, Ventes, Achats, Stock, Consignes, Retours, Journee, Stats].forEach(m => core.use(m.module));\n  const acc = Acces.of(core), can = p => core.can(p);\n\n  const TX = {\n    fr: {\n      banner: 'Version test : données gardées sur cet appareil seulement', close: 'Fermer', cancel: 'Annuler', lockBtn: 'Verrouiller', themeBtn: 'Thème', title: 'Statistiques', denied: 'Réservé au gérant.',\n      nSum: 'Résumé', nProd: 'Produits', nCli: 'Clients', nSup: 'Fournisseurs', nDebt: 'Dettes',\n      p_today: 'Aujourd’hui', p_7d: '7 jours', p_30d: '30 jours', p_month: 'Ce mois', p_all: 'Tout',\n      revenue: 'Chiffre d’affaires net', margin: 'Marge brute', net: 'Résultat', vsPrev: 'vs période précédente', tickets: 'tickets', basket: 'Panier moyen', credit: 'Vendu à crédit', cash: 'Encaissé comptant',\n      costs: 'Détail', cost: 'Coût des marchandises', retVal: 'Retours clients', lossS: 'Pertes de stock', lossR: 'Pertes à la réception', exp: 'Dépenses', daily: 'Chiffre d’affaires par jour', none: 'Aucune donnée sur cette période.',\n      sortBy: 'Trier par', s_margin: 'Marge', s_revenue: 'CA', s_g: 'Poids', kgSold: 'vendus', avgPrice: 'prix moyen', lost: 'perdus', recv: 'écartés',\n      comptoir: 'Comptoir (sans client)', owes: 'doit', ok: 'à jour', watch: 'à surveiller', late: 'en retard', days: 'j', ceiling: 'plafond',\n      bought: 'Acheté', paidRec: 'payé à la réception', debt: 'Reste dû', bad: 'poids écarté', arrivals: 'arrivages',\n      debtNone: 'Aucune dette client.', total: 'Total', tools: 'Outils', seedAll: 'Charger exemples (ventes, achats, retours, dépenses…)', seeded: 'Exemples chargés', runTests: 'Lancer tous les tests', running: 'Exécution…', result: '{ok}/{n} réussis',\n      wipe: 'Effacer toutes les données de ce test', wipeWarn: 'Tout sera effacé, code gérant compris. Vous recommencerez à zéro.', wipeDo: 'Tout effacer'\n    },\n    ar: {\n      banner: 'نسخة تجريبية: البيانات محفوظة على هذا الجهاز فقط', close: 'إغلاق', cancel: 'إلغاء', lockBtn: 'قفل', themeBtn: 'المظهر', title: 'الإحصائيات', denied: 'للمسير فقط.',\n      nSum: 'الملخص', nProd: 'المنتجات', nCli: 'الزبائن', nSup: 'الموردون', nDebt: 'الديون',\n      p_today: 'اليوم', p_7d: '7 أيام', p_30d: '30 يومًا', p_month: 'هذا الشهر', p_all: 'الكل',\n      revenue: 'رقم الأعمال الصافي', margin: 'الهامش الإجمالي', net: 'النتيجة', vsPrev: 'مقارنة بالفترة السابقة', tickets: 'تذاكر', basket: 'متوسط السلة', credit: 'مباع بالدين', cash: 'محصّل نقدًا',\n      costs: 'التفاصيل', cost: 'تكلفة البضاعة', retVal: 'مرتجعات الزبائن', lossS: 'خسائر المخزون', lossR: 'خسائر الاستلام', exp: 'مصروفات', daily: 'رقم الأعمال حسب اليوم', none: 'لا بيانات في هذه الفترة.',\n      sortBy: 'ترتيب حسب', s_margin: 'الهامش', s_revenue: 'المبيعات', s_g: 'الوزن', kgSold: 'مباعة', avgPrice: 'متوسط السعر', lost: 'مفقودة', recv: 'مستبعدة',\n      comptoir: 'بيع مباشر (بدون زبون)', owes: 'عليه', ok: 'منتظم', watch: 'للمراقبة', late: 'متأخر', days: 'ي', ceiling: 'السقف',\n      bought: 'المشتريات', paidRec: 'مدفوع عند الاستلام', debt: 'المتبقي', bad: 'وزن مستبعد', arrivals: 'إرساليات',\n      debtNone: 'لا ديون على الزبائن.', total: 'المجموع', tools: 'أدوات', seedAll: 'تحميل أمثلة (مبيعات، مشتريات، مرتجعات، مصروفات…)', seeded: 'تم تحميل الأمثلة', runTests: 'تشغيل كل الاختبارات', running: 'جارٍ التنفيذ…', result: 'نجح {ok}/{n}',\n      wipe: 'مسح كل بيانات هذا الاختبار', wipeWarn: 'سيُمسح كل شيء بما فيه رمز المسير. ستبدأ من الصفر.', wipeDo: 'مسح الكل'\n    }\n  };\n  const pre = o => Object.fromEntries(Object.entries(o).map(([k, v]) => ['st14.' + k, v]));\n  core.addStrings({ fr: pre(TX.fr), ar: pre(TX.ar) });\n\n  const S = { tab: 'sum', preset: '30d', sort: 'margin', sheet: null };\n  const LANG = () => core.getPref('lang'), t = (k, v) => core.t('st14.' + k, v);\n  const esc = s => String(s == null ? '' : s).replace(/[&<>\"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;' }[c]));\n  const money = n => core.fmt.da(Math.round(n)), kgTxt = g => core.fmt.kg(g), fmt = n => core.fmt.int(n), pct = Stats.pctText;\n  const errText = e => { if (e.code === 'GUARD' || e.code === 'CHECK' || e.code === 'FORBIDDEN') return e.message; const k = 'err.' + e.code, s = core.t(k); return s !== k ? s : (e.message || String(e)); };\n  const sgn = n => (n > 0 ? '+' : n < 0 ? '−' : '') + money(Math.abs(n));\n  const rng = () => Stats.range(core, S.preset);\n\n  function header() {\n    return '<header class=\"head\"><div class=\"head-row\"><h1>' + t('title') + '<\/h1><button class=\"icon-btn\" data-a=\"theme\" aria-label=\"' + t('themeBtn') + '\">◐<\/button><button class=\"icon-btn\" data-a=\"lock\" aria-label=\"' + t('lockBtn') + '\">🔒<\/button><\/div>' +\n      '<div class=\"lang\" role=\"group\"><button data-a=\"lang\" data-v=\"fr\" aria-pressed=\"' + (LANG() === 'fr') + '\">FR<\/button><button data-a=\"lang\" data-v=\"ar\" aria-pressed=\"' + (LANG() === 'ar') + '\">ع<\/button><\/div>' +\n      '<div class=\"pillrow\"><span class=\"rolepill ' + (acc.role === 'depannage' ? 'dep' : '') + '\">' + esc(core.t('role.' + acc.role)) + '<\/span><span class=\"sample\">' + t('banner') + '<\/span><\/div><\/header>';\n  }\n  const nav = () => '<nav class=\"tabbar\">' + [['sum', 'nSum'], ['prod', 'nProd'], ['cli', 'nCli'], ['sup', 'nSup'], ['debt', 'nDebt']].map(([k, l]) => '<button data-a=\"tab\" data-v=\"' + k + '\" ' + (S.tab === k ? 'aria-current=\"page\"' : '') + '>' + t(l) + '<\/button>').join('') + '<\/nav>';\n  const periods = () => '<div class=\"chips\">' + Stats.PRESETS.map(p => '<button data-a=\"preset\" data-v=\"' + p + '\" aria-pressed=\"' + (S.preset === p) + '\">' + t('p_' + p) + '<\/button>').join('') + '<\/div>';\n  const row = (l, v, cls) => '<div class=\"row-between\"><span class=\"sub\">' + l + '<\/span><b' + (cls ? ' style=\"color:var(--' + cls + ')\"' : '') + '>' + v + '<\/b><\/div>';\n  const delta = d => (d.pm == null ? '' : '<span class=\"pill ' + (d.delta >= 0 ? 'ok' : 'bad') + '\">' + (d.delta >= 0 ? '▲ ' : '▼ ') + pct(Math.abs(d.pm)) + '<\/span>');\n\n  function bars(daily) {\n    const l = daily.slice(-31), max = Math.max(1, ...l.map(d => d.revenue));\n    return '<div role=\"img\" aria-label=\"' + t('daily') + '\" style=\"display:flex;align-items:flex-end;gap:2px;height:96px;direction:ltr\">' + l.map(d => { const h = Math.max(2, Math.round(d.revenue * 90 / max)), m = d.margin > 0 ? Math.round(Math.min(h, d.margin * 90 / max)) : 0;\n      return '<div title=\"' + d.key + ' · ' + money(d.revenue) + '\" style=\"flex:1;min-width:2px;height:' + h + 'px;border-radius:3px 3px 0 0;background:linear-gradient(to top,var(--accent,#0f6b57) ' + m + 'px,var(--tile-l,#c9dcd5) ' + m + 'px)\"><\/div>'; }).join('') + '<\/div>';\n  }\n  function screenSum() {\n    const r = rng(), c = Stats.compare(core, r.from, r.to), T = c.cur.totals;\n    if (!T.count && !T.returns && !T.expenses && !T.lossValue) return periods() + '<div class=\"empty\">' + t('none') + '<\/div>';\n    return periods() + '<div class=\"card\"><span class=\"label\" style=\"margin:0\">' + t('revenue') + '<\/span><span class=\"big\">' + money(T.revenue) + '<\/span><div class=\"row-between\"><span class=\"sub\">' + t('vsPrev') + '<\/span>' + delta(c.revenue) + '<\/div><\/div>' +\n      '<div class=\"row2\"><div class=\"card\"><span class=\"label\" style=\"margin:0\">' + t('margin') + '<\/span><b class=\"big\" style=\"font-size:1.3em\">' + money(T.margin) + '<\/b><span class=\"sub\">' + pct(T.marginPm) + ' ' + delta(c.margin) + '<\/span><\/div><div class=\"card\"><span class=\"label\" style=\"margin:0\">' + t('net') + '<\/span><b class=\"big\" style=\"font-size:1.3em;color:var(--' + (T.net < 0 ? 'bad' : 'ok') + ')\">' + money(T.net) + '<\/b><span class=\"sub\">' + delta(c.net) + '<\/span><\/div><\/div>' +\n      '<div class=\"card\"><b>' + t('daily') + '<\/b>' + bars(c.cur.daily) + '<\/div>' +\n      '<div class=\"card\">' + row(T.count + ' ' + t('tickets'), money(T.gross)) + row(t('basket'), money(T.avgBasket)) + row(t('credit'), money(T.credit)) + row(t('cash'), money(T.cash)) + '<\/div>' +\n      '<div class=\"label\">' + t('costs') + '<\/div><div class=\"card\">' + row(t('cost'), '−' + money(T.cost)) + row(t('retVal'), T.returned ? '−' + money(T.returned) : money(0)) + row(t('lossS'), '−' + money(T.lossValue)) + row(t('lossR'), '−' + money(T.receptionValue)) + row(t('exp'), '−' + money(T.expenses)) + '<\/div>';\n  }\n  const sorter = () => '<div class=\"chips\"><span class=\"sub\">' + t('sortBy') + '<\/span>' + ['margin', 'revenue', 'g'].map(k => '<button data-a=\"sort\" data-v=\"' + k + '\" aria-pressed=\"' + (S.sort === k) + '\">' + t('s_' + k) + '<\/button>').join('') + '<\/div>';\n  function screenProd() {\n    const r = rng(), l = Stats.compute(core, r.from, r.to).products.slice().sort((a, b) => b[S.sort] - a[S.sort]);\n    return periods() + (l.length ? sorter() + '<div class=\"rows\">' + l.map(p => '<div class=\"prow\"><span class=\"nm\"><b>' + esc(LANG() === 'ar' && Catalogue.getProducts(core).find(x => x.id === p.pid) && Catalogue.getProducts(core).find(x => x.id === p.pid).ar ? Catalogue.getProducts(core).find(x => x.id === p.pid).ar : p.name) + '<\/b><small>' + kgTxt(Math.max(0, p.g)) + ' ' + t('kgSold') + ' · ' + t('avgPrice') + ' ' + core.fmt.da(Math.round(p.avgPrice)) + '/kg' + (p.lossG ? ' · ' + kgTxt(p.lossG) + ' ' + t('lost') : '') + (p.receptionG ? ' · ' + kgTxt(p.receptionG) + ' ' + t('recv') : '') + '<\/small><\/span><span class=\"pr\"><b>' + money(p.margin) + '<\/b><small>' + pct(p.marginPm) + ' · ' + money(p.revenue) + '<\/small><\/span><\/div>').join('') + '<\/div>' : '<div class=\"empty\">' + t('none') + '<\/div>');\n  }\n  const stPill = s => '<span class=\"pill ' + (s === 'late' ? 'bad' : s === 'watch' ? 'warn' : 'ok') + '\">' + t(s) + '<\/span>';\n  function screenCli() {\n    const r = rng(), l = Stats.compute(core, r.from, r.to).clients;\n    return periods() + (l.length ? '<div class=\"rows\">' + l.map(c => '<div class=\"prow\"><span class=\"nm\"><b>' + (c.name ? esc(c.name) : t('comptoir')) + '<\/b><small>' + c.count + ' ' + t('tickets') + ' · ' + t('margin') + ' ' + money(c.margin) + ' (' + pct(c.marginPm) + ')' + (c.debt ? ' · ' + t('owes') + ' ' + money(c.debt) : '') + '<\/small><\/span><span class=\"pr\"><b>' + money(c.revenue) + '<\/b>' + (c.cid ? stPill(c.status) : '') + '<\/span><\/div>').join('') + '<\/div>' : '<div class=\"empty\">' + t('none') + '<\/div>');\n  }\n  function screenSup() {\n    const r = rng(), l = Stats.compute(core, r.from, r.to).suppliers;\n    return periods() + (l.length ? '<div class=\"rows\">' + l.map(s => '<div class=\"prow\"><span class=\"nm\"><b>' + esc(s.name) + '<\/b><small>' + s.count + ' ' + t('arrivals') + ' · ' + t('paidRec') + ' ' + money(s.paidAtReception) + ' · ' + t('bad') + ' ' + pct(s.badPm) + '<\/small><\/span><span class=\"pr\"><b>' + money(s.bought) + '<\/b><small>' + t('debt') + ' ' + money(s.debt) + '<\/small><\/span><\/div>').join('') + '<\/div>' : '<div class=\"empty\">' + t('none') + '<\/div>');\n  }\n  function (t('wipe'), '') + '<span class=\"note warn\">' + t('wipeWarn') + '<\/span><div class=\"row2\"><button class=\"btn ghost\" data-a=\"closeSheet\">' + t('cancel') + '<\/button><button class=\"btn danger\" data-a=\"wipeOk\">' + t('wipeDo') + '<\/button><\/div>';\n    return '';\n  }\n  const app = () => document.getElementById('app');\n  function applyPrefs() { const th = core.getPref('theme'), de = document.documentElement; if (th === 'auto') de.removeAttribute('data-theme'); else de.setAttribute('data-theme', th); de.lang = LANG(); de.dir = LANG() === 'ar' ? 'rtl' : 'ltr'; }\n  function renderMain() { applyPrefs(); app().innerHTML = header() + '<main style=\"display:flex;flex-direction:column;gap:12px;flex:1\">' + (can('stats') ? SCREENS[S.tab]() : '<div class=\"card\"><b>' + t('denied') + '<\/b><\/div>') + '<\/main>' + (can('stats') ? nav() : ''); }\n  function renderSheet() {\n    const root = document.getElementById('sheet-root'); if (!S.sheet) { root.innerHTML = ''; return; }\n    const old = root.querySelector('.sheet'), top = old ? old.scrollTop : 0, fresh = !!S.sheet.fresh; S.sheet.fresh = false;\n    root.innerHTML = '<div class=\"scrim\" data-a=\"closeSheet\"><\/div><section class=\"sheet' + (fresh ? ' enter' : '') + '\" role=\"dialog\">' + sheetBody(S.sheet) + '<\/section>';\n    const nw = root.querySelector('.sheet'); if (nw) nw.scrollTop = top;\n  }\n  const render = () => { renderMain(); renderSheet(); };\n  let tt = null;\n  function toast(m) { const r = document.getElementById('toast-root'); r.innerHTML = '<div class=\"toast\" role=\"status\">' + esc(m) + '<\/div>'; clearTimeout(tt); tt = setTimeout(() => { r.innerHTML = ''; }, 2600); }\n  const openSheet = s => { S.sheet = Object.assign({ fresh: true }, s); };\n\n  const A = {\n    lang: d => core.setPref('lang', d.v),\n    theme: () => { const o = ['auto', 'light', 'dark']; core.setPref('theme', o[(o.indexOf(core.getPref('theme')) + 1) % 3]); },\n    lock: () => { S.sheet = null; S.tab = 'sum'; gateU v(safe-area-inset-bottom, 0px) + 6px); display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 6px; }\n.tabbar button { min-height: 52px; border-radius: 12px; font-weight: 700; color: var(--muted); }\n.tabbar button[aria-current=\"page\"] { background: var(--accent); color: var(--accent-ink); }\n.stat4 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }\n.stat4 div { background: var(--bg); border-radius: 12px; padding: 8px 12px; }\n.stat4 small { display: block; color: var(--muted); font-size: .75rem; }\n.stat4 b { font-variant-numeric: tabular-nums; }\n:root { --tile-s: 70%; --tile-l: 90%; }\n@media (prefers-color-scheme: dark) { :root:not([data-theme=\"light\"]) { --tile-s: 28%; --tile-l: 22%; } }\n:root[data-theme=\"dark\"] { --tile-s: 28%; --tile-l: 22%; }\n/* Porte d'entrée : styles autonomes (préfixe g-), utilisent les jetons de la page s'ils existent. */\n.g-wrap{max-width:420px;margin:0 auto;padding:28px 16px 20px;text-align:center;color:var(--ink,#1d2a1f)}\n.g-wrap h2{font-size:22px;margin:0 0 6px;letter-spacing:-.01em;text-transform:none;color:inherit}\n.g-muted{color:var(--muted,#66705f);font-size:14px}\n.g-dots{display:flex;gap:12px;justify-content:center;margin:20px 0 8px;min-height:20px}\n.g-dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--muted,#66705f);display:block}\n.g-dots i.on{background:var(--accent,#2f7d3a);border-color:var(--accent,#2f7d3a)}\n.g-msg{min-height:44px;font-size:14px;color:var(--bad,#b3261e)}.g-msg.info{color:var(--muted,#66705f)}\n.g-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:8px auto 0;max-width:300px;direction:ltr}\n.g-pad button{min-height:64px;border-radius:18px;border:1px solid var(--line,#e2e0d6);background:var(--surface,#fff);color:var(--ink,#1d2a1f);font:inherit;font-size:24px;font-weight:600;cursor:pointer;touch-action:manipulation}\n.g-pad button:active{background:var(  TX = {\n    fr: {\n      banner: 'Version test : données gardées sur cet appareil seulement', close: 'Fermer', cancel: 'Annuler', lockBtn: 'Verrouiller', themeBtn: 'Thème', title: 'Sauvegarde', denied: 'Réservé au gérant.',\n      st_never: 'Rien à sauvegarder pour l’instant.', st_red: 'Sauvegarde urgente', st_orange: 'Sauvegarde à faire', st_ok: 'Sauvegarde à jour', last: 'Dernière sauvegarde', never: 'Jamais', ago: 'il y a {n} j', today: 'aujourd’hui', newOps: '{n} écriture(s) depuis', records: 'écritures dans le journal',\n      backNow: 'Sauvegarder maintenant', backHelp: 'Crée un fichier avec TOUTES vos données. Envoyez-le sur WhatsApp, Drive ou une clé : un téléphone perdu, cassé ou volé ne doit pas coûter vos données.',\n      restore: 'Restaurer une sauvegarde', pickFile: 'Choisir un fichier de sauvegarde', csvTitle: 'Exporter pour Excel', csvHelp: 'Fichiers CSV (séparateur « ; »), à ouvrir dans Excel ou Google Sheets.', per_30: '30 jours', per_all: 'Tout',\n      k_sales: 'Ventes (ligne par ligne)', k_payments: 'Versements clients', k_clients: 'Clients et dettes', k_suppliers: 'Fournisseurs et dettes', k_stock: 'Stock', k_expenses: 'Dépenses', k_journal: 'Journal complet',\n      prepared: 'Fichier prêt : {name}', saved: 'Sauvegarde enregistrée', shareFail: 'Partage impossible ici : le fichier a été préparé', sent: 'Fichier remis',\n      insp: 'Fichier de sauvegarde', rec: '{n} écritures', exportedAt: 'Créé le', rel_empty: 'Appareil vide : la restauration reprend tout.', rel_older: 'Plus ancien que vos données actuelles : vous perdriez les écritures récentes.', rel_newer: 'Plus récent que vos données actuelles.', rel_other: 'Autre journal : vos données actuelles seraient remplacées.', rel_same: 'Identique à vos données actuelles.',\n      bad_notjson: 'Ce fichier n’est pas une sauvegarde.', bad_format: 'Ce fichier n’est pas une sauvegarde de cette application.', bad_sum: 'Fichier abîmé (somme de contrôle).', bad_chain: 'Fichier altéré (journal incohérent) AbortError') return false; }\n    try { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); return true; } catch (e) { return false; }\n  }\n\n  function header() {\n    return '<header class=\"head\"><div class=\"head-row\"><h1>' + t('title') + '<\/h1><button class=\"icon-btn\" data-a=\"theme\" aria-label=\"' + t('themeBtn') + '\">◐<\/button><button class=\"icon-btn\" data-a=\"lock\" aria-label=\"' + t('lockBtn') + '\">🔒<\/button><\/div>' +\n      '<div class=\"lang\" role=\"group\"><button data-a=\"lang\" data-v=\"fr\" aria-pressed=\"' + (LANG() === 'fr') + '\">FR<\/button><button data-a=\"lang\" data-v=\"ar\" aria-pressed=\"' + (LANG() === 'ar') + '\">ع<\/button><\/div>' +\n      '<div class=\"pillrow\"><span class=\"rolepill ' + (acc.role === 'depannage' ? 'dep' : '') + '\">' + esc(core.t('role.' + acc.role)) + '<\/span><span class=\"sample\">' + t('banner') + '<\/span><\/div><\/header>';\n  }\n  function screen() {\n    if (!can('sauvegarde')) return '<div class=\"card\"><b>' + t('denied') + '<\/b><\/div>';\n    const st = Backup.status(core), cls = { never: 'mute', ok: 'ok', orange: 'warn', red: 'bad' }[st.level], when = st.last ? (st.ageDays === 0 ? t('today') : t('ago', { n: st.ageDays })) + ' · ' + core.fmt.dateTime(st.last.t) : t('never');\n    return '<div class=\"card\"><div class=\"row-between\"><b>' + t('st_' + st.level) + '<\/b><span class=\"pill ' + cls + '\">' + (st.level === 'ok' ? '✓' : st.level === 'never' ? '—' : '!') + '<\/span><\/div><div class=\"row-between\"><span class=\"sub\">' + t('last') + '<\/span><b>' + when + '<\/b><\/div>' +\n      '<div class=\"row-between\"><span class=\"sub\">' + core.fmt.int(core.all().length) + ' ' + t('records') + '<\/span><span class=\"sub\">' + (st.last && st.newOps ? t('newOps', { n: core.fmt.int(st.newOps) }) : '') + '<\/span><\/div><\/div>' +\n      '<button cl <script>/* ============================================================================
   NOYAU (M0) — Gestion Gros Légumes
   Base commune de tous les modules. Aucune dépendance. Node + navigateur.

   Règles que ce fichier fait respecter (pas seulement documenter) :
     1. Tout nombre écrit au journal est un entier (grammes, DA, centimes).
     2. Le journal est en ajout seul : une écriture ne se modifie ni ne se supprime.
     3. Annuler = écrire une écriture « void » avec motif ; l'original reste visible.
     4. Aucun solde n'est stocké : on le recalcule en rejouant le journal (fold).
     5. Chaîne de hachage : toute altération du journal est détectée (verify).
     6. Les modules ne parlent qu'au noyau (types, réglages, textes, événements).

   Le hachage détecte la corruption et les modifications accidentelles ; il ne
   remplace pas un chiffrement : quelqu'un qui réécrit toute la chaîne peut la refaire.
   ========================================================================== */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();

})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  const VERSION = '0.2.0';
  const DAY = 86400000;

  /* ---------------------------------------------------------------- erreurs */
  function err(code, msg) { const e = new Error(msg || code); e.code = code; return e; }

  /* ---------------------------------------------------------- hachage canon */
  function canon(v) {
    if (v === null || typeof v !== 'object') return JSON.stringify(v);
    if (Array.isArray(v)) return '[' + v.map(canon).join(',') + ']';

    let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
    for (let i = 0, ch; i < s.length; i++) {
      ch = s.charCodeAt(i);
      h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677);

    h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
    return 4294967296 * (2097151 & h2) + (h1 >>> 0);

  function deepFreeze(o) {
    if (o && typeof o === 'object' && !Object.isFrozen(o)) {

    }
    return o;
  }

      if (!Number.isSafeInteger(v)) throw err('FLOAT', 'Nombre non entier refusé au journal : ' + path + ' = ' + v);
    } else if (Array.isArray(v)) v.forEach((x, i) => assertIntegers(x, path + '[' + i + ']'));
    else if (v && typeof v === 'object') Object.keys(v).forEach(k => assertIntegers(v[k], path + '.' + k));

  /* ------------------------------------------------------ arithmétique entière */
  const Num = {
    isInt: Number.isSafeInteger,
    /** a*b/c arrondi à l'entier le plus proche (demi vers l'extérieur), sans flottant. */
    mulDiv(a, b, c) {
      const n = BigInt(a) * BigInt(b), d = BigInt(c);
      if (d === 0n) throw err('DIV0', 'Division par zéro');
      const neg = (n < 0n) !== (d < 0n);

    divRound(a, b) { return Num.mulDiv(a, 1, b); },
    /** Montant en DA d'un poids (g) à un prix en centimes par kg. 1 kg à 7300 c = 73 DA. */
    lineDA(grams, centimesPerKg) { return Num.mulDiv(grams, centimesPerKg, 100000); },
    /** Prix de revient au kg en centimes : total DA ÷ grammes pesés. */
    costPerKg(totalDA, grams) { return Num.mulDiv(totalDA, 100000, grams); },
    /** Texte décimal (virgule, point, chiffres arabes acceptés) → entier mis à l'échelle. */

  /* -------------------------------------------------------------------- dates */

  function lsAdapter(key, storage) {

    const st = storage || (typeof localStorage !== 'undefined' ? localStorage : null);
    let cache = null;
    const write = () => st.setItem(key, JSON.stringify({ v: 1, ops: cache.ops, meta: cache.meta }));
    return {
      kind: 'localStorage',
      probe() { st.setItem(key + '.probe', '1'); st.removeItem(key + '.probe'); },
      async load() {
        const raw = st.getItem(key);
        cache = raw ? JSON.parse(raw) : { v: 1, ops: [], meta: {} };

      },
      async put(op) { cache.ops.push(op); try { write(); } catch (e) { cache.ops.pop(); throw e; } },
      async setMeta(k, v) { cache.meta[k] = v; write(); },
      async replaceAll(ops) { cache.ops = ops.slice(); write(); },

  function idbAdapter(name, factory) {

    factory = factory || (typeof indexedDB !== 'undefined' ? indexedDB : null);
    let db = null;
    const req = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });

      if (db) return db;
      if (!factory) throw err('NOIDB', 'IndexedDB indisponible');

        const r = factory.open(name, 1);
        r.onupgradeneeded = () => { const d = r.result; d.createObjectStore('ops', { keyPath: 'n' }); d.createObjectStore('meta', { keyPath: 'k' }); };

      kind: 'indexedDB',
      async load() {

      async put(op) { const d = await open(); const tx = d.transaction('ops', 'readwrite'); tx.objectStore('ops').put(op); await done(tx); },
      async setMeta(k, v) { const d = await open(); const tx = d.transaction('meta', 'readwrite'); tx.objectStore('meta').put({ k, v }); await done(tx); },
      async replaceAll(ops) {

      },
      async clear() {

    for (let i = 0; i < list.length; i++) {

      if (o.n !== i + 1) return { ok: false, badAt: o.n, reason: 'numérotation' };
      if (o.prev !== (i ? list[i - 1].h : '0')) return { ok: false, badAt: o.n, reason: 'chaîne rompue' };

    fr: {
      'err.FLOAT': 'Nombre non entier refusé.', 'err.UNKNOWN_TYPE': 'Type d’opération inconnu.',
      'err.MOTIF': 'Un motif est obligatoire (3 caractères minimum).', 'err.ALREADY_VOIDED': 'Déjà annulée.',
      'err.NOT_VOIDABLE': 'Cette opération ne peut pas être annulée.', 'err.LOCKED': 'Données altérées : écriture bloquée. Restaurez une sauvegarde.',
      'err.NOT_FOUND': 'Opération introuvable.', 'err.GUARD': 'Annulation refusée.', 'err.FORBIDDEN': 'Action non autorisée pour votre profil.', 'err.BAD_SETTING': 'Valeur de réglage refusée.',
      'unit.kg': 'kg', 'unit.q': 'qx', 'unit.da': 'DA', 'unit.crate': 'caisse',

      'err.MOTIF': 'السبب إجباري (3 أحرف على الأقل).', 'err.ALREADY_VOIDED': 'ملغاة من قبل.',
      'err.NOT_VOIDABLE': 'لا يمكن إلغاء هذه العملية.', 'err.LOCKED': 'البيانات متضررة: الكتابة موقوفة. استرجع نسخة احتياطية.',
      'err.NOT_FOUND': 'العملية غير موجودة.', 'err.GUARD': 'الإلغاء مرفوض.', 'err.FORBIDDEN': 'هذا الإجراء غير مسموح لصفتك.', 'err.BAD_SETTING': 'قيمة الإعداد مرفوضة.',

  /* ===================================================================== create */

    const wantAuto = !adapter;

    const types = new Map(), prefixes = new Map(), settingDefs = new Map(), modules = new Map();
    const strings = { fr: Object.assign({}, CORE_STRINGS.fr), ar: Object.assign({}, CORE_STRINGS.ar) };
    const listeners = {};
    const perms = new Map(); let enforce = false;
    let ops = [], byN = new Map(), voidedBy = new Map(), seq = {}, settingVals = {};

    });

      const target = get(ref);

    }
    async function importAll(pkg, o) {

      get length() { return ops.length; },

  }

  /* ------------------------------------------------------ jeu d'exemple (à remplacer) */
  const EX_CRATES = [
    { name: 'Caisse standard', nameAr: 'صندوق عادي', consigne: 300, tareG: 1800 },
    { name: 'Grande caisse', nameAr: 'صندوق كبير', consigne: 450, tareG: 2500 },

    pdt: [1, 25, 30], tom: [0, 20, 80], oig: [1, 25, 40], ail: [2, 10, 20], car: [0, 20, 50], cou: [0, 15, 70],

  function seed(core) {
    const crates = EX_CRATES.map(c => createCrate(core, c).id);
    Dessins.ids().forEach(id => {
      const [ci, net, loss] = EX_PROD[id], dd = Dessins.all[id];

    });
  }

  return { module: module_, UNITS, getProducts, getCrates, productName, crateName, history, drawingOwner, gramsOf, norm,
    createProduct, updateProduct, archiveProduct, createCrate, updateCrate, archiveCrate, seed };
});

<script>/* ============================================================================

   - onShow : l'application doit se cacher ; onEnter : l'application peut s'afficher.
   - Le clavier ne re-rend jamais la page : il met à jour les points sur place (pas de clignotement).
   - Gère aussi le verrouillage automatique (une minuterie d'une seconde) et le toucher (activité).
   ========================================================================== */
(function (root) {
  'use strict';
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const KEYS = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '⌫', '0', '✓'];

  const STRINGS = {
    fr: {
      'gate.setup': 'Créez votre code gérant', 'gate.setup.sub': '4 à 6 chiffres. Il protège toute l’application.', 'gate.confirm': 'Confirmez le code', 'gate.login': 'Entrez votre code', 'gate.newpin': 'Choisissez un nouveau code',
      'gate.mismatch': 'Les deux codes ne correspondent pas. Recommencez.', 'gate.forgot': 'Code oublié ?', 'gate.remaining': 'Code incorrect. Encore {n} essai(s) avant blocage.', 'gate.blocked': 'Code incorrect. Patientez {s} s.',
      'gate.wait': 'Trop d’essais. Patientez {s} s.', 'gate.weak': 'Code trop simple ou mal formé (4 à 6 chiffres, pas de suite ni de chiffres identiques).',
      'gate.rec.title': 'Code de secours', 'gate.rec.sub': 'Notez-le sur papier et gardez-le à l’abri. Il ne sera plus jamais affiché. Il permet de recréer votre code si vous l’oubliez.',
      'gate.rec.ok': 'J’ai noté ce code', 'gate.rec.go': 'Entrer dans l’application', 'gate.rec.enter': 'Saisissez votre code de secours', 'gate.rec.next': 'Continuer', 'gate.back': 'Retour', 'gate.copy': 'Copier', 'gate.copied': 'Copié', 'gate.lock': 'Verrouiller'
    },
    ar: {
      'gate.setup': 'أنشئ رمز المسير', 'gate.setup.sub': 'من 4 إلى 6 أرقام. يحمي التطبيق كله.', 'gate.confirm': 'أكّد الرمز', 'gate.login': 'أدخل رمزك', 'gate.newpin': 'اختر رمزاً جديداً',
      'gate.mismatch': 'الرمزان غير متطابقين. أعد المحاولة.', 'gate.forgot': 'نسيت الرمز؟', 'gate.remaining': 'رمز خاطئ. بقيت {n} محاولة قبل القفل.', 'gate.blocked': 'رمز خاطئ. انتظر {s} ث.',
      'gate.wait': 'محاولات كثيرة. انتظر {s} ث.', 'gate.weak': 'رمز سهل جداً أو غير صالح (4 إلى 6 أرقام، بدون تسلسل أو أرقام متشابهة).',
      'gate.rec.title': 'رمز الطوارئ', 'gate.rec.sub': 'دوّنه على ورقة واحفظه في مكان آمن. لن يظهر مرة أخرى. يسمح بإعادة إنشاء رمزك عند النسيان.',
      'gate.rec.ok': 'دوّنت هذا الرمز', 'gate.rec.go': 'دخول التطبيق', 'gate.rec.enter': 'أدخل رمز الطوارئ', 'gate.rec.next': 'متابعة', 'gate.back': 'رجوع', 'gate.copy': 'نسخ', 'gate.copied': 'تم النسخ', 'gate.lock': 'قفل'
    }
  };

  function mount(core, o) {
    core.addStrings(STRINGS);
    const acc = root.Acces.of(core), el = o.el;
    let busy = false, mode = 'login', buf = '', first = '', recNew = '', pendingCode = '', visible = false;
    const T = (k, v) => esc(core.t(k, v));
    const dots = () => Array.from({ length: Math.max(4, buf.length) }, (_, i) => '<i class="' + (i < buf.length ? 'on' : '') + '"></i>').join('');
    const $ = id => document.getElementById(id);
    const setMsg = (html, info) => { const m = $('g-msg'); if (m) { m.innerHTML = html || ''; m.className = 'g-msg' + (info ? ' info' : ''); } };
    const upDots = () => { const d = $('g-dots'); if (d) d.innerHTML = dots(); };

    function show(m) {
      mode = m || (acc.status() === 'setup' ? 'setup1' : 'login'); buf = ''; visible = true; el.style.display = ''; if (o.onShow) o.onShow();
      if (mode === 'recshow') {
        el.innerHTML = '<div class="g-wrap"><h2>' + T('gate.rec.title') + '</h2><p class="g-muted">' + T('gate.rec.sub') + '</p><div class="g-code" id="g-reccode">' + esc(recNew) + '</div>' +
          '<button class="g-btn" id="g-copy">' + T('gate.copy') + '</button><label class="g-ack"><input type="checkbox" id="g-ack"> ' + T('gate.rec.ok') + '</label>' +
          '<button class="g-btn primary" id="g-go" disabled>' + T('gate.rec.go') + '</button></div>'; return;
      }
      if (mode === 'reccode') {
        el.innerHTML = '<div class="g-wrap"><h2>' + T('gate.rec.enter') + '</h2><input type="text" id="g-code" dir="ltr" placeholder="XXXX-XXXX-XXXX" autocomplete="off" autocapitalize="characters" class="g-input"><div class="g-msg" id="g-msg"></div>' +
          '<div class="g-row"><button class="g-btn" id="g-back">' + T('gate.back') + '</button><button class="g-btn primary" id="g-next">' + T('gate.rec.next') + '</button></div></div>'; return;
      }
      const title = { setup1: 'gate.setup', setup2: 'gate.confirm', login: 'gate.login', rec1: 'gate.newpin', rec2: 'gate.confirm' }[mode];
      el.innerHTML = '<div class="g-wrap"><h2>' + T(title) + '</h2>' + (mode === 'setup1' ? '<p class="g-muted">' + T('gate.setup.sub') + '</p>' : '') +
        '<div class="g-dots" id="g-dots">' + dots() + '</div><div class="g-msg" id="g-msg"></div><div class="g-pad">' + KEYS.map(k => '<button data-key="' + k + '" class="' + (k === '✓' ? 'go' : '') + '">' + k + '</button>').join('') + '</div>' +
        (mode === 'login' ? '<p><button class="g-chip" id="g-forgot">' + T('gate.forgot') + '</button></p>' : '') + '</div>';
      tick();
    }
    function hide() { visible = false; el.style.display = 'none'; el.innerHTML = ''; }
    function enter() { hide(); if (o.onEnter) o.onEnter(); }
    function lock() { acc.lock(); show('login'); }
    function tick() {
      if (!visible || mode !== 'login') return; const w = acc.waitLeft(), m = $('g-msg'); if (!m) return;
      if (w > 0) { setMsg(T('gate.wait', { s: w })); m.dataset.w = '1'; } else if (m.dataset.w) { setMsg(''); m.dataset.w = ''; }
    }

    async function submit() {
      if (busy) return; busy = true;
      try {
        if (mode === 'login') { await acc.login(buf); enter(); }
        else if (mode === 'setup1' || mode === 'rec1') {
          if (root.Acces.pinProblem(buf)) throw { code: 'WEAK' };
          first = buf; show(mode === 'setup1' ? 'setup2' : 'rec2');
        } else if (mode === 'setup2' || mode === 'rec2') {
          if (buf !== first) { first = ''; const was = mode; show(was === 'setup2' ? 'setup1' : 'rec1'); setMsg(T('gate.mismatch')); return; }
          const r = mode === 'setup2' ? await acc.setup(buf) : await acc.recover(pendingCode, buf);
          recNew = r.recoveryCode; show('recshow');
        }
      } catch (e) {
        buf = ''; upDots();
        if (e.code === 'PIN') setMsg(e.seconds > 0 ? T('gate.blocked', { s: e.seconds }) : T('gate.remaining', { n: e.remaining }));
        else if (e.code === 'WAIT') setMsg(T('gate.wait', { s: e.seconds }));
        else if (e.code === 'WEAK') setMsg(T('gate.weak'));
        else setMsg(esc(core.t('err.' + e.code) !== 'err.' + e.code ? core.t('err.' + e.code) : (e.message || String(e))));
      } finally { busy = false; }
    }

    el.addEventListener('click', async e => {
      const k = e.target.closest('[data-key]');
      if (k) {
        if (busy) return; const v = k.dataset.key;
        if (v === '⌫') buf = buf.slice(0, -1); else if (v === '✓') return submit(); else if (buf.length < 6) buf += v;
        upDots(); return;
      }
      const id = e.target.id;
      if (id === 'g-forgot') show('reccode');
      else if (id === 'g-back') show('login');
      else if (id === 'g-next') { pendingCode = $('g-code').value; if (pendingCode.replace(/[^A-Za-z0-9]/g, '').length < 12) { setMsg(esc(core.t('err.RECOVERY'))); return; } show('rec1'); }
      else if (id === 'g-copy') { try { await navigator.clipboard.writeText(recNew); if (o.toast) o.toast(core.t('gate.copied')); } catch (x) { /* facultatif */ } }
      else if (id === 'g-go') { recNew = ''; enter(); }
    });
    el.addEventListener('change', e => { if (e.target.id === 'g-ack') $('g-go').disabled = !e.target.checked; });
    document.addEventListener('keydown', e => {
      if (!visible || !$('g-dots')) return;
      if (/^\d$/.test(e.key) && buf.length < 6 && !busy) { buf += e.key; upDots(); } else if (e.key === 'Backspace') { buf = buf.slice(0, -1); upDots(); } else if (e.key === 'Enter') submit();
    });
    document.addEventListener('pointerdown', () => acc.touch());
    core.on('lang', () => { if (visible) show(mode); });
    setInterval(() => { if (acc.status() === 'open') { if (acc.autoLockCheck()) show('login'); } else tick(); }, 1000);

    return { show, lock, start: () => show(), get visible() { return visible; } };
  }
  root.Gate = { mount };
})(typeof self !== 'undefined' ? self : this);
</script>
<script>/* ============================================================================
   M2 — RÉGLAGES ET OPTIONS DU GÉRANT  (dépend du noyau ≥ 0.2)
   Une seule liste de toutes les options « SI » de l'application :
     – déclare les options transversales (boutique, crédit, consigne, achats, prix, balance,
       imprimante, sauvegarde) pour que tous les modules les lisent au même endroit ;
     – décrit n'importe quel réglage déclaré par un autre module (libellés FR/AR, aide, unité,
       choix) pour que l'écran de réglages soit généré automatiquement ;
     – journalise chaque changement (qui, quand, ancienne et nouvelle valeur).

(function (root, factory) {

    'credit.plafondDefaut': { type: 'int', def: 0, min: 0, max: 1000000000, unit: L('DA', 'د.ج'), group: 'credit', label: L('Plafond de crédit par défaut', 'سقف الدين الافتراضي'), help: L('Appliqué aux nouveaux clients. 0 = pas de plafond par défaut. Au-delà, la vente à crédit est bloquée sauf exception du gérant.', 'يُطبق على الزبائن الجدد. 0 = بدون سقف. فوقه يُمنع البيع بالدين إلا باستثناء من المسير.') },

      optionLabels: { avec: L('Avec argent', 'بالمال'), suivi: L('Suivi sans argent', 'متابعة بدون مال'), aucun: L('Aucun suivi', 'بدون متابعة') },
      help: L('Avec argent : la consigne est facturée puis remboursée. Suivi : on compte les caisses sans argent. Aucun : on ne gère pas les caisses des clients.', 'بالمال: تُحسب الوديعة ثم تُسترجع. متابعة: نعدّ الصناديق بدون مال. بدون: لا نتابع صناديق الزبائن.') },

    'sauvegarde.orangeJours': { type: 'int', def: 1, min: 1, max: 60, unit: L('jours', 'يوم'), group: 'sauvegarde', label: L('Rappel de sauvegarde (orange)', 'تذكير بالنسخ الاحتياطي (برتقالي)'),
      check: (v, c) => (v < c.getSetting('sauvegarde.rougeJours') ? null : c.t('err.sauv.orange')),
      help: L('Alerte orange si la dernière sauvegarde date de plus de ce nombre de jours.', 'تنبيه برتقالي إذا مرت هذه المدة على آخر نسخة.') },

  const strings = {
    fr: {
      'group.boutique': 'Boutique et tickets', 'group.acces': 'Accès et sécurité', 'group.credit': 'Crédit clients', 'group.consigne': 'Caisses consignées', 'group.achats': 'Achats et transport',

      'err.sauv.orange': 'Le rappel orange doit rester inférieur au rappel rouge.', 'err.sauv.rouge': 'Le rappel rouge doit rester supérieur au rappel orange.'
    },
    ar: {
      'group.boutique': 'المحل والتذاكر', 'group.acces': 'الدخول والأمان', 'group.credit': 'ديون الزبائن', 'group.consigne': 'الصناديق المودعة', 'group.achats': 'المشتريات والنقل',
      'group.prix': 'الأسعار', 'group.balance': 'الميزان', 'group.imprimante': 'الطابعة', 'group.sauvegarde': 'النسخ الاحتياطي', 'group.catalogue': 'الكتالوج', 'group.general': 'أخرى',
      'on': 'مفعّل', 'off': 'معطّل', 'default': 'افتراضي', 'reset': 'القيمة الافتراضية',
      'err.sauv.orange': 'يجب أن يبقى التذكير البرتقالي أقل من الأحمر.', 'err.sauv.rouge': 'يجب أن يبقى التذكير الأحمر أكبر من البرتقالي.'
    }

  const module_ = { id: 'reglages', version: '0.1.0', deps: [], settings, strings };

  const pickL = (o, lang) => (o && (o[lang] || o.fr)) || '';
  /** Description de tous les réglages déclarés, groupés, prêts à afficher. */
  function describe(core, lang) {
    lang = lang || core.getPref('lang');
    const defLabel = (def) => def.type === 'bool' ? core.t(def.def ? 'on' : 'off') : def.type === 'enum' ? (def.optionLabels ? pickL(def.optionLabels[def.def], lang) || def.def : def.def) : def.def === '' ? '—' : String(def.def);
    const items = core.settings().map(({ key, def, value }) => ({
      key, group: def.group || 'general', type: def.type, value, def: def.def, defLabel: defLabel(def), isDefault: value === def.def,
      label: pickL(def.label, lang) || key, help: pickL(def.help, lang), unit: pickL(def.unit, lang),

      options: (def.options || []).map(v => ({ v, label: def.optionLabels ? pickL(def.optionLabels[v], lang) || v : v }))
    }));
    const order = g => { const i = GROUPS.indexOf(g); return i < 0 ? 99 : i; };
    const groups = [];
    items.sort((a, b) => order(a.group) - order(b.group));
    items.forEach(it => { let g = groups.find(x => x.group === it.group); if (!g) groups.push(g = { group: it.group, items: [] }); g.items.push(it); });
    return groups;
  }
  /** Libellé lisible d'une valeur (oui/non, choix, unité). */
  function show(core, item, lang) {

    if (item.type === 'bool') return core.t(item.value ? 'on' : 'off');
    if (item.type === 'enum') { const o = item.options.find(x => x.v === item.value); return o ? o.label : String(item.value); }
    return String(item.value) + (item.unit ? ' ' + item.unit : '');
  }
  /** Change une valeur ; les entiers peuvent arriver en texte (chiffres arabes acceptés). */
  function change(core, key, value, by) {
    const def = core.settings().find(s => s.key === key);
    if (!def) throw Object.assign(new Error('Réglage inconnu'), { code: 'UNKNOWN_SETTING' });
    if (def.def.type === 'int' && typeof value === 'string') value = core.Num.parseDecimal(value, 0);
    return core.setSetting(key, value, by);
  }
  const reset = (core, key, by) => core.setSetting(key, core.settings().find(s => s.key === key).def.def, by);
  const log = core => core.all().filter(o => o.type === 'settings.set').slice().reverse();
  /** Contrôle de santé : réglages sans libellé/aide FR+AR, ou enum sans libellés de choix. */
  function audit(core) {
    const bad = [];
    core.settings().forEach(({ key, def }) => {
      if (!def.label || !def.label.fr || !def.label.ar) bad.push(key + ' : libellé FR+AR manquant');
      if (!def.help || !def.help.fr || !def.help.ar) bad.push(key + ' : aide FR+AR manquante');
      if (def.type === 'enum' && def.optionLabels === undefined && !(def.options || []).every(o => /^\d+$/.test(o))) bad.push(key + ' : libellés des choix manquants');
    });
    return bad;
  }
  return { module: module_, GROUPS, describe, show, change, reset, log, audit };
});

<script>/* ============================================================================
   M4 — CLIENTS  (dépend du noyau ≥ 0.2, des modules « acces » et « reglages »)
   Fiches clients : nom, téléphone, adresse, plafond de crédit (DA), délai de paiement (jours),
   consigne des caisses (avec / suivi / aucun), notes. Un client s'archive, il ne s'efface jamais.

   Écritures (non annulables : une correction = nouvelle modification) :
     client.create  C####  {name, phone, address, ceiling, delay, consigne, notes}    droit client.creer
     client.update         {cid, before, after}                                        droit client.modifier
     client.archive        {cid, on}                                                   droit client.modifier
   Règle « pas d'archivage avec une dette » : fournie par M8 via addArchiveGuard (M4 ignore le crédit).
   ========================================================================== */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.Clients = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  const FIELDS = ['name', 'phone', 'address', 'ceiling', 'delay', 'consigne', 'notes'];
  const CONS = ['avec', 'suivi', 'aucun'];

  const normName = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9؀-ۿ ]/g, ' ').replace(/\s+/g, ' ').trim();

  function getClients(core) {

      if (o.type === 'client.create') map.set(o.id, Object.assign({ id: o.id, archived: false, t: o.t }, defaults(), o.d));
      else if (o.type === 'client.update' && map.has(o.d.cid)) Object.assign(map.get(o.d.cid), o.d.after);

  /* ------------------------------------------------------------ validations */
  const guards = new WeakMap();
  /** M8 (ou tout autre module) ajoute une règle : fn(client, core) → message | null. */

  function fieldProblem(d, core) {
    const t = (k) => core.t(k);
    if ('name' in d && (typeof d.name !== 'string' || d.name.trim().length < 1 || d.name.length > 80)) return t('cl.err.name');
    if ('phone' in d && (typeof d.phone !== 'string' || d.phone.length > 30)) return t('cl.err.text');
    if ('address' in d && (typeof d.address !== 'string' || d.address.length > 120)) return t('cl.err.text');
    if ('notes' in d && (typeof d.notes !== 'string' || d.notes.length > 200)) return t('cl.err.text');
    if ('ceiling' in d && !(Number.isSafeInteger(d.ceiling) && d.ceiling >= 0 && d.ceiling <= 1000000000)) return t('cl.err.ceiling');
    if ('delay' in d && !(Number.isSafeInteger(d.delay) && d.delay >= 0 && d.delay <= 365)) return t('cl.err.delay');
    if ('consigne' in d && !CONS.includes(d.consigne)) return t('cl.err.cons');

  }

  /* ----------------------------------------------------------- écriture */
  const clean = d => { const r = pick(d); ['name', 'phone', 'address', 'notes'].forEach(k => { if (typeof r[k] === 'string') r[k] = r[k].trim(); }); return r; };

    const next = Object.assign({}, cur, clean(data)), before = {}, after = {};
    FIELDS.forEach(k => { if (cur[k] !== next[k]) { before[k] = cur[k]; after[k] = next[k]; } });
    if (!Object.keys(after).length) return null;
    return core.append('client.update', { cid, before, after }, { by });
  }
  function archiveClient(core, cid, on, by) {
    const cur = getClient(core, cid); if (!cur) throw Object.assign(new Error(core.t('cl.err.notfound')), { code: 'NOT_FOUND' });
    if (cur.archived === !!on) return null;
    return core.append('client.archive', { cid, on: !!on }, { by });
  }

  /* ------------------------------------------------------------ module noyau */
  const module_ = {
    id: 'clients', version: '0.2.0', deps: ['acces', 'reglages'],
    types: {
      'client.create': { prefix: 'C', voidable: false, perm: 'client.creer', check: (d, c) => (typeof d.name !== 'string' ? c.t('cl.err.name') : fieldProblem(d, c)) },
      'client.update': {
        voidable: false, perm: 'client.modifier', check(d, c) {
          const cur = getClient(c, d.cid); if (!cur) return c.t('cl.err.notfound');
          if (!d.after || !Object.keys(d.after).length) return c.t('cl.err.text');

      'client.archive': {
        voidable: false, perm: 'client.modifier', check(d, c) {
          const cur = getClient(c, d.cid); if (!cur) return c.t('cl.err.notfound');
          if (d.on) for (const g of (guards.get(c) || [])) { const m = g(cur, c); if (m) return m; }
          return null;
        }
      }
    },
    strings: {
      fr: { 'cl.err.name': 'Le nom du client est obligatoire.', 'cl.err.text': 'Texte trop long ou invalide.', 'cl.err.ceiling': 'Plafond : nombre entier de DA, 0 ou plus.', 'cl.err.delay': 'Délai : de 0 à 365 jours.', 'cl.err.cons': 'Mode de consigne inconnu.', 'cl.err.notfound': 'Client introuvable.' },
      ar: { 'cl.err.name': 'اسم الزبون إجباري.', 'cl.err.text': 'نص طويل جداً أو غير صالح.', 'cl.err.ceiling': 'السقف: عدد صحيح من الدنانير، 0 أو أكثر.', 'cl.err.delay': 'الأجل: من 0 إلى 365 يوماً.', 'cl.err.cons': 'نمط الوديعة غير معروف.', 'cl.err.notfound': 'الزبون غير موجود.' }
    }
  };

  return { module: module_, FIELDS, CONS, getClients, getClient, history, similarClient, searchClients, normName, waDigits, waLink, addArchiveGuard, createClient, updateClient, archiveClient };
});

<script>/* ============================================================================
   M8 — CRÉDIT ET ENCAISSEMENTS  (dépend de M4 Clients)
   Tout se recalcule depuis le journal : dette, reste par facture, âge, tranches, statut.

   Écritures :
     invoice    F####  {cid, amount, exc?}                droit vendre        (vente à crédit ; M7 l'écrira)
     payment    P####  {cid, amount, debtBefore, debtAfter, plan[{id,before,after}]}   droit encaisser
     writeoff   W####  {cid, amount, motif}               droit credit.perte  (gérant)
     exception  E####  {cid, amount, motif}               droit credit.exception (gérant)
   Annuler = `core.void` (droit « annuler », gérant). Une facture ne s'annule pas si cela créerait une avance
   (annuler d'abord les versements). Le plafond est bloquant DANS LES DONNÉES : une facture au-delà du plafond
   est refusée sauf si elle porte `exc` = une exception du gérant, valide et jamais utilisée.
   ========================================================================== */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory(require('./clients.js'));
  else root.Credit = factory(root.Clients);
})(typeof self !== 'undefined' ? self : this, function (Clients) {
  'use strict';

  const DAY = 86400000;
  const sum = a => a.reduce((x, o) => x + o.d.amount, 0);
  const bucketOf = age => (age <= 7 ? 1 : age <= 30 ? 2 : 3);
  const fail = (code, msg) => Object.assign(new Error(msg), { code });

  /* -------------------------------------------------------------- grand livre */
  function ledger(core, cid, now) {
    now = now == null ? core.now() : now;
    const c = Clients.getClient(core, cid);
    const mine = core.live(['invoice', 'payment', 'writeoff']).filter(o => o.d.cid === cid);
    const invs = mine.filter(o => o.type === 'invoice').sort((a, b) => a.t - b.t || a.n - b.n);
    const pays = mine.filter(o => o.type === 'payment'), wos = mine.filter(o => o.type === 'writeoff');
    let pool = sum(pays) + sum(wos);
    const rows = invs.map(i => {
      const used = Math.min(pool, i.d.amount); pool -= used;
      const age = Math.max(0, core.Time.ageDays(i.t, now));
      return { id: i.id, n: i.n, amount: i.d.amount, t: i.t, exc: !!i.d.exc, remaining: i.d.amount - used, age, bucket: bucketOf(age) };
    });
    const debt = sum(invs) - sum(pays) - sum(wos);
    const b = [0, 0, 0, 0]; let worst = 'ok', oldest = 0;
    for (const r of rows) {
      if (r.remaining <= 0) continue;
      b[r.bucket] += r.remaining; oldest = Math.max(oldest, r.age);
      const late = c && c.delay ? r.age > c.delay : r.age > 30;
      const watch = !(c && c.delay) && r.age > 7 && r.age <= 30;

  /* ------------------------------------------------------------ validations */
  const posInt = n => Number.isSafeInteger(n) && n > 0;

      if (core.live('invoice').some(i => i.d.exc === d.exc)) return core.t('cr.err.excUsed');
    } else if (!chk.ok) return core.t('cr.err.ceiling', { x: core.fmt.da(chk.over) });
    return null;
  }
  function checkPayment(d, core) {
    if (!Clients.getClient(core, d.cid)) return core.t('cl.err.notfound');
    if (!posInt(d.amount)) return core.t('cr.err.amount');
    const L = ledger(core, d.cid);
    if (d.amount > Math.max(0, L.debt)) return core.t('cr.err.excess', { x: core.fmt.da(d.amount - Math.max(0, L.debt)) });
    return null;
  }

    if (!Clients.getClient(core, d.cid)) return core.t('cl.err.notfound');
    if (!posInt(d.amount)) return core.t('cr.err.amount');
    if (typeof d.motif !== 'string' || d.motif.trim().length < 3) return core.t('cr.err.motif');
    if (d.amount > Math.max(0, ledger(core, d.cid).debt)) return core.t('cr.err.excess', { x: core.fmt.da(d.amount - Math.max(0, ledger(core, d.cid).debt)) });
    return null;
  }
  function checkException(d, core) {
    if (!Clients.getClient(core, d.cid)) return core.t('cl.err.notfound');
    if (!posInt(d.amount)) return core.t('cr.err.amount');
    if (typeof d.motif !== 'string' || d.motif.trim().length < 3) return core.t('cr.err.motif');
    return null;
  }

  /* ----------------------------------------------------------- écriture */
  /** Vente à crédit. `ageDays` n'existe que pour les jeux d'essai (dette antidatée). */
  function recordCreditInvoice(core, cid, amount, o) {
    o = o || {};
    const t = core.now() - (o.ageDays || 0) * DAY;
    const pre = checkInvoice({ cid, amount, exc: null }, core);
    let exc = null;
    if (pre) {
      const c = Clients.getClient(core, cid), over = c && !c.archived && posInt(amount) && !verifierCredit(core, cid, amount).ok;
      if (!over) throw fail('CHECK', pre);                                  // autre cause que le plafond
      if (!o.exceptionMotif) throw fail('CHECK', pre);                      // plafond : exception obligatoire
      exc = core.append('exception', { cid, amount, motif: o.exceptionMotif }, { by: o.by, t });   // droit : gérant seulement
    }

  }
  function recordPayment(core, cid, amount, by) {
    const L = ledger(core, cid), plan = simulate(L.rows.filter(r => r.remaining > 0), Math.min(amount, Math.max(0, L.debt)));
    return core.append('payment', { cid, amount, debtBefore: L.debt, debtAfter: L.debt - amount, plan: plan.map(r => ({ id: r.id, before: r.remaining, after: r.after })) }, { by });

  /* ------------------------------------------------------------ module noyau */
  const module_ = {

    types: {

        voidGuard(op, core) {
          if (core.live('sale').some(x => x.d.inv === op.id)) return core.t('cr.err.voidLinked');          // dette née d'une vente : annuler la vente
          const L = ledger(core, op.d.cid); return L.debt - op.d.amount < 0 ? core.t('cr.err.voidInvoice') : null;

      'writeoff': { prefix: 'W', perm: 'credit.perte', check: checkWriteoff },
      'exception': { prefix: 'E', perm: 'credit.exception', voidable: false, check: checkException }
    },
    strings: {
      fr: {
        'cr.err.archived': 'Client archivé : aucune vente possible.', 'cr.err.amount': 'Montant : nombre entier de DA, supérieur à 0.',
        'cr.err.ceiling': 'Bloqué : dépasse le plafond de {x}. Exception du gérant requise.', 'cr.err.exc': 'Exception invalide ou insuffisante.',
        'cr.err.excUsed': 'Cette exception a déjà servi.', 'cr.err.excess': 'Le montant dépasse la dette de {x}.', 'cr.err.motif': 'Motif obligatoire.',
        'cr.err.voidReturn': 'Ce versement vient d’un retour client : annulez le retour.', 'cr.err.voidInvoice': 'Annulez d’abord les versements de ce client : l’annulation créerait une avance.', 'cr.err.hasDebt': 'Impossible : ce client a encore une dette.', 'cr.err.voidLinked': 'Cette dette vient d’une vente : annulez la vente.'
      },
      ar: {
        'cr.err.archived': 'زبون مؤرشف: لا بيع ممكن.', 'cr.err.amount': 'المبلغ: عدد صحيح من الدنانير أكبر من 0.',
        'cr.err.ceiling': 'محظور: يتجاوز السقف بـ {x}. يلزم استثناء من المسير.', 'cr.err.exc': 'استثناء غير صالح أو غير كافٍ.',
        'cr.err.excUsed': 'هذا الاستثناء استُعمل من قبل.', 'cr.err.excess': 'المبلغ يتجاوز الدين بـ {x}.', 'cr.err.motif': 'السبب إجباري.',
        'cr.err.voidReturn': 'هذه الدفعة ناتجة عن مرتجع زبون: ألغِ المرتجع.', 'cr.err.voidInvoice': 'ألغِ أولاً دفعات هذا الزبون: الإلغاء سيُنشئ سلفة.', 'cr.err.hasDebt': 'غير ممكن: على هذا الزبون دين.', 'cr.err.voidLinked': 'هذا الدين ناتج عن بيع: ألغِ البيع.'
      }
    },
    init(core) { Clients.addArchiveGuard(core, (c, k) => (ledger(k, c.id).debt > 0 ? k.t('cr.err.hasDebt') : null)); }
  };

  /* ------------------------------------------------- jeu d'exemple (test T5 du dossier) */
  function seed(core) {
    const mk = (name, phone, ceiling, delay, debts, address) => {
      const cid = Clients.createClient(core, { name, phone, address: address || '', ceiling, delay, consigne: 'avec', notes: '' }).id;
      debts.forEach(([amt, age]) => recordCreditInvoice(core, cid, amt, { ageDays: age }));
    };
    mk('Épicerie Nour', '0550 00 00 01', 100000, 0, [[42000, 20]], '12 rue des Oliviers, Blida');
    mk('Restaurant El Wiam', '0550 00 00 02', 150000, 15, [[80000, 22], [38000, 5]]);
    mk('Primeur Amine', '0550 00 00 03', 60000, 0, []);
    mk('Hôtel Les Palmiers', '0550 00 00 04', 300000, 0, [[150000, 40], [115000, 9]]);
    mk('Détaillant Karim', '0550 00 00 05', 60000, 0, [[30000, 12], [28000, 3]], 'Marché couvert, étal 7, Boufarik');
    mk('Cantine Zéralda', '', 80000, 30, [[21000, 6]]);
  }

  return { module: module_, ledger, verifierCredit, simulate, dueList, totals, recordCreditInvoice, recordPayment, writeOff, seed, bucketOf, checkInvoice };
});

<script>/* ============================================================================
   M5 — PRIX  (dépend du catalogue M3 et des clients M4)
   Prix du jour par produit, prix spéciaux par client, garde-fou « prix aberrant »,
   alerte sous le prix de revient (quand les achats fourniront les coûts).

   Tous les prix sont en CENTIMES PAR KG (entier). Les autres unités en découlent :
     kg → p · quintal → p × 100 · caisse → p × net de la caisse (g) ÷ 1000.
   Écritures (non annulables : une correction = un nouveau prix) :
     price.set     {pid, cpk, force?}        prix du jour d'un produit        droit prix.edit
     price.client  {cid, pid, cpk | null}    prix spécial (null = le retirer) droit prix.edit
   Le prix « du jour » est le dernier prix posé ; il est « confirmé aujourd'hui » si posé
   le jour même (jour local). Le prix d'hier reste utilisable mais l'écran de vente alerte
   quand l'option prix.confirmerJour est active.
   ========================================================================== */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory(require('../m3/m3-catalogue.js'), require('../m4/clients.js'));
  else root.Prix = factory(root.Catalogue, root.Clients);
})(typeof self !== 'undefined' ? self : this, function (Catalogue, Clients) {
  'use strict';

  const MAX_CPK = 1000000;                       // 10 000 DA/kg : au-delà, c'est une faute de frappe
  const JUMP = 10;                               // rapport maximal entre deux prix successifs sans confirmation
  const posInt = n => Number.isInteger(n) && n > 0;

  /** Clé de jour locale AAAA-MM-JJ (le « jour » du marché suit l'horloge du téléphone). */
  function dayKey(ms) { const d = new Date(ms); const p = n => String(n).padStart(2, '0'); return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()); }

  /* ----------------------------------------------------------- relecture du journal */
  function priceOps(core, pid) { return core.byType('price.set').filter(o => o.d.pid === pid); }
  function currentPrices(core) {
    const today = dayKey(core.now()), m = new Map();
    for (const o of core.byType('price.set')) m.set(o.d.pid, { pid: o.d.pid, cpk: o.d.cpk, t: o.t, day: dayKey(o.t), fresh: dayKey(o.t) === today });
    return m;
  }
  function history(core, pid) { return priceOps(core, pid).map(o => ({ n: o.n, t: o.t, cpk: o.d.cpk, by: o.by })).reverse(); }
  /** Prix posé avant aujourd'hui (le plus récent), pour afficher « hier » et la variation. */
  function previous(core, pid) {
    const today = dayKey(core.now()); let last = null;
    for (const o of priceOps(core, pid)) if (dayKey(o.t) < today) last = o;
    return last ? { cpk: last.d.cpk, t: last.t } : null;
  }
  function clientPrices(core, cid) {
    const m = new Map();
    for (const o of core.byType('price.client')) if (o.d.cid === cid) { if (o.d.cpk == null) m.delete(o.d.pid); else m.set(o.d.pid, o.d.cpk); }
    return m;
  }
  function allClientPrices(core) {
    const m = new Map();
    for (const o of core.byType('price.client')) { const k = o.d.cid + '|' + o.d.pid; if (o.d.cpk == null) m.delete(k); else m.set(k, { cid: o.d.cid, pid: o.d.pid, cpk: o.d.cpk, t: o.t }); }
    return Array.from(m.values());
  }

  /** Prix applicable : spécial du client (si l'option est active), sinon prix du jour, sinon rien. */
  function priceOf(core, pid, cid) {

<script>/* ============================================================================
