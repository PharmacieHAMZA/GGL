<style>:root{--bg:#f6f5f0;--surface:#fff;--ink:#1d2a1f;--muted:#66705f;--line:#e2e0d6;--accent:#2f7d3a;--accent-ink:#fff;--accent-soft:#e3f1e2;--warn:#b86a00;--warn-soft:#fbefd9;--bad:#b3261e;--bad-soft:#fbe3e0;--radius:14px;--font:'Bricolage Grotesque','Cairo',system-ui,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121712;--surface:#1b231c;--ink:#e8efe6;--muted:#9aa793;--line:#2b362c;--accent:#6fcf7d;--accent-ink:#0c1a0e;--accent-soft:#1f3322;--warn:#f0b24a;--warn-soft:#3a2d12;--bad:#ff8a80;--bad-soft:#3d1b18;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121712;--surface:#1b231c;--ink:#e8efe6;--muted:#9aa793;--line:#2b362c;--accent:#6fcf7d;--accent-ink:#0c1a0e;--accent-soft:#1f3322;--warn:#f0b24a;--warn-soft:#3a2d12;--bad:#ff8a80;--bad-soft:#3d1b18;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.4}
body{min-height:100vh;padding:0 16px calc(84px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
header.top{display:flex;align-items:center;gap:8px;padding:max(14px,env(safe-area-inset-top)) 0 10px;position:sticky;top:0;background:var(--bg);z-index:5}
header.top h1{font-size:20px;margin:0;flex:1;letter-spacing:-.01em}
h2{font-size:15px;margin:22px 0 8px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin:0 0 12px}
.big{font-size:34px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.muted{color:var(--muted);font-size:14px}.mono{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;word-break:break-all}
.btn{min-height:48px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}.btn.sm{min-height:40px;padding:0 12px;font-size:14px}
.btn:active{transform:scale(.97)}.btn:disabled{opacity:.45}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row.grow>*{flex:1}
.chip{min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
input[type=text],input[type=number],textarea,select{width:100%;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;padding:8px 12px}
textarea{min-height:90px}label.f{display:block;margin:10px 0 4px;font-size:14px;color:var(--muted)}
.op{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}.op:last-child{border:0}
.op .id{font-weight:700;min-width:58px}.op .amt{margin-inline-start:auto;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.op.void .amt,.op.void .what{text-decoration:line-through;color:var(--muted)}
.op .tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--warn-soft);color:var(--warn);margin-top:4px}
.in{color:var(--accent)}.out{color:var(--bad)}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:600}
.pill.ok{background:var(--accent-soft);color:var(--accent)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.warn{background:var(--warn-soft);color:var(--warn)}
nav.tabs{position:fixed;inset-inline:0;bottom:0;display:flex;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto;z-index:6}
nav.tabs button{flex:1;min-height:52px;border:0;background:none;color:var(--muted);font:inherit;font-weight:600;font-size:13px;border-radius:10px;cursor:pointer}
nav.tabs button.on{color:var(--accent);background:var(--accent-soft)}
#sheet-root .scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
#sheet-root .sheet{background:var(--surface);width:100%;max-width:720px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
#sheet-root .sheet.enter{animation:up .22s ease-out}@keyframes up{from{transform:translateY(40px);opacity:0}}
.toast{position:fixed;inset-inline:16px;bottom:calc(84px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:12px;z-index:30;text-align:center}
.test{display:flex;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}.test .e{color:var(--bad);font-size:12.5px}
[dir=rtl] .op .amt{text-align:start}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
/* Porte d'entrée : styles autonomes (préfixe g-), utilisent les jetons de la page s'ils existent. */
.g-wrap{max-width:420px;margin:0 auto;padding:28px 16px 20px;text-align:center;color:var(--ink,#1d2a1f)}
.g-wrap h2{font-size:22px;margin:0 0 6px;letter-spacing:-.01em;text-transform:none;color:inherit}
.g-muted{color:var(--muted,#66705f);font-size:14px}
.g-dots{display:flex;gap:12px;justify-content:center;margin:20px 0 8px;min-height:20px}
.g-dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--muted,#66705f);display:block}
.g-dots i.on{background:var(--accent,#2f7d3a);border-color:var(--accent,#2f7d3a)}
.g-msg{min-height:44px;font-size:14px;color:var(--bad,#b3261e)}.g-msg.info{color:var(--muted,#66705f)}
.g-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:8px auto 0;max-width:300px;direction:ltr}
.g-pad button{min-height:64px;border-radius:18px;border:1px solid var(--line,#e2e0d6);background:var(--surface,#fff);color:var(--ink,#1d2a1f);font:inherit;font-size:24px;font-weight:600;cursor:pointer;touch-action:manipulation}
.g-pad button:active{background:var(--accent-soft,#e3f1e2)}.g-pad .go{background:var(--accent,#2f7d3a);color:var(--accent-ink,#fff);border-color:var(--accent,#2f7d3a)}
.g-code{font-family:ui-monospace,Menlo,monospace;font-size:26px;font-weight:700;letter-spacing:.06em;direction:ltr;padding:16px;border:2px dashed var(--accent,#2f7d3a);border-radius:14px;margin:16px 0;background:var(--accent-soft,#e3f1e2);color:var(--accent,#2f7d3a)}
.g-btn{display:block;width:100%;min-height:52px;margin:8px 0;border-radius:14px;border:1px solid var(--line,#e2e0d6);background:var(--surface,#fff);color:var(--ink,#1d2a1f);font:inherit;font-weight:700;cursor:pointer}
.g-btn.primary{background:var(--accent,#2f7d3a);color:var(--accent-ink,#fff);border-color:var(--accent,#2f7d3a)}.g-btn:disabled{opacity:.45}
.g-row{display:flex;gap:8px}.g-row .g-btn{flex:1}
.g-chip{min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line,#e2e0d6);background:var(--surface,#fff);color:var(--ink,#1d2a1f);font:inherit;font-weight:600;cursor:pointer;margin-top:14px}
.g-ack{display:flex;gap:10px;align-items:center;justify-content:center;margin:14px 0}.g-ack input{width:24px;height:24px}
.g-input{width:100%;min-height:52px;border-radius:12px;border:1px solid var(--line,#e2e0d6);background:var(--surface,#fff);color:var(--ink,#1d2a1f);font:inherit;text-align:center;margin-top:14px;padding:8px 12px}
/* M17 — coque de l'application (barre du haut, accueil, outils) */
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font)}
body{max-width:none;padding:0;min-height:100%}
#shell{position:fixed;inset:0;display:flex;flex-direction:column}
#shell[hidden]{display:none}
.sh-top{display:flex;align-items:center;gap:6px;padding:max(8px,env(safe-area-inset-top)) 10px 8px;background:var(--surface);border-bottom:1px solid var(--line);flex:none}
.sh-top h1{flex:1;margin:0;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh-top .ib{min-width:44px;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-weight:700;cursor:pointer}
.sh-top .ib[hidden]{display:none}
.sh-role{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.sh-role.dep{background:var(--warn-soft);color:var(--warn)}
#sh-home{flex:1;overflow:auto;padding:14px 14px calc(24px + env(safe-area-inset-bottom))}
#sh-home[hidden]{display:none}
.sh-hello{margin:0 0 12px;color:var(--muted);font-size:14px}
.sh-bk{display:block;width:100%;text-align:start;margin:0 0 14px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;cursor:pointer}
.sh-bk.warn{border-color:var(--warn);background:var(--warn-soft)}.sh-bk.bad{border-color:var(--bad);background:var(--bad-soft)}
.sh-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:620px){.sh-grid{grid-template-columns:repeat(3,1fr)}}
.sh-tile{display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-height:92px;padding:14px;border-radius:16px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;text-align:start;cursor:pointer}
.sh-tile:active{transform:scale(.97)}
.sh-tile .ic{font-size:26px;line-height:1}.sh-tile b{font-size:15px}.sh-tile small{color:var(--muted);font-size:12.5px}
.sh-tile.main{grid-column:1/-1;background:var(--accent);color:var(--accent-ink);border-color:var(--accent);flex-direction:row;align-items:center;gap:14px;min-height:84px}
.sh-tile.main small{color:inherit;opacity:.85}.sh-tile.main .ic{font-size:34px}
.sh-tools{margin-top:18px;text-align:center}.sh-tools button{background:none;border:0;color:var(--muted);font:inherit;text-decoration:underline;padding:10px;cursor:pointer}
#sh-frame{flex:1;width:100%;border:0;background:var(--bg)}
#sh-frame[hidden]{display:none}
#sh-sheet{position:fixed;inset:0;z-index:50}
#sh-sheet:empty{display:none}
#sh-sheet .scrim{position:absolute;inset:0;background:rgba(0,0,0,.45)}
#sh-sheet .box{position:absolute;inset-inline:0;bottom:0;max-height:88%;overflow:auto;background:var(--surface);border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
#sh-sheet .box h3{margin:0 0 6px}#sh-sheet .box p{color:var(--muted);font-size:14px;margin:6px 0}
#sh-sheet .btn{width:100%;margin-top:8px}
#sh-sheet input{width:100%;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:0 12px;font:inherit;margin-top:8px}
#sh-toast{position:fixed;inset-inline:0;bottom:calc(20px + env(safe-area-inset-bottom));display:flex;justify-content:center;z-index:60;pointer-events:none}
#sh-toast div{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;max-width:90%}
#gate{position:fixed;inset:0;z-index:40;background:var(--bg);overflow:auto}
#upd{position:fixed;inset-inline:12px;top:max(8px,env(safe-area-inset-top));z-index:70;background:var(--accent);color:var(--accent-ink);padding:10px 14px;border-radius:12px;display:none;gap:10px;align-items:center;justify-content:space-between}
#upd.on{display:flex}#upd button{min-height:36px;border-radius:10px;border:0;padding:0 12px;font:inherit;font-weight:700}
</style>

<div id="gate"></div>
<div id="shell" hidden>
  <header class="sh-top">
    <button class="ib" id="sh-back" data-a="home" aria-label="Accueil" hidden>⌂</button>
    <h1 id="sh-title"></h1>
    <span class="sh-role" id="sh-role"></span>
    <button class="ib" id="sh-lang" data-a="lang">ع</button>
    <button class="ib" data-a="theme" aria-label="thème">◐</button>
    <button class="ib" data-a="lock" aria-label="verrouiller">🔒</button>
  </header>
  <main id="sh-home"></main>
  <iframe id="sh-frame" title="écran" hidden></iframe>
</div>
<div id="sh-sheet"></div>
<div id="sh-toast"></div>
<div id="upd"><span id="upd-t">Nouvelle version prête</span><button id="upd-go">Mettre à jour</button></div>

dTag: 'Annulée',\n      dayEmpty: 'Aucune vente aujourd’hui.', dTotal: 'Ventes', dCash: 'Encaissé', dCredit: 'À crédit', dKg: 'Poids vendu', dCount: 'Tickets', voidAct: 'Annuler cette vente', voidTitle: 'Annuler la vente', voidWhy: 'Motif', voidDo: 'Annuler la vente', voidDone: 'Vente annulée', voidNote: 'Rien n’est effacé : la vente reste visible, barrée. La dette liée est annulée avec elle.',\n      sold: 'Vente {n} enregistrée', tools: 'Outils', runTests: 'Lancer tous les tests', running: 'Exécution…', result: '{ok}/{n} réussis', wipe: 'Effacer toutes les données de ce test', wipeWarn: 'Tout sera effacé, code gérant compris. Vous recommencerez à zéro.', wipeDo: 'Tout effacer',\n      seedAll: 'Charger produits, prix et clients d’exemple', seeded: 'Exemples chargés', noProd: 'Aucun produit : chargez les exemples ou créez-en dans le catalogue.', netNone: 'Pas de poids net par caisse'\n    },\n    ar: {\n      banner: 'نسخة تجريبية: البيانات محفوظة على هذا الجهاز فقط', back: 'رجوع', close: 'إغلاق', cancel: 'إلغاء', lockBtn: 'قفل', themeBtn: 'المظهر',\n      s1: 'الزبون', s2: 'المنتجات', s3: 'الدفع', tClient: 'اختر الزبون', tProd: 'اختر المنتجات', tPay: 'الدفع', tTicket: 'التذكرة', tDay: 'مبيعات اليوم',\n      navSale: 'بيع', navDay: 'مبيعات اليوم', cash: 'بيع نقدًا', cashSub: 'بدون زبون', newClient: 'زبون جديد', newName: 'اسم الزبون', create: 'إنشاء ومتابعة',\n      newHint: 'سقف الدين 0 دج: يحدده المسير لاحقًا. البيع نقدًا ممكن.', search: 'ابحث عن زبون', freq: 'الزبائن', debt: 'الدين', ceil: 'السقف',\n      pickHint: 'المس منتجًا لوزنه', lines: 'سطور', line: 'سطر', pay: 'الدفع', perKg: 'دج/كغ', kg: 'كغ', caisse: 'صندوق', q: 'قنطار', da: 'دج',\n      noPrice: 'بدون سعر', staleFlag: 'سعر الأمس', priceDay: 'سعر اليوم', priceFix: 'السعر ثابت', staleWarn: 'هذا السعر من قبل اليوم: أكّده في أسعار اليوم.', lossWarn: 'بيع بخسارة', add: 'إضافة',\n      total: 'المجموع', cashPay: 'نقدًا', credit: 'بالدين', partial: 'جزئي', paidNow: 'المدفوع الآن', remaining: 'المتبقي دينًا', debtAfter: 'دين الزبون بعد البيع', partialHint: 'المبلغ المدفوع الآن', partialBad: 'أدخل مبلغًا أقل من المجموع.',\n      blocked: 'تجاوز السقف بـ {x} دج. البيع محظور.', excBtn: 'استثناء المسير', excWhy: 'سبب الاستثناء', excOn: 'تم السماح بالاستثناء', excOnlyG: 'تجاوز السقف: المسير وحده يستطيع فتح هذا البيع.',\n      m_fidele: 'زبون وفي', m_promesse: 'وعد بالدفع', m_autre: 'آخر', m_erreur: 'خطأ في الإدخال', m_retour: 'الزبون غادر', m_doublon: 'تكرار',\n      validate: 'تأكيد البيع', newSale: 'بيع جديد', undo: 'إلغاء آخر سطر', none: 'لا توجد سطور. ارجع لاختيار منتج.', del: 'حذف',\n      ticketNo: 'تذكرة', client: 'الزبون', anon: 'نقدًا', paid: 'المدفوع', thanks: 'شكرًا', print: 'معاينة التذكرة. الطباعة مع وحدة التذاكر.', voidedTag: 'ملغاة',\n      dayEmpty: 'لا مبيعات اليوم.', dTotal: 'المبيعات', dCash: 'المقبوض', dCredit: 'بالدين', dKg: 'الوزن المباع', dCount: 'التذاكر', voidAct: 'إلغاء هذا البيع', voidTitle: 'إلغاء البيع', voidWhy: 'السبب', voidDo: 'إلغاء البيع', voidDone: 'تم إلغاء البيع', voidNote: 'لا شيء يُمحى: يبقى البيع ظاهرًا ومشطوبًا. يُلغى الدين المرتبط معه.',\n      sold: 'تم تسجيل البيع {n}', tools: 'أدوات', runTests: 'تشغيل كل الاختبارات', running: 'جارٍ التنفيذ…', result: 'نجح {ok}/{n}', wipe: 'مسح كل بيانات هذا الاختبار', wipeWarn: 'سيُمسح كل شيء بما فيه رمز المسير. ستبدأ من الصفر.', wipeDo: 'مسح الكل',\n      seedAll: 'تحميل منتجات وأسعار وزبائن كمثال', seeded: 'تم تحميل الأمثلة', noProd: 'لا منتجات: حمّل الأمثلة أو أنشئها في الكتالوج.', netNone: 'لا وزن صافٍ للصندوق'\n    }\n  };\n  const pre = o => Object.fromEntries(Object.entries(o).map(([k, v]) => ['vu.' + k, v]));\n  core.addStrings({ fr: pre(TX.fr), ar: pre(TX.ar) });\n\n  const S = { route: 'client', cid: null, q: '', cart: [], sheet: null, mode: 'cash', partial: '', motif: null, ticketId: null, from: 'client', newClient: false, newName: '' };\n  const LANG = () => core.getPref('lang'), t = (k, v) => core.t('vu.' + k, v);\n  const esc = s => String(s == null ? '' : s).replace(/[&<>\"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;' }[c]));\n  const fmt = n => core.fmt.int(Math.round(n)), money = n => core.fmt.da(Math.round(n));\n  const perKg = c => core.fmt.price(c), kgTxt = g => core.fmt.kg(g);\n  const errText = e => { if (e.code === 'GUARD' || e.code === 'CHECK') return e.message; const k = 'err.' + e.code, s = core.t(k); return s !== k ? s : (e.message || String(e)); };\n  const arrow = () => (LANG() === 'ar' ? '→' : '←');\n  const products = () => Catalogue.getProducts(core).filter(p => !p.archived);\n  const prod = id => Catalogue.getProducts(core).find(p => p.id === id);\n  const primary = p => (LANG() === 'ar' && p.ar ? p.ar : p.fr), secondary = p => (LANG() === 'ar' ? p.fr : p.ar);\n  const hue = p => (p.draw && Dessins.has(p.draw) ? Dessins.all[p.draw].hue : 120);\n  const art = p => (p.draw && Dessins.has(p.draw) ? Dessins.svg(p.draw) : '');\n  const qtyStr = qm => { const ip = Math.floor(qm / 1000), fp = String(qm % 1000).padStart(3, '0').replace(/0+$/, ''); return core.fmt.int(ip) + (fp ? ',' + fp : ''); };\n  const qmOf = s => { try { return Num.parseDecimal(s || '0', 3); } catch (e) { return 0; } };\n  const cur = () => (S.cid ? Clients.getClient(core, S.cid) : null);\n  const MOT = ['m_fidele', 'm_promesse', 'm_autre'];\n\n  /* ---------- calcul du panier ---------- */\n  function calc() {\n    const c = cur();\n    let pv = null; try { pv = Ventes.preview(core, S.cid, S.cart, null); } catch (e) { pv = { lines: [], total: 0 }; }\n    const total = pv.total, paid = S.mode === 'cash' ? total : S.mode === 'credit' ? 0 : Math.min(parseInt(S.partial || '0', 10) || 0, total), credit = total - paid;\n    const chk = c && credit > 0 ? Credit.verifierCredit(core, c.id, credit) : null, L = c ? Credit.ledger(core, c.id) : null;\n    const blocked = !!(chk && !chk.ok), mayExc = can('credit.exception');\n    const partialBad = S.mode === 'partial' && !(paid > 0 && paid < total);\n    return { c, L, lines: pv.lines, total, paid, credit, chk, blocked, mayExc, partialBad, newDebt: L ? Math.max(0, L.debt) + credit : 0, canPay: !(blocked && !(mayExc && S.motif)) && !partialBad && total > 0 };\n  }\n\n  /* ---------- en-tête ---------- */\n  function header() {\n    const r = S.route, titles = { client: 'tClient', products: 'tProd', pay: 'tPay', ticket: 'tTicket', day: 'tDay' };\n    const idx = { client: 0, products: 1, pay: 2 }[r], back = r === 'products' || r === 'pay' || (r === 'ticket' && S.from === 'day');\n    return '<header class=\"head\"><div class=\"head-row\">' + (back ? '<button class=\"icon-btn\" data-a=\"back\" aria-label=\"' + t('back') + '\">' + arrow() + '<\/button>' : '') + '<h1>' + t(titles[r]) + '<\/h1>' +\n      '<button class=\"icon-btn\" data-a=\"lock\" aria-label=\"' + t('lockBtn') + '\">🔒<\/button><div class=\"lang\" role=\"group\"><button data-a=\"lang\" data-v=\"fr\" aria-pressed=\"' + (LANG() === 'fr') + '\">FR<\/button><button data-a=\"lang\" data-v=\"ar\" aria-pressed=\"' + (LANG() === 'ar') + '\">ع<\/button><\/div><\/div>' +\n      (idx != null ? '<div class=\"steps\">' + ['s1', 's2', 's3'].map((s, i) => '<span class=\"' + (i === idx ? 'on' : '') + '\">' + t(s) + '<\/span>').join('') + '<\/div>' : '') +\n      '<div class=\"pillrow\"><span class=\"rolepill ' + (acc.role === 'depannage' ? 'dep' : '') + '\">' + esc(core.t('role.' + acc.role)) + '<\/span><span class=\"sample\">' + t('banner') + '<\/span><button class=\"minilink\" data-a=\"theme\">◐ ' + t('themeBtn') + '<\/button><\/div><\/header>';\n  }\n  const tabbar = () => '<nav class=\"tabbar\"><button data-a=\"goSale\" ' + (S.route === 'client' ? 'aria-current=\"page\"' : '') + '>' + t('navSale') + '<\/button><button data-a=\"goDay\" ' + (S.route === 'day' ? 'aria-current=\"page\"' : '') + '>' + t('navDay') + '<\/button><\/nav>';\n\n  /* ---------- écran : client ---------- */\n  function clientRows() {\n    const l = Clients.searchClients(core, S.q, false).map(c => ({ c, L: Credit.ledger(core, c.id) }));\n    return l.map(({ c, L }) => { const d = Math.max(0, L.debt), pct = c.ceiling ? Math.min(100, Math.round(d / c.ceiling * 100)) : (d > 0 ? 100 : 0); return '<button class=\"client\" data-a=\"pickClient\" data-v=\"' + c.id + '\"><div class=\"client-top\"><b>' + esc(c.name) + '<\/b><small>' + t('debt') + ' ' + fmt(d) + ' / ' + fmt(c.ceiling) + '<\/small><\/div><div class=\"meter ' + (pct >= 100 ? 'full' : pct >= 80 ? 'high' : '') + '\"><i style=\"width:' + pct + '%\"><\/i><\/div><\/button>'; }).join('');\n  }\n  function screenClient() {\n    if (S.newClient) return '<div class=\"newc\"><label class=\"label\" for=\"newname\">' + t('newName') + '<\/label><input class=\"search\" id=\"newname\" type=\"text\" value=\"' + esc(S.newName) + '\" autocomplete=\"off\"><span class=\"note\">' + t('newHint') + '<\/span><div class=\"row2\"><button class=\"btn ghost\" data-a=\"newClientClose\">' + t('back') + '<\/button><button class=\"btn\" id=\"create\" data-a=\"createClient\"' + (S.newName.trim() ? '' : ' disabled') + '>' + t('create') + '<\/button><\/div><\/div>';\n    return '<button class=\"big-cash\" data-a=\"pickCash\"><span><b>' + t('cash') + '<\/b><small>' + t('cashSub') + '<\/small><\/span><b>→<\/b><\/button>' +\n      (can('client.creer') ? '<button class=\"btn ghost\" data-a=\"newClientOpen\">+ ' + t('newClient') + '<\/button>' : '') +\n      '<input class=\"search\" id=\"q\" type=\"search\" placeholder=\"' + t('search') + '\" value=\"' + esc(S.q) + '\" autocomplete=\"off\"><div class=\"label\">' + t('freq') + '<\/div><div class=\"clients\" id=\"clist\">' + clientRows() + '<\/div>' +\n      (can('reglages') ? '<button class=\"linkish\" data-a=\"openTools\">' + t('tools') + '<\/button>' : '');\n  }\n\n  /* ---------- écran : produits ---------- */\n  function screenProducts() {\n    const c = cur(), ps = products(), L = c ? Credit.ledger(core, c.id) : null, warnStale = core.getSetting('prix.confirmerJour');\n    const who = '<button class=\"who\" data-a=\"toClient\"><b>' + (c ?  données passent uniquement par Clients / Credit / core. */\n(async function () {\n  'use strict';\n  const core = Noyau.create({ adapter: 'auto', auto: { name: 'ggl-m4m8-test', key: 'ggl.m4m8.test' } });\n  await core.init();\n  core.use(Acces.module); core.use(Reglages.module); core.use(Clients.module); core.use(Credit.module);\n  const acc = Acces.of(core);\n\n  /* ---------- raccourcis vers les modules ---------- */\n  const getClients = () => Clients.getClients(core), getClient = id => Clients.getClient(core, id), normName = Clients.normName;\n  const similarClient = (n, x) => Clients.similarClient(core, n, x);\n  const ledger = cid => Credit.ledger(core, cid), verifierCredit = (cid, m) => Credit.verifierCredit(core, cid, m), simulate = Credit.simulate;\n  const waDigits = Clients.waDigits, waLink = (p, x) => Clients.waLink(p, x) || '#';\n  const can = p => core.can(p);\n  const fid = id => id[0] + '-' + id.slice(1);\n\n  /* ---------- Textes FR / AR (préfixe cl. dans le dictionnaire du noyau) ---------- */\n  const TX = {\n    fr: {\n      banner: \"Version test : données gardées sur cet appareil seulement\", back: 'Retour', close: 'Fermer', cancel: 'Annuler', save: 'Enregistrer', create: 'Créer le client',\n      tList: 'Clients', tDue: 'Relances', tNew: 'Nouveau client', tEdit: 'Modifier le client', navClients: 'Clients', navDue: 'Relances',\n      search: 'Rechercher un client', newClient: 'Nouveau client', all: 'Tous', watch: 'À surveiller', late: 'En retard', okSt: 'À jour', archived: 'Archivés',\n      totalDue: 'Total dû par les clients', nClients: 'clients', nLate: 'en retard', none: 'Aucun client trouvé',\n      debt: 'Dette', ceiling: 'Plafond', available: 'Reste disponible', advance: 'Avance du client', oldest: 'Plus ancienne', dayU: 'j',\n      b1: '0-7 jours', b2: '8-30 jours', b3: '+30 jours',\n      collect: 'Encaisser', addDebt: 'Ajouter une dette (test)', addDebtShort: '+ Dette test', edit: 'Modifier', remind: 'Rappel', writeoff: 'Passer en pe .', wipeDo: 'مسح الكل',\n      noClients: 'لا يوجد زبون حتى الآن.', seed: 'تحميل 6 زبائن كمثال', seedHelp: 'بيانات وهمية مع ديونها للتجربة.', seeded: 'تم تحميل زبائن المثال', receiptTitle: 'تذكرة'\n    }\n  };\n  const pre = o => Object.fromEntries(Object.entries(o).map(([k, v]) => [('cl.' + k), v]));\n  core.addStrings({ fr: pre(TX.fr), ar: pre(TX.ar) });\n\n  /* ---------- État de l'interface ---------- */\n  const S = { route: { name: 'list' }, q: '', filter: 'all', showArchived: false, tab: 'debts', sheet: null, form: null };\n  const LANG = () => core.getPref('lang');\n  const t = (k, v) => core.t('cl.' + k, v);\n  const tm = k => { const s = core.t('cl.' + k); return s === 'cl.' + k ? k : s; };            // motif : clé connue ou texte libre\n  const esc = s => String(s == null ? '' : s).replace(/[&<>\"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;' }[c]));\n  const fmt = n => core.fmt.int(Math.round(n));\n  const money = n => core.fmt.da(Math.round(n));\n  const dateStr = ts => core.fmt.date(ts), dateTime = ts => core.fmt.dateTime(ts);\n  const stLabel = s => ({ ok: t('okSt'), watch: t('watch'), late: t('late') }[s]);\n  const stCls = s => ({ ok: 'ok', watch: 'warn', late: 'bad' }[s]);\n  const arrow = () => (LANG() === 'ar' ? '→' : '←');\n  const meterCls = (debt, ceil) => { if (!ceil) return debt > 0 ? 'full' : ''; const p = debt / ceil; return p >= 1 ? 'full' : p >= .8 ? 'high' : ''; };\n  const meterPct = (debt, ceil) => (ceil ? Math.min(100, Math.round(Math.max(0, debt) / ceil * 100)) : (debt > 0 ? 100 : 0));\n  const MOTIFS = { exc: ['m_fidele', 'm_promesse', 'm_autre'], wo: ['m_introuvable', 'm_litige', 'm_faillite', 'm_autre'], void: ['m_erreur', 'm_doublon', 'm_autre'] };\n  const errText = e => { if (e.code === 'GUARD' || e.code === 'CHECK') return e.message; const k = 'err.' + e.code, s = core.t(k); return s !== k ? s : (e.message || String(e)); };\n\n  /* ---------- En-tête et navigation ---------- */\n  function header() {\n    const r = S.route.name;\n    const title = { list: 'tList', due: 'tDue', client: null, form: S.route.id ? 'tEdit' : 'tNew' }[r];\n    const name = r === 'client' ? esc(getClient(S.route.id).name) : t(title);\n    const back = (r === 'client' || r === 'form') ? '<button class=\"icon-btn\" data-a=\"back\" aria-label=\"' + t('back') + '\">' + arrow() + '<\/button>' : '';\n    const role = acc.role;\n    return '<header class=\"head\"><div class=\"head-row\">' + back + '<h1>' + name + '<\/h1>' +\n      '<button class=\"icon-btn\" data-a=\"lock\" aria-label=\"' + t('lockBtn') + '\">🔒<\/button>' +\n      '<div class=\"lang\" role=\"group\" aria-label=\"Langue\"><button data-a=\"lang\" data-v=\"fr\" aria-pressed=\"' + (LANG() === 'fr') + '\">FR<\/button><button data-a=\"lang\" data-v=\"ar\" aria-pressed=\"' + (LANG() === 'ar') + '\">ع<\/button><\/div><\/div>' +\n      '<div class=\"pillrow\"><span class=\"rolepill ' + (role === 'depannage' ? 'dep' : '') + '\">' + esc(core.t('role.' + role)) + '<\/span><span class=\"sample\">' + t('banner') + '<\/span><button class=\"minilink\" data-a=\"theme\">◐ ' + t('themeBtn') + '<\/button><\/div><\/header>';\n  }\n  function nav() {\n    const n = dueList().length, r = S.route.name;\n    return '<nav class=\"nav\"><button data-a=\"goList\" ' + (r === 'list' ? 'aria-current=\"page\"' : '') + '>' + t('navClients') + '<\/button><button data-a=\"goDue\" ' + (r === 'due' ? 'aria-current=\"page\"' : '') + '>' + t('navDue') + (n ? ' (' + n + ')' : '') + '<\/button><\/nav>';\n  }\n\n  /* ---------- Écran : liste des clients ---------- */\n  function visibleClients() {\n    return Clients.searchClients(core, S.q, S.showArchived).map(c => ({ c, L: ledger(c.id) }))\n      .filter(x => S.filter === 'all' || x.L.status === S.filter)\n      .sort((a, b) => (b.L.debt > 0) - (a.L.debt > 0) || b.L.debt - a.L.debt || a.c.name.localeCompare(b.c.name));\n  }\n  function clientRows() {\n    const rows = visibleClients();\n    if (!rows.length) return '<div class=\"empty\">' + t('none') + '<\/div>';\n    return rows.map(({ c, L }) => '<button class=\"row\" data-a=\"open\" data-v=\"' + c.id + '\"><div class=\"row-between\"><b>' + esc(c.name) + '<\/b>' + (L.debt > 0 ? '<span class=\"pill ' + stCls(L.status) + '\">' + stLabel(L.status) + '<\/span>' : '') + '<\/div>' +\n      '<div class=\"row-between\"><span class=\"sub\">' + t('debt') + ' ' + fmt(Math.max(0, L.debt)) + ' / ' + fmt(c.ceiling) + '<\/span>' + (L.debt > 0 ? '<span class=\"sub\">' + L.oldest + ' ' + t('dayU') + '<\/span>' : '') + '<\/div>' +\n      '<div class=\"meter ' + meterCls(L.debt, c.ceiling) + '\"><i style=\"width:' + meterPct(L.debt, c.ceiling) + '%\"><\/i><\/div><\/button>').join('');\n  }\n  function screenList() {\n    const T = Credit.totals(core);\n    const f = k => '<button data-a=\"filter\" data-v=\"' + k + '\" aria-pressed=\"' + (S.filter === k) + '\">' + t(k === 'all' ? 'all' : k === 'watch' ? 'watch' : 'late') + '<\/button>';\n    const empty = !getClients().length;\n    return '<div class=\"card\"><span class=\"label\" style=\"margin:0\">' + t('totalDue') + '<\/span><span class=\"big\">' + money(T.due) + '<\/span><span class=\"sub\">' + T.clients + ' ' + t('nClients') + ' · ' + T.late + ' ' + t('nLate') + '<\/span><\/div>' +\n      (can('client.creer') ? '<button class=\"btn\" data-a=\"newClient\">+ ' + t('newClient') + '<\/button>' : '') +\n      (empty ? '<div class=\"card\"><b>' + t('noClients') + '<\/b>' + (can('client.creer') && can('vendre') && can('client.modifier') ? '<span class=\"sub\">' + t('seedHelp') + '<\/span><button class=\"btn ghost\" data-a=\"seed\">' + t('seed') + '<\/button>' : '') + '<\/div>' : '') +\n      '<input class=\"search\" id=\"q\" type=\"search\" placeholder=\"' + t('search') + '\" value=\"' + esc(S.q) + '\" autocomplete=\"off\">' +\n      '<div class=\"chips\">' + f('all') + f('watch') + f('late') + '<button data-a=\"toggleArch\" aria-pressed=\"' + S.showArchived + '\">' + t('archived') + '<\/button><\/div>' +\n      '<div class=\"rows\" id=\"clist\">' + clientRows() + '<\/div>' +\n      (can('reglages') ? '<button class=\"linkish\" data-a=\"openTools\">' + t('tools') + '<\/button>' : '');\n  }\n\n  /* ---------- Écran : fiche client ---------- */\n  function opLabel(o) { return ({ invoice: 'hInvoice', payment: 'hPayment', writeoff: 'hWriteoff', exception: 'hException', void: 'hVoid', 'client.create': 'hCreate', 'client.update': 'hUpdate' })[o.type] || (o.type === 'client.archive' ? (o.d.on ? 'hArchive' : 'hRestore') : o.type); }\n  function clientOps(cid) {\n    return core.all().filter(o => {\n      if (o.type === 'void') { const tg = core.get(o.d.ref); return !!tg && tg.d && tg.d.cid === cid; }\n      return o.id === cid || (o.d && o.d.cid === cid && ['invoice', 'payment', 'writeoff', 'exception', 'client.update', 'client.archive'].includes(o.type));\n    });\n  }\n  function tabDebts(L) {\n    if (!L.rows.length) return '<div class=\"empty\">' + t('noDebt') + '<\/div>';\n    return '<div class=\"card\" style=\"padding-block:4px\">' + L.rows.slice().reverse().map(r => {\n      const open = r.remaining > 0, cls = r.bucket === 1 ? 'ok' : r.bucket === 2 ? 'warn' : 'bad';\n      return '<div class=\"line ' + (open ? '' : 'dim') + '\"><div class=\"grow\"><b>' + t('invoice') + ' ' + fid(r.id) + (r.exc ? ' <span class=\"pill warn\">' + t('excTag') + '<\/span>' : '') + '<\/b><small>' + dateStr(r.t) + ' · ' + fmt(r.amount) + '<\/small><\/div>' +\n        (open ? '<span class=\"pill ' + cls + '\">' + r.age + ' ' + t('dayU') + '<\/span>' : '<span class=\"pill mute\">' + t('paidOff') + '<\/span>') + '<span class=\"amt\">' + (open ? money(r.remaining) : '') + '<\/span><\/div>';\n    }).join('') + '<\/div>';\n  }\n  function tabHist(cid) {\n    const ops = clientOps(cid).slice().reverse();\n    if (!ops.length) return '<div class=\"empty\">' + t('noHist') + '<\/div>';\n    return '<div class=\"card\" style=\"padding-block:4px\">' + ops.map(o => {\n      const amount = o.d && o.d.amount != null ? money(o.d.amount) : '', isV = core.isVoided(o.n), canVoid = ['invoice', 'payment', 'writeoff'].includes(o.type) && !isV && can('annuler');\n      const extra = o.d && o.d.motif ? ' · ' + esc(tm(o.d.motif)) : '';\n      return '<div class=\"line ' + (isV ? 'void dim' : '') + '\"><div class=\"grow\"><b>' + t(opLabel(o)) + (isV ? ' <span class=\"pill mute\">' + t('voided') + '<\/span>' : '') + '<\/b><small>' + dateTime(o.at) + extra + '<\/small><\/div><span class=\"amt\">' + amount + '<\/span>' + (canVoid ? '<button class=\"x\" data-a=\"openVoid\" data-v=\"' + o.id + '\">' + t('voidAct') + '<\/button>' : '') + '<\/div>';\n    }).join('') + '<\/div><span class=\"note mute\">' + t('soon') + '<\/span>';\n  }\n  function tabPays(cid) {\n    const ps = core.live('payment').filter(o => o.d.cid === cid).reverse();\n    if (!ps.length) return '<div class=\"empty\">' + t('noPay') + '<\/div>';\n    return '<div class=\"card\" style=\"padding-block:4px\">' + ps.map(o => '<div class=\"line\"><div class=\"grow\"><b>' + fid(o.id) + '<\/b><small>' + dateTime(o.at) + '<\/small><\/div><span class=\"amt\">' + money(o.d.amount) + '<\/span><\/div>').join('') + '<\/div>';\n  }\n  function tabOpts(c) {\n    return '<div class=\"card\"><div class=\"row-between\"><span>' + t('optDelay') + '<\/span><b>' + (c.delay ? c.delay + ' ' + t('dayU') : t('optNoDelay')) + '<\/b><\/div>' +\n      '<div class=\"row-between\"><span>' + t('optCons') + '<\/span><b>' + t('cons_' + c.consigne) + '<\/b><\/div>' +\n      '<div class=\"row-between\"><span>' + t('fPhone') + '<\/span><b dir=\"ltr\">' + esc(c.phone || '-') + '<\/b><\/div><div><div class=\"sub\">' + t('fAddr') + '<\/div><div>' + esc(c.address || '-') + '<\/div><\/div>' + (c.notes ? '<div class=\"sub\">' + esc(c.notes) + '<\/div>' : '') + '<\/div>' +\n      '<span class=\"note mute\">' + t('soonPrice') + '<\/span><span class=\"note mute\">' + t('soonCons') + '<\/span>' +\n      (can('client.modifier') ? '<div class=\"row2\"><button class=\"btn ghost\" data-a=\"editClient\">' + t('edit') + '<\/button><button class=\"btn ghost\" data-a=\"archive\">' + (c.archived ? t('restore') : t('archive')) + '<\/button><\/div>' : '');\n  }\n  function screenClient() {\n    const c = getClient(S.route.id), L = ledger(c.id), d = Math.max(0, L.debt);\n    const tabs = [['debts', 'tDebts'], ['hist', 'tHist'], ['pays', 'tPays'], ['opts', 'tOpts']];\n    const body = S.tab === 'debts' ? tabDebts(L) : S.tab === 'hist' ? tabHist(c.id) : S.tab === 'pays' ? tabPays(c.id) : tabOpts(c);\n    const dock = [can('encaisser') ? '<button class=\"btn\" data-a=\"openPay\"' + (d > 0 ? '' : ' disabled') + '>' + t('collect') + '<\/button>' : '', can('vendre') && !c.archived ? '<button class=\"btn ghost\" data-a=\"openDebt\" style=\"background:var(--surface)\">' + t('addDebtShort') + '<\/button>' : ''].join('');\n    return '<div class=\"card\"><div class=\"row-between\"><span class=\"sub\" dir=\"ltr\">' + esc(c.phone || '') + '<\/span>' + (d > 0 ? '<span class=\"pill ' + stCls(L.status) + '\">' + stLabel(L.status) + '<\/span>' : '<span class=\"pill ok\">' + t('okSt') + '<\/span>') + '<\/div>' +\n      (c.address ? '<span class=\"sub\">' + esc(c.address) + '<\/span>' : '') +\n      '<div><span class=\"label\" style=\"margin:0\">' + (L.avance ? t('advance') : t('debt')) + '<\/span><div class=\"big\">' + money(L.avance || d) + '<\/div><\/div>' +\n      '<div class=\"meter ' + meterCls(d, c.ceiling) + '\"><i style=\"width:' + meterPct(d, c.ceiling) + '%\"><\/i><\/div>' +\n      '<div class=\"row-between\"><span class=\"sub\">' + t('ceiling') + ' ' + money(c.ceiling) + '<\/span><span class=\"sub\">' + t('available') + ' ' + money(Math.max(0, c.ceiling - d)) + '<\/span><\/div>' +\n      (c.ceiling === 0 ? '<span class=\"note warn\">' + t('ceil0') + '<\/span>' : '') +\n      '<div class=\"buckets\"><div class=\"bucket\"><small>' + t('b1') + '<\/small><b>' + fmt(L.b1) + '<\/b><\/div><div class=\"bucket b2\"><small>' + t('b2') + '<\/small><b>' + fmt(L.b2) + '<\/b><\/div><div class=\"bucket b3\"><small>' + t('b3') + '<\/small><b>' + fmt(L.b3) + '<\/b><\/div><\/div>' +\n      '<div class=\"row2\"><button class=\"btn ghost\" data-a=\"openRemind\" data-v=\"' + c.id + '\"' + (d > 0 ? '' : ' disabled') + '>' + t('remind') + '<\/button>' + (can('credit.perte') ? '<button class=\"btn ghost\" data-a=\"openWo\"' + (d > 0 ? '' : ' disabled') + '>' + t('writeoff') + '<\/button>' : '') + '<\/div><\/div>' +\n      '<div class=\"tabs\" role=\"tablist\">' + tabs.map(([k, l]) => '<button role=\"tab\" data-a=\"tab\" data-v=\"' + k + '\" aria-selected=\"' + (S.tab === k) + '\">' + t(l) + '<\/button>').join('') + '<\/div>' + body +\n      (dock ? '<div class=\"dock\">' + dock + '<\/div>' : '');\n  }\n\n  /* ---------- Écran : formulaire client ---------- */\n  function screenForm() {\n    const f = S.form, sim = similarClient(f.name, S.route.id);\n    const cons = k => '<button data-a=\"fcons\" data-v=\"' + k + '\" aria-pressed=\"' + (f.consigne === k) + '\">' + t('cons_' + k) + '<\/button>';\n    return '<div class=\"card\"><label class=\"label\" for=\"f-name\" style=\"margin:0\">' + t('fName') + '<\/label><input class=\"field\" id=\"f-name\" data-f=\"name\" type=\"text\" value=\"' + esc(f.name) + '\" autocomplete=\"off\">' +\n      '<span class=\"note warn\" id=\"f-sim\" ' + (sim ? '' : 'hidden') + '>' + (sim ? t('similar', { n: esc(sim.name) }) : '') + '<\/span>' +\n      '<label class=\"label\" for=\"f-phone\" style=\"margin:0\">' + t('fPhone') + '<\/label><input class=\"field\" id=\"f-phone\" data-f=\"phone\" type=\"tel\" dir=\"ltr\" value=\"' + esc(f.phone) + '\" autocomplete=\"off\">' +\n      '<label class=\"label\" for=\"f-address\" style=\"margin:0\">' + t('fAddr') + '<\/label><input class=\"field\" id=\"f-address\" data-f=\"address\" type=\"text\" value=\"' + esc(f.address) + '\" autocomplete=\"off\">' +\n      '<label class=\"label\" for=\"f-ceiling\" style=\"margin:0\">' + t('fCeil') + '<\/label><input class=\"field\" id=\"f-ceiling\" data-f=\"ceiling\" type=\"text\" inputmode=\"numeric\" dir=\"ltr\" value=\"' + esc(f.ceiling) + '\" autocomplete=\"off\">' +\n      '<label class=\"label\" for=\"f-delay\" style=\"margin:0\">' + t('fDelay') + '<\/label><input class=\"field\" id=\"f-delay\" data-f=\"delay\" type=\"text\" inputmode=\"numeric\" dir=\"ltr\" value=\"' + esc(f.delay) + '\" autocomplete=\"off\">' +\n      '<span class=\"label\" style=\"margin:0\">' + t('fCons') + '<\/span><div class=\"chips\">' + cons('avec') + cons('suivi') + cons('aucun') + '<\/div>' +\n      '<label class=\"label\" for=\"f-notes\" style=\"margin:0\">' + t('fNotes') + '<\/label><input class=\"field\" id=\"f-notes\" data-f=\"notes\" type=\"text\" value=\"' + esc(f.notes) + '\" autocomplete=\"off\"><\/div>' +\n      '<div class=\"row2\"><button class=\"btn ghost\" data-a=\"back\">' + t('cancel') + '<\/button><button class=\"btn\" id=\"f-save\" data-a=\"saveForm\"' + (f.name.trim() ? '' : ' disabled') + '>' + (S.route.id ? t('save') : t('create')) + '<\/button><\/div>';\n  }\n\n  /* ---------- Écran : créances à relancer ---------- */\n  const dueList = () => Credit.dueList(core);\n  function screenDue() {\n    const l = dueList();\n    if (!l.length) return '<div class=\"empty\">' + t('dueEmpty') + '<\/div>';\n    const grp = (b, lab) => {\n      const items = l.filter(x => Credit.bucketOf(x.L.oldest) === b); if (!items.length) return '';\n      return '<div class=\"label\">' + lab + ' · ' + money(items.reduce((a, x) => a + x.L.debt, 0)) + '<\/div><div class=\"card\" style=\"padding-block:4px\">' + items.map(({ c, L }) => '<div class=\"line\"><div class=\"grow\"><button data-a=\"open\" data-v=\"' + c.id + '\" style=\"text-align:start;width:100%\"><b>' + esc(c.name) + '<\/b><small>' + L.oldest + ' ' + t('dayU') + ' · ' + stLabel(L.status) + '<\/small><\/button><\/div><span class=\"amt\">' + money(L.debt) + '<\/span><button class=\"icon-btn\" data-a=\"openRemind\" data-v=\"' + c.id + '\" style wipeWarn: 'Tout sera effacé, code gérant compris. Vous recommencerez à zéro.', wipeDo: 'Tout effacer', costDemo: 'Simuler un prix de revient (démo des alertes)', costOn: 'Revient simulé : 70 % du prix d’hier', \n      okLbl: 'Valider'\n    },\n    ar: {\n      banner: 'نسخة تجريبية: البيانات محفوظة على هذا الجهاز فقط', back: 'رجوع', close: 'إغلاق', cancel: 'إلغاء', lockBtn: 'قفل', themeBtn: 'المظهر',\n      tDay: 'أسعار اليوم', tCli: 'أسعار الزبائن', navDay: 'أسعار اليوم', navCli: 'أسعار الزبائن', tools: 'أدوات',\n      done: '{a}/{b} أسعار مؤكدة اليوم', allDone: 'كل الأسعار مؤكدة لليوم', carry: 'تجديد أسعار الأمس ({n})', carried: 'تم تجديد {n} أسعار',\n      fresh: 'مؤكد', stale: 'سعر الأمس', none: 'بدون سعر', kg: 'كغ', caisse: 'صندوق', q: 'قنطار', yesterday: 'الأمس', var: 'التغير',\n      noProd: 'لا منتجات حتى الآن.', seedAll: 'تحميل 12 منتجًا وأسعارها كمثال', seeded: 'تم تحميل المنتجات والأسعار', seedPx: 'تحميل أسعار المثال',\n      setTitle: 'سعر اليوم', setClient: 'سعر خاص', newPrice: 'السعر الجديد (دج للكغ)', validate: 'تأكيد السعر', validateSame: 'تأكيد نفس السعر', same: 'إبقاء {p}', remove: 'إلغاء السعر الخاص',\n      saved: 'تم حفظ السعر', savedC: 'تم حفظ السعر الخاص', removed: 'تم إلغاء السعر الخاص', jump: 'تغيير كبير جدًا: هل هذا هو السعر الصحيح؟', jumpOk: 'نعم، هذا هو السعر',\n      hist: 'آخر الأسعار', noHist: 'لا أسعار', eqTitle: 'بالوحدات الأخرى', noCrate: 'لا وزن صافٍ للصندوق',\n      alRed: 'أقل من سعر التكلفة', alOrg: 'أقل من السعر الأدنى', alOk: 'سعر مناسب',\n      cliList: 'اختر زبونًا', noCli: 'لا زبائن: أنشئهم في وحدة الزبائن.', special: 'أسعار خاصة', offMsg: 'الأسعار الخاصة معطلة. فعّلها في الإعدادات أو هنا.', enable: 'تفعيل الأسعار الخاصة',\n      dayPrice: 'سعر اليوم', spec: 'خاص', readOnly: 'للقراءة فقط: المسير وحده يحدد الأسعار.',\n      runTests: 'تشغيل كل الاختبارات', running: 'جارٍ التنفيذ…', result: 'نجح {ok}/{n}', wipe: 'مسح كل بيانات هذا الاختبار', wipeWarn: 'سيُمسح كل شيء بما فيه رمز المسير. ستبدأ من الصفر.', wipeDo: 'مسح الكل', costDemo: 'محاكاة سعر تكلفة (تجربة التنبيهات)', costOn: 'تكلفة محاكاة: 70٪ من سعر الأمس',\n      okLbl: 'تأكيد'\n    }\n  };\n  const pre = o => Object.fromEntries(Object.entries(o).map(([k, v]) => ['pxu.' + k, v]));\n  core.addStrings({ fr: pre(TX.fr), ar: pre(TX.ar) });\n\n  const S = { route: { name: 'day' }, sheet: null, cid: null };\n  const LANG = () => core.getPref('lang'), t = (k, v) => core.t('pxu.' + k, v);\n  const esc = s => String(s == null ? '' : s).replace(/[&<>\"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;' }[c]));\n  const fmt = n => core.fmt.int(Math.round(n));\n  const money = c => core.fmt.price(c).replace(/\\/.*$/, '');                // centimes → « 55 DA » ou « 52,5 DA »\n  const perKg = c => core.fmt.price(c);\n  const unitLbl = u => t(u), pname = p => Catalogue.productName(p, LANG());\n  const errText = e => { if (e.code === 'GUARD' || e.code === 'CHECK') return e.message; const k = 'err.' + e.code, s = core.t(k); return s !== k ? s : (e.message || String(e)); };\n  const arrow = () => (LANG() === 'ar' ? '→' : '←');\n  const products = () => Catalogue.getProducts(core).filter(p => !p.archived);\n  const prod = id => Catalogue.getProducts(core).find(p => p.id === id);\n  const art = p => (p.draw && Dessins.has(p.draw) ? Dessins.svg(p.draw) : '');\n  const pct = (a, b) => Math.round((a - b) * 1000 / b) / 10;\n\n  /* valeur saisie « 52.5 » → centimes (entier) */\n  function toCents(s) { if (!s) return 0; const [i, f = ''] = String(s).split('.'); return (parseInt(i || '0', 10) || 0) * 100 + parseInt((f + '00').slice(0, 2), 10); }\n  const showVal = s => { const [i, f] = String(s || '0').split('.'); return core.fmt.int(parseInt(i || '0', 10) || 0) + (f !== undefined ? ',' + f : ''); };\n\n  /* ---------- en-tête / navigation ---------- */\n  function header() {\n    const r = S.route.name, title = r === 'cp' ? esc(Clients.getClient(core, S.cid).name) : t(r === 'cli' ? 'tCli' : 'tDay');\n    const back = r === 'cp' ? '<button class=\"icon-btn\" data-a=\"back\" aria-label=\"' + t('back') + '\">' + arrow() + '<\/button>' : '';\n    return '<header class=\"head\"><div class=\"head-row\">' + back + '<h1>' + title + '<\/h1><button class=\"icon-btn\" data-a=\"lock\" aria-label=\"' + t('lockBtn') + '\">🔒<\/button>' +\n      '<div class=\"lang\" role=\"group\"><button data-a=\"lang\" data-v=\"fr\" aria-pressed=\"' + (LANG() === 'fr') + '\">FR<\/button><button data-a=\"lang\" data-v=\"ar\" aria-pressed=\"' + (LANG() === 'ar') + '\">ع<\/button><\/div><\/div>' +\n      '<div class=\"pillrow\"><span class=\"rolepill ' + (acc.role === 'depannage' ? 'dep' : '') + '\">' + esc(core.t('role.' + acc.role)) + '<\/span><span class=\"sample\">' + t('banner') + '<\/span><button class=\"minilink\" data-a=\"theme\">◐ ' + t('themeBtn') + '<\/button><\/div><\/header>';\n  }\n  function nav() {\n    const r = S.route.name; return '<nav class=\"nav\"><button data-a=\"goDay\" ' + (r === 'day' ? 'aria-current=\"page\"' : '') + '>' + t('navDay') + '<\/button><button data-a=\"goCli\" ' + (r === 'cli' ? 'aria-current=\"page\"' : '') + '>' + t('navCli') + '<\/button><\/nav>';\n  }\n\n  /* ---------- écran : prix du jour ---------- */\n  function statusPill(cur) { return !cur ? '<span class=\"pill bad\">' + t('none') + '<\/span>' : cur.fresh ? '<span class=\"pill ok\">' + t('fresh') + '<\/span>' : '<span class=\"pill warn\">' + t('stale') + '<\/span>'; }\n  function varTag(pid, cur) {\n    const pv = Prix.previous(core, pid); if (!cur || !pv || !cur.fresh || pv.cpk === cur.cpk) return '';\n    const d = pct(cur.cpk, pv.cpk); return '<span class=\"var ' + (d > 0 ? 'up' : 'down') + '\">' + (d > 0 ? '▲ +' : '▼ ') + core.fmt.int(Math.round(Math.abs(d))) + ' %<\/span>';\n  }\n  function screenDay() {\n    const st = Prix.dayStatus(core), cur = Prix.currentPrices(core), ps = products(), nDone = st.fresh.length;\n    if (!ps.length) return '<div class=\"card\"><b>' + t('noProd') + '<\/b>' + (can('catalogue.edit') && can('prix.edit') ? '<button class=\"btn ghost\" data-a=\"seedAll\">' + t('seedAll') + '<\/button>' : '') + '<\/div>';\n    return '<div class=\"card\"><div class=\"row-between\"><b>' + (st.done ? t('allDone') : t('done', { a: nDone, b: st.total })) + '<\/b><\/div><div class=\"meter ' + (st.done ? '' : 'high') + '\"><i style=\"width:' + Math.round(nDone * 100 / st.total) + '%\"><\/i><\/div>' +\n      (can('prix.edit') && st.stale.length ? '<button class=\"btn\" data-a=\"carry\">' + t('carry', { n: st.stale.length }) + '<\/button>' : '') + '<\/div>' +\n      '<div class=\"rows\" id=\"plist\">' + ps.map(p => { const c = cur.get(p.id); return '<button class=\"prow\" data-a=\"openPrice\" data-v=\"' + p.id + '\"><span class=\"art\">' + art(p) + '<\/span><span class=\"nm\"><b>' + esc(pname(p)) + '<\/b><small>' + statusPill(c) + '<\/small><\/span><span class=\"pr\"><b>' + (c ? perKg(c.cpk) : '—') + '<\/b>' + varTag(p.id, c) + '<\/span><\/button>'; }).join('') + '<\/div>' +\n      (can('reglages') ? '<button class=\"linkish\" data-a=\"openTools\">' + t('tools') + '<\/button>' : '');\n  }\n\n  /* ---------- écrans : prix par client ---------- */\n  function screenCli() {\n    if (!core.getSetting('prix.special')) return '<div class=\"card\"><span class=\"note warn\">' + t('offMsg') + '<\/span>' + (can('reglages') ? '<button class=\"btn\" data-a=\"enableSpecial\">' + t('enable') + '<\/button>' : '') + '<\/div>';\n    const cl = Clients.getClients(core).filter(c => !c.archived); if (!cl.length) return '<div class=\"empty\">' + t('noCli') + '<\/div>';\n    const all = Prix.allClientPrices(core);\n    return '<div class=\"label\">' + t('cliList') + '<\/div><div class=\"rows\">' + cl.map(c => { const n = all.filter(x => x.cid === c.id).length; return '<button class=\"row\" data-a=\"openCli\" data-v=\"' + c.id + '\"><div class=\"row-between\"><b>' + esc(c.name) + '<\/b>' + (n ? '<span class=\"pill ok\">' + n + ' ' + t('special') + '<\/span>' : '') + '<\/div><\/button>'; }).join('') + '<\/div>';\n  }\n  function screenCp() {\n    const cid = S.cid, cp = Prix.clientPrices(core, cid), cur = Prix.currentPrices(core);\n    return '<div class=\"rows\">' + products().map(p => { const c = cur.get(p.id), s = cp.get(p.id); return '<button class=\"prow\" data-a=\"openPrice\" data-v=\"' + p.id + '\" data-c=\"' + cid + '\"><span class=\"art\">' + art(p) + '<\/span><span class=\"nm\"><b>' + esc(pname(p)) + '<\/b><small>' + t('dayPrice') + ' : ' + (c ? perKg(c.cpk) : '—') + '<\/small><\/span><span class=\"pr\">' + (s != null ? '<b>' + perKg(s) + '<\/b><span class=\"pill ok\">' + t('spec') + '<\/span>' : '<span class=\"pill mute\">—<\/span>') + '<\/span><\/button>'; }).join('') + '<\/div>';\n  }\n\n  /* ---------- feuilles ---------- */\n  function keys() { return '<div class=\"keys\">' + ['1', '2', '3', '4', '5', '6', '7', '8', '9', ',', '0', '⌫'].map(x => '<button data-a=\"key\" data-v=\"' + (x === '⌫' ? 'del' : x === ',' ? '.' : x) + '\" aria-label=\"' + (x === '⌫' ? 'Effacer' : x) + '\">' + x + '<\/button>').join('') + '<\/div>'; }\n  function sheetHead(title, sub) { return '<div class=\"sheet-head\"><div><b>' + title + '<\/b><small>' + sub + '<\/small><\/div><button class=\"icon-btn\" data-a=\"closeSheet\" aria-label=\"' + t('close') + '\">✕<\/button><\/div>'; }\n  function equivalents(pid, cpk) {\n    const p = prod(pid), caisse = p && p.netG > 0 ? Math.round(cpk * p.netG / 1000) : null;\n    return '<div class=\"eq\"><div><small>/' + t('kg') + '<\/small><b>' + money(cpk) + '<\/b><\/div><div><small>/' + t('caisse') + '<\/small><b>' + (caisse != null ? money(caisse) : '—') + '<\/b><\/div><div><small>/' + t('q') + '<\/small><b>' + money(cpk * 100) + '<\/b><\/div><\/div>';\n  }\n  function sheetBody(sh) {\n    if (sh.type === 'price') {\n      const p = prod(sh.pid), cid = sh.cid, edit = can('prix.edit'), cur = Prix.currentPrices(core).get(sh.pid), prev = cid ? null : Prix.previous(core, sh.pid);\n      const spec = cid ? Prix.clientPrices(core, cid).get(sh.pid) : null, base = cid ? (spec != null ? spec : cur && cur.cpk) : (cur && cur.cpk);\n      const c = toCents(sh.val), shown = c > 0 ? c : base;\n      const last = cur ? cur.cpk : null, jump = !cid && last && c > 0 && (c >= last * Prix.JUMP || c * Prix.JUMP <= last);\n      const lvl = c > 0 && !cid ? Prix.alertLevel(core, sh.pid, c) : 'inconnu';\n      const hist = Prix.history(core, sh.pid).slice(0, 6);\n      return sheetHead(esc(pname(p)), cid ? t('setClient') + ' · ' + esc(Clients.getClient(core, cid).name) : t('setTitle')) +\n        '<div class=\"readout\"><b>' + showVal(sh.val || '0') + '<\/b><span>DA/' + t('kg') + '<\/span><\/div>' +\n        (edit ? '<span class=\"label\" style=\"margin:0\">' + t('newPrice') + '<\/span>' + (base ? '<div class=\"chips soft\"><button data-a=\"chip\" data-v=\"' + base + '\">' + t('same', { p: perKg(base) }) + '<\/button><\/div>' : '') + keys() : '<span class=\"note mute\">' + t('readOnly') + '<\/span>') +\n        (shown ? '<span class=\"label\" style=\"margin:0\">' + t('eqTitle') + '<\/span>' + equivalents(sh.pid, shown) : '') +\n        (lvl === 'rouge' ? '<span class=\"note bad\">' + t('alRed') + '<\/span>' : lvl === 'orange' ? '<span class=\"note warn\">' + t('alOrg') + '<\/span>' : lvl === 'ok' ? '<span class=\"note ok\">' + t('alOk') + '<\/span>' : '') +\n        (jump ? '<span class=\"note warn\">' + t('jump') + '<\/span><button class=\"btn ghost\" data-a=\"forceToggle\" aria-pressed=\"' + !!sh.force + '\">' + (sh.force ? '✔ ' : '') + t('jumpOk') + '<\/button>' : '') +\n        (edit ? '<button class=\"btn\" data-a=\"priceOk\"' + (c > 0 && (!jump || sh.force) ? '' : ' disabled') + '>' + t('validate') + (c > 0 ? ' · ' + perKg(c) : '') + '<\/button>' : '') +\n        (edit && cid && spec != null ? '<button class=\"btn danger\" data-a=\"priceDel\">' + t('remove') + '<\/button>' : '') +\n        (!cid ? '<span class=\"label\" style=\"margin:0\">' + t('hist') + '<\/span>' + (hist.length ? '<div class=\"card\" style=\"padding-block:4  appareil seulement', back: 'Retour', close: 'Fermer', cancel: 'Annuler', lockBtn: 'Verrouiller', themeBtn: 'Thème',\n      tTitle: 'Caisses', navClients: 'Clients', navSup: 'Fournisseurs', outNow: 'Caisses chez les clients', held: 'Consigne détenue', owed: 'Caisses à rendre aux fournisseurs', caisses: 'caisses', caisse: 'caisse',\n      none: 'Aucune caisse dehors.', noneSup: 'Aucune caisse fournisseur.', supOff: 'Suivi des caisses fournisseurs désactivé (Outils).', modeAvec: 'Avec consigne', modeSuivi: 'Suivi seul', modeAucun: 'Non géré',\n      newOut: 'Sortie de caisses', pick: 'Choisir le client', noClient: 'Aucun client : chargez les exemples dans Outils.', detailMoves: 'Mouvements', noMoves: 'Aucun mouvement',\n      out: 'Sortie', back: 'Retour', keep: 'Non rendue', in: 'Reçues', mOut: 'Sortie', mBack: 'Retour', mKeep: 'Non rendue', mIn: 'Reçues', mBackS: 'Rendues',\n      sheetOut: 'Sortie de caisses', sheetBack: 'Retour de caisses', sheetKeep: 'Caisse non rendue', crateType: 'Type de caisse', qty: 'Nombre de caisses', onClient: 'Chez le client', toPay: 'Consigne à encaisser', toRefund: 'Consigne à rembourser', toKeep: 'Consigne conservée', keepLbl: 'Le client garde la caisse (consigne conservée)',\n      okOut: 'Enregistrer la sortie', okBack: 'Enregistrer le retour', okKeep: 'Garder la consigne', done: 'Mouvement {n} enregistré', over: 'Plus que le solde.', cash: 'Consigne du jour', cIn: 'Encaissée', cOut: 'Remboursée', cKept: 'Conservée',\n      sIn: 'Recevoir des caisses', sBack: 'Rendre des caisses', supplier: 'Fournisseur', denied: 'Réservé au gérant.',\n      tools: 'Outils', seedAll: 'Charger exemples (caisses, clients, mouvements)', seeded: 'Exemples chargés', toggleSup: 'Activer / désactiver le suivi des caisses fournisseurs', setNow: 'Suivi fournisseurs : {v}', on: 'activé', off: 'désactivé',\n      runTests: 'Lancer tous les tests', running: 'Exécution…', result: '{ok}/{n} réussis', wipe: 'Effacer toutes les données de ce test', wipeWarn: 'Tout sera effacé, code gérant compris. Vous recommencerez à zéro.', wipeDo: 'Tout effacer'\n    },\n    ar: {\n      banner: 'نسخة تجريبية: البيانات محفوظة على هذا الجهاز فقط', back: 'رجوع', close: 'إغلاق', cancel: 'إلغاء', lockBtn: 'قفل', themeBtn: 'المظهر',\n      tTitle: 'الصناديق', navClients: 'الزبائن', navSup: 'الموردون', outNow: 'صناديق عند الزبائن', held: 'الوديعة المحتفظ بها', owed: 'صناديق يجب إرجاعها للموردين', caisses: 'صناديق', caisse: 'صندوق',\n      none: 'لا صناديق في الخارج.', noneSup: 'لا صناديق للموردين.', supOff: 'متابعة صناديق الموردين معطلة (أدوات).', modeAvec: 'بوديعة', modeSuivi: 'عدّ فقط', modeAucun: 'غير مُدارة',\n      newOut: 'خروج صناديق', pick: 'اختر الزبون', noClient: 'لا زبائن: حمّل الأمثلة من الأدوات.', detailMoves: 'الحركات', noMoves: 'لا حركات',\n      out: 'خروج', back: 'إرجاع', keep: 'لم تُرجع', in: 'مستلمة', mOut: 'خروج', mBack: 'إرجاع', mKeep: 'لم تُرجع', mIn: 'مستلمة', mBackS: 'مُرجعة',\n      sheetOut: 'خروج صناديق', sheetBack: 'إرجاع صناديق', sheetKeep: 'صندوق لم يُرجع', crateType: 'نوع الصندوق', qty: 'عدد الصناديق', onClient: 'عند الزبون', toPay: 'وديعة للقبض', toRefund: 'وديعة للإرجاع', toKeep: 'وديعة محتفظ بها', keepLbl: 'الزبون يحتفظ بالصندوق (تبقى الوديعة)',\n      okOut: 'تسجيل الخروج', okBack: 'تسجيل الإرجاع', okKeep: 'الاحتفاظ بالوديعة', done: 'تم تسجيل الحركة {n}', over: 'أكثر من الرصيد.', cash: 'ودائع اليوم', cIn: 'مقبوضة', cOut: 'مُرجعة', cKept: 'محتفظ بها',\n      sIn: 'استلام صناديق', sBack: 'إرجاع صناديق', supplier: 'المورّد', denied: 'للمسير فقط.',\n      tools: 'أدوات', seedAll: 'تحميل أمثلة (صناديق، زبائن، حركات)', seeded: 'تم تحميل الأمثلة', toggleSup: 'تفعيل / تعطيل متابعة صناديق الموردين', setNow: 'متابعة الموردين: {v}', on: 'مفعّلة', off: 'معطلة',\n      runTests: 'تشغيل كل الاختبارات', running: 'جارٍ التنفيذ…', result: 'نجح {ok}/{n}', wipe: 'مسح كل بيانات هذا الاختبار', wipeWarn: 'سيُمسح كل شيء بما فيه رمز المسير. ستبدأ من الصفر.', wipeDo: 'مسح الكل'\n    }\n  };\n  const pre = o => Object.fromEntries(Object.entries(o).map(([k, v]) => ['cu.' + k, v]));\n  core.addStrings({ fr: pre(TX.fr), ar: pre(TX.ar) });\n\n  const S = { route: 'list', tab: 'c', who: 'c', id: null, sheet: null };\n  const LANG = () => core.getPref('lang'), t = (k, v) => core.t('cu.' + k, v);\n  const esc = s => String(s == null ? '' : s).replace(/[&<>\"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;' }[c]));\n  const money = n => core.fmt.da(Math.round(n)), fmt = n => core.fmt.int(n);\n  const errText = e => { if (e.code === 'GUARD' || e.code === 'CHECK' || e.code === 'FORBIDDEN') return e.message; const k = 'err.' + e.code, s = core.t(k); return s !== k ? s : (e.message || String(e)); };\n  const arrow = () => (LANG() === 'ar' ? '→' : '←');\n  const idTxt = id => id.replace(/^([A-Z]+)(\\d+)$/, '$1-$2');\n  const crates = () => Catalogue.getCrates(core), crate = id => crates().find(c => c.id === id), cname = id => { const c = crate(id); return c ? Catalogue.crateName(c, LANG()) : id; };\n  const nm = (who, id) => { const o = who === 'c' ? Clients.getClient(core, id) : Achats.getSupplier(core, id); return o ? o.name : id; };\n  const supOn = () => !!core.getSetting('consigne.fournisseurs');\n  const nOf = s => parseInt(s || '0', 10) || 0;\n  const cnt = n => fmt(n) + ' ' + t(n === 1 ? 'caisse' : 'caisses');\n\n  function header() {\n    const d = S.route === 'detail', title = d ? esc(nm(S.who, S.id)) : t('tTitle');\n    return '<header class=\"head\"><div class=\"head-row\">' + (d ? '<button class=\"icon-btn\" data-a=\"back\" aria-label=\"' + t('back') + '\">' + arrow() + '<\/button>' : '') + '<h1>' + title + '<\/h1><button class=\"icon-btn\" data-a=\"theme\" aria-label=\"' + t('themeBtn') + '\">◐<\/button><button class=\"icon-btn\" data-a=\"lock\" aria-label=\"' + t('lockBtn') + '\">🔒<\/button><\/div>' +\n      '<div class=\"lang\" role=\"group\"><button data-a=\"lang\" data-v=\"fr\" aria-pressed=\"' + (LANG() === 'fr') + '\">FR<\/button><button data-a=\"lang\" data-v=\"ar\" aria-pressed=\"' + (LANG() === 'ar') + '\">ع<\/button><\/div>' +\n      '<div class=\"pillrow\"><span class=\"rolepill ' + (acc.role === 'depannage' ? 'dep' : '') + '\">' + esc(core.t('role.' + acc.role)) + '<\/span><span class=\"sample\">' + t('banner') + '<\/span><\/div><\/header>';\n  }\n  const nav = () => '<nav class=\"tabbar\"><button data-a=\"tab\" data-v=\"c\" ' + (S.tab === 'c' ? 'aria-current=\"page\"' : '') + '>' + t('navClients') + '<\/button>' + (can('consignes') ? '<button data-a=\"tab\" data-v=\"s\" ' + (S.tab === 's' ? 'aria-current=\"page\"' : '') + '>' + t('navSup') + '<\/button>' : '') + '<\/nav>';\n  const modeLab = m => t(m === 'avec' ? 'modeAvec' : m === 'suivi' ? 'modeSuivi' : 'modeAucun');\n\n  function screenList() {\n    const T = Consignes.totals(core), cash = Consignes.dayCash(core, Prix.dayKey(core.now()));\n    const sum = '<div class=\"card\"><div class=\"row-between\"><span class=\"label\" style=\"margin:0\">' + t('outNow') + '<\/span><span class=\"big\">' + fmt(T.clientsOut) + '<\/span><\/div><div class=\"row-between\"><span class=\"sub\">' + t('held') + '<\/span><b>' + money(T.held) + '<\/b><\/div>' +\n      (can('consignes') && T.suppliersOwed ? '<div class=\"row-between\"><span class=\"sub\">' + t('owed') + '<\/span><b>' + fmt(T.suppliersOwed) + '<\/b><\/div>' : '') +\n      (cash.in || cash.out || cash.kept ? '<div class=\"row-between\"><span class=\"sub\">' + t('cash') + ' · ' + t('cIn') + ' ' + money(cash.in) + ' · ' + t('cOut') + ' ' + money(cash.out) + (cash.kept ? ' · ' + t('cKept') + ' ' + money(cash.kept) : '') + '<\/span><\/div>' : '') + '<\/div>';\n    if (S.tab === 's') {\n      if (!supOn()) return '<div class=\"card\"><b>' + t('supOff') + '<\/b><\/div>';\n      const l = Consignes.suppliers(core);\n      return '<button class=\"btn\" data-a=\"openPickSup\">' + t('sIn') + '<\/button>' + (l.length ? '<div class=\"rows\">' + l.map(r => '<button class=\"prow\" data-a=\"openRow\" data-w=\"s\" data-v=\"' + r.id + '\"><span class=\"nm\"><b>' + esc(r.name) + '<\/b><small>' + r.crates.map(c => esc(cname(c.crate)) + ' ' + fmt(c.out)).join(' · ') + '<\/small><\/span><span class=\"pr\"><span class=\"pill ok\">' + cnt(r.out) + '<\/span><\/span><\/button>').join('') + '<\/div>' : '<div class=\"empty\">' + t('noneSup') + '<\/div>');\n    }\n    const l = Consignes.clients(core);\n    return sum + '<button class=\"btn\" data-a=\"openPick\">' + t('newOut') + '<\/button>' + (l.length ? '<div class=\"rows\">' + l.map(r => '<button class=\"prow\" data-a=\"openRow\" data-w=\"c\" data-v=\"' + r.id + '\"><span class=\"nm\"><b>' + esc(r.name) + '<\/b><small>' + modeLab(r.mode) + (r.held ? ' · ' + money(r.held) : '') + '<\/small><\/span><span class=\"pr\"><span class=\"pill ok\">' + cnt(r.out) + '<\/span><\/span><\/button>').join('') + '<\/div>' : '<div class=\"empty\">' + t('none') + '<\/div>') +\n      (can('reglages') ? '<button class=\"linkish\" data-a=\"openTools\">' + t('tools') + '<\/button>' : '');\n  }\n  function screenDetail() {\n    const b = Consignes.balanceOf(core, S.who, S.id), mv = Consignes.moves(core, S.who, S.id).slice(0, 20), cl = S.who === 'c';\n    const lab = { out: 'mOut', back: cl ? 'mBack' : 'mBackS', keep: 'mKeep', in: 'mIn' };\n    return '<div class=\"card\"><div class=\"row-between\"><span class=\"label\" style=\"margin:0\">' + t('onClient') + '<\/span><span class=\"big\">' + fmt(b.out) + '<\/span><\/div>' + (cl ? '<div class=\"row-between\"><span class=\"sub\">' + t('held') + '<\/span><b>' + money(b.held) + '<\/b><\/div>' : '') +\n      b.crates.map(c => '<div class=\"row-between\"><span class=\"sub\">' + esc(cname(c.crate)) + '<\/span><b>' + fmt(c.out) + (cl && c.held ? ' · ' + money(c.held) : '') + '<\/b><\/div>').join('') + '<\/div>' +\n      (cl ? '<div class=\"row2\"><button class=\"btn\" data-a=\"openMove\" data-v=\"out\">' + t('out') + '<\/button><button class=\"btn ghost\" data-a=\"openMove\" data-v=\"back\"' + (b.out ? '' : ' disabled') + '>' + t('back') + '<\/button><\/div>' + (can('consignes') ? '<button class=\"btn ghost\" data-a=\"openMove\" data-v=\"keep\"' + (b.out ? '' : ' disabled') + '>' + t('keep') + '<\/button>' : '')\n        : '<div class=\"row2\"><button class=\"btn\" data-a=\"openMove\" data-v=\"in\">' + t('in') + '<\/button><button class=\"btn ghost\" data-a=\"openMove\" data-v=\"back\"' + (b.out ? '' : ' disabled') + '>' + t('back') + '<\/button><\/div>') +\n      '<div class=\"label\">' + t('detailMoves') + '<\/div>' + (mv.length ? '<div class=\"card\" style=\"padding-block:4px\">' + mv.map(m => '<div class=\"line\"><div class=\"grow\"><b>' + t(lab[m.d.dir]) + ' ' + idTxt(m.id) + '<\/b><small>' + core.fmt.dateTime(m.t) + ' · ' + esc(cname(m.d.crate)) + (m.d.sale ? ' · ' + idTxt(m.d.sale) : '') + '<\/small><\/div><span class=\"amt\">' + (m.d.dir === 'back' || m.d.dir === 'keep' ? '−' : '+') + fmt(m.d.q) + (m.d.dep ? ' · ' + money(m.d.dep) : '') + '<\/span><\/div>').join('') + '<\/div>' : '<div class=\"empty\">' + t('noMoves') + '<\/div>');\n  }\n\n  const keys = () => '<div class=\"keys\">' + ['1', '2', '3', '4', '5', '6', '7', '8', '9', '', '0', '⌫'].map(x => x === '' ? '<span><\/span>' : '<button data-a=\"key\" data-v=\"' + (x === '⌫' ? 'del' : x) + '\" aria-label=\"' + (x === '⌫' ? 'Effacer' : x) + '\">' + x + '<\/button>').join('') + '<\/div>';\n  const sheetHead = (title, sub) => '<div class=\"sheet-head\"><div><b>' + title + '<\/b><small>' + sub + '<\/small><\/div><button class=\"icon-btn\" data-a=\"closeSheet\" aria-label=\"' + t('close') + '\">✕<\/button><\/div>';\n  function sheetBody(sh) {\n    if (sh.type === 'pick') {\n      const l = sh.who === 'c' ? Clients.getClients(core).filter(c => !c.archived && Consignes.modeOf(core, c) !== 'aucun') : Achats.getSuppliers(core).filter(s => !s.archived);\n      return sheetHead(t(sh.who === 'c' ? 'pick' : 'supplier'), '') + (l.length ? '<div class=\"rows\">' + l.map(c => '<button class=\"prow\" data-a=\"pickDone\" data-w=\"' + sh.who + '\" data-v=\"' + c.id + ' n","js":"/* Écrans Retours clients (M12) : choisir la vente, rendre des kilos par ligne, destination, règlement. */\n(async function () {\n  'use strict';\n  const core = Noyau.create({ adapter: 'auto', auto: { name: 'ggl-m12r-test', key: 'ggl.m12r.test' } });\n  await core.init();\n  [Acces, Reglages, Catalogue, Clients, Credit, Prix, Ventes, Achats, Stock, Retours].forEach(m => core.use(m.module));\n  const acc = Acces.of(core), can = p => core.can(p), Num = Noyau.Num;\n\n  const TX = {\n    fr: {\n      banner: 'Version test : données gardées sur cet appareil seulement', back: 'Retour', close: 'Fermer', cancel: 'Annuler', lockBtn: 'Verrouiller', themeBtn: 'Thème', tTitle: 'Retours clients', denied: 'Réservé au gérant.',\n      today: 'Aujourd’hui', nRet: 'retours', valueBack: 'Rendu aux clients', toDebt: 'Dette effacée', cashOut: 'Espèces rendues', none: 'Aucun retour.', newRet: 'Nouveau retour', pickSale: 'Choisir la vente', noSale: 'Aucune vente à reprendre : chargez les exemples dans Outils.',\n      comptoir: 'Comptoir', sold: 'Vendu', left: 'Reste', retTitle: 'Retour sur la vente', tapLine: 'Touchez une ligne, puis entrez le poids rendu.', kg: 'kg', dest: 'Destination', dStock: 'Remettre en stock', dPerte: 'Perte (jeté)',\n      settle: 'Règlement', sDette: 'Réduire la dette', sCash: 'Rendre en espèces', motif: 'Motif', m_qualite: 'Qualité', m_erreur: 'Erreur de pesée', m_refus: 'Refusé par le client', m_autre: 'Autre',\n      value: 'Total rendu', debtLine: 'Dette effacée', cashLine: 'À rendre en espèces', ok: 'Enregistrer le retour', done: 'Retour {n} enregistré', over: 'Plus que le reste rendable.', noLines: 'Entrez un poids sur au moins une ligne.',\n      openVoid: 'Annuler ce retour', voidTitle: 'Annuler le retour', voidMotif: 'Motif de l’annulation', voidOk: 'Annuler le retour', voided: 'Retour annulé',\n      tools: 'Outils', seedAll: 'Charger exemples (produits, prix, arrivages, ventes à crédit)', seeded: 'Exemples chargés', runTests: 'Lancer tous les tests', running: 'Exécution…', result: '{ok}/{n} réussis',\n      wipe: 'Effacer toutes les données de ce test', wipeWarn: 'Tout sera effacé, code gérant compris. Vous recommencerez à zéro.', wipeDo: 'Tout effacer', toStock: 'en stock', toLoss: 'perte', ticket: 'Vente'\n    },\n    ar: {\n      banner: 'نسخة تجريبية: البيانات محفوظة على هذا الجهاز فقط', back: 'رجوع', close: 'إغلاق', cancel: 'إلغاء', lockBtn: 'قفل', themeBtn: 'المظهر', tTitle: 'مرتجعات الزبائن', denied: 'للمسير فقط.',\n      today: 'اليوم', nRet: 'مرتجعات', valueBack: 'المُرجع للزبائن', toDebt: 'دين ملغى', cashOut: 'نقد مُرجع', none: 'لا مرتجعات.', newRet: 'مرتجع جديد', pickSale: 'اختر البيع', noSale: 'لا بيع للاسترجاع: حمّل الأمثلة من الأدوات.',\n      comptoir: 'بيع مباشر', sold: 'المباع', left: 'المتبقي', retTitle: 'مرتجع على البيع', tapLine: 'المس سطرًا ثم أدخل الوزن المرتجع.', kg: 'كغ', dest: 'الوجهة', dStock: 'إعادة إلى المخزون', dPerte: 'خسارة (رمي)',\n      settle: 'التسوية', sDette: 'تخفيض الدين', sCash: 'إرجاع نقدًا', motif: 'السبب', m_qualite: 'الجودة', m_erreur: 'خطأ في الوزن', m_refus: 'رفضه الزبون', m_autre: 'آخر',\n      value: 'مجموع المُرجع', debtLine: 'دين ملغى', cashLine: 'نقد يُرجع', ok: 'تسجيل المرتجع', done: 'تم تسجيل المرتجع {n}', over: 'أكثر من المتبقي.', noLines: 'أدخل وزنًا في سطر واحد على الأقل.',\n      openVoid: 'إلغاء هذا المرتجع', voidTitle: 'إلغاء المرتجع', voidMotif: 'سبب الإلغاء', voidOk: 'إلغاء المرتجع', voided: 'أُلغي المرتجع',\n      tools: 'أدوات', seedAll: 'تحميل أمثلة (منتجات، أسعار، إرساليات، مبيعات بالدين)', seeded: 'تم تحميل الأمثلة', runTests: 'تشغيل كل الاختبارات', running: 'جارٍ التنفيذ…', result: 'نجح {ok}/{n}',\n      wipe: 'مسح كل بيانات هذا الاختبار', wipeWarn: 'سيُمسح كل شيء بما فيه رمز المسير. ستبدأ من الصفر.', wipeDo: 'مسح الكل', toStock: 'للمخزون', toLoss: 'خسارة', ticket: 'بيع'\n    }\n  };\n  const pre = o => Object.fromEntries(Object.entries(o).map(([k, v]) => ['re.' + k, v]));\n  core.addStrings({ fr: pre(TX.fr), ar: pre(TX.ar) });\n\n  const S = { sheet: null };\n  const LANG = () => core.getPref('lang'), t = (k, v) => core.t('re.' + k, v);\n  const esc = s => String(s == null ? '' : s).replace(/[&<>\"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;' }[c]));\n  const money = n => core.fmt.da(Math.round(n)), kgTxt = g => core.fmt.kg(g);\n  const errText = e => { if (e.code === 'GUARD' || e.code === 'CHECK' || e.code === 'FORBIDDEN') return e.message; const k = 'err.' + e.code, s = core.t(k); return s !== k ? s : (e.message || String(e)); };\n  const prod = id => Catalogue.getProducts(core).find(p => p.id === id), pname = p => (p ? (LANG() === 'ar' && p.ar ? p.ar : p.fr) : '?');\n  const art = p => (p && p.draw && Dessins.has(p.draw) ? Dessins.svg(p.draw) : '');\n  const idTxt = id => id.replace(/^([A-Z]+)(\\d+)$/, '$1-$2');\n  const gOf = s => { try { return Num.parseDecimal(s || '0', 3); } catch (e) { return 0; } };\n  const showVal = s => { const [i, f] = String(s || '0').split('.'); return core.fmt.int(parseInt(i || '0', 10) || 0) + (f !== undefined ? ',' + f : ''); };\n  const cname = id => { const c = id ? Clients.getClient(core, id) : null; return c ? c.name : t('comptoir'); };\n\n  function header() {\n    return '<header class=\"head\"><div class=\"head-row\"><h1>' + t('tTitle') + '<\/h1><button class=\"icon-btn\" data-a=\"theme\" aria-label=\"' + t('themeBtn') + '\">◐<\/button><button class=\"icon-btn\" data-a=\"lock\" aria-label=\"' + t('lockBtn') + '\">🔒<\/button><\/div>' +\n      '<div class=\"lang\" role=\"group\"><button data-a=\"lang\" data-v=\"fr\" aria-pressed=\"' + (LANG() === 'fr') + '\">FR<\/button><button data-a=\"lang\" data-v=\"ar\" aria-pressed=\"' + (LANG() === 'ar') + '\">ع<\/button><\/div>' +\n      '<div class=\"pillrow\"><span class=\"rolepill ' + (acc.role === 'depannage' ? 'dep' : '') + '\">' + esc(core.t('role.' + acc.role)) + '<\/span><span class=\"sample\">' + t('banner') + '<\/span><\/div><\/header>';\n  }\n  function screen() {\n    if (!can('retours')) return '<div class=\"card\"><b>' + t('denied') + '<\/b><\/div>';\n    const d = Retours.dayReturns(core), l = Retours.list(core).slice(0, 30);\n    return '<div class=\"card\"><div class=\"row-between\"><span class=\"label\" style=\"margin:0\">' + t('today') + '<\/span><span class=\"big\">' + d.count + ' ' + t('nRet') + '<\/span><\/div>' +\n      '<div class=\"row-between\"><span class=\"sub\">' + t('valueBack') + '<\/span><b>' + money(d.value) + '<\/b><\/div><div class=\"row-between\"><span class=\"sub\">' + t('toDebt') + '<\/span><b>' + money(d.toDebt) + '<\/b><\/div><div class=\"row-between\"><span class=\"sub\">' + t('cashOut') + '<\/span><b>' + money(d.cash) + '<\/b><\/div><\/div>' +\n      '<button class=\"btn\" data-a=\"openPick\">' + t('newRet') + '<\/button>' +\n      (l.length ? '<div class=\"card\" style=\"padding-block:4px\">' + l.map(r => '<button class=\"line\" style=\"width:100%;text-align:inherit\" data-a=\"openVoid\" data-v=\"' + r.id + '\"><div class=\"grow\"><b>' + idTxt(r.id) + ' · ' + esc(cname(r.d.cid)) + '<\/b><small>' + core.fmt.dateTime(r.t) + ' · ' + t('ticket') + ' ' + idTxt(r.d.sale) + ' · ' + esc(r.d.motif) + '<\/small><\/div><span class=\"amt\">' + money(r.d.value) + '<\/span><\/button>').join('') + '<\/div>' : '<div class=\"empty\">' + t('none') + '<\/div>') +\n      (can('reglages') ? '<button class=\"linkish\" data-a=\"openTools\">' + t('tools') + '<\/button>' : '');\n  }\n\n  const keys = () => '<div class=\"keys\">' + ['1', '2', '3', '4', '5', '6', '7', '8', '9', ',', '0', '⌫'].map(x => '<button data-a=\"key\" data-v=\"' + (x === '⌫' ? 'del' : x === ',' ? '.' : x) + '\" aria-label=\"' + (x === '⌫' ? 'Effacer' : x) + '\">' + x + '<\/button>').join('') + '<\/div>';\n  const sheetHead = (title, sub) => '<div class=\"sheet-head\"><div><b>' + title + '<\/b><small>' + sub + '<\/small><\/div><button class=\"icon-btn\" data-a=\"closeSheet\" aria-label=\"' + t('close') + '\">✕<\/button><\/div>';\n  const MOTIFS = ['qualite', 'erreur', 'refus', 'autre'];\n  const items = sh => Object.entries(sh.q).filter(([, v]) => gOf(v.val) > 0).map(([i, v]) => ({ i: +i, g: gOf(v.val), dest: v.dest }));\n  function sheetBody(sh) {\n    if (sh.type === 'pick') {\n      const l = Retours.returnable(core, 30);\n      return sheetHead(t('pickSale'), '') + (l.length ? '<div class=\"rows\">' + l.map(x => { const s = x.sale; return '<button class=\"prow\" data-a=\"pickDone\" data-v=\"' + s.id + '\"><span class=\"nm\"><b>' + idTxt(s.id) + ' · ' + esc(cname(s.d.cid)) + '<\/b><small>' + core.fmt.dateTime(s.t) + ' · ' + s.d.lines.map(z => esc(pname(prod(z.pid)))).join(', ') + '<\/small><\/span><span class=\"pr\"><small>' + money(s.d.total) + '<\/small><\/span><\/button>'; }).join('') + '<\/div>' : '<div class=\"empty\">' + t('noSale') + '<\/div>');\n    }\n    if (sh.type === 'ret') {\n      const sale = Ventes.getSale(core, sh.sale), st = Retours.lineStatus(core, sale), its = items(sh); let pv = null, err = '';\n      if (its.length) { try { pv = Retours.preview(core, sh.sale, its, sh.mode); } catch (e) { err = e.message; } }\n      const act = sh.q[sh.act];\n      return sheetHead(t('retTitle') + ' ' + idTxt(sale.id), esc(cname(sale.d.cid))) +\n        '<div class=\"card\" style=\"padding-block:4px\">' + sale.d.lines.map((l, i) => { const v = sh.q[i], p = prod(l.pid), has = v && gOf(v.val) > 0;\n          return '<button class=\"line\" style=\"width:100%;text-align:inherit' + (sh.act === i ? ';outline:2px solid var(--accent,#0f6b57);border-radius:10px' : '') + '\" data-a=\"pickLine\" data-v=\"' + i + '\"' + (st[i].left ? '' : ' disabled') + '><span class=\"art\" style=\"width:36px\">' + art(p) + '<\/span><div class=\"grow\"><b>' + esc(pname(p)) + '<\/b><small>' + t('sold') + ' ' + kgTxt(l.g) + ' · ' + t('left') + ' ' + kgTxt(st[i].left) + '<\/small><\/div><span class=\"amt\">' + (has ? showVal(v.val) + ' ' + t('kg') + ' · ' + t(v.dest === 'stock' ? 'toStock' : 'toLoss') : '') + '<\/span><\/button>'; }).join('') + '<\/div>' +\n        (act ? '<div class=\"readout\"><b>' + showVal(act.val) + '<\/b><span>' + t('kg') + '<\/span><\/div>' + keys() + '<span class=\"label\" style=\"margin:0\">' + t('dest') + '<\/span><div class=\"chips\"><button data-a=\"dest\" data-v=\"stock\" aria-pressed=\"' + (act.dest === 'stock') + '\">' + t('dStock') + '<\/button><button data-a=\"dest\" data-v=\"perte\" aria-pressed=\"' + (act.dest === 'perte') + '\">' + t('dPerte') + '<\/button><\/div>' : '<span class=\"note mute\">' + t('tapLine') + '<\/span>') +\n        '<span class=\"label\" style=\"margin:0\">' + t('settle') + '<\/span><div class=\"chips\"><button data-a=\"mode\" data-v=\"dette\" aria-pressed=\"' + (sh.mode === 'dette') + '\">' + t('sDette') + '<\/button><button data-a=\"mode\" data-v=\"cash\" aria-pressed=\"' + (sh.mode === 'cash') + '\">' + t('sCash') + '<\/button><\/div>' +\n        '<span class=\"label\" style=\"margin:0\">' + t('motif') + '<\/span><div class=\"chips\">' + MOTIFS.map(m => '<button data-a=\"motif\" data-v=\"' + m + '\" aria-pressed=\"' + (sh.motif === m) + '\">' + t('m_' + m) + '<\/button>').join('') + '<\/div>' +\n        (pv ? '<div class=\"card\"><div class=\"row-between\"><span>' + t('debtLine') + '<\/span><b>' + money(pv.toDebt) + '<\/b><\/div><div class=\"row-between\"><span>' + t('cashLine') + '<\/span><b>' + money(pv.cash) + '<\/b><\/div><\/div><div class=\"total\"><span>' + t('value') + '<\/span><b>' + money(pv.value) + '<\/b><\/div>' : '') + (err ? '<span class=\"note bad\">' + esc(err) + '<\/span>' : '') +\n        '<button class=\"btn\" data-a=\"retOk\"' + (pv && !err ? '' : ' disabled') + '>' + t('ok') + '<\/button>';\n    }\n    if (sh.type === 'void') {\n      const r = core.byType('sale.return', true).find(x => x.id === sh.id);\n      return sheetHead(t('voidTitle') + ' ' + idTxt(sh.id), r ? money(r.d.value) : '') + '<span class=\"label\" style=\"margin:0\">' + t('voidMotif') + '<\/span><div class=\"chips\">' + MOTIFS.map(m => '<button data-a=\"vmotif\" data-v=\"' + m + '\" aria-pressed=\"' + (sh.motif === m) + '\">' + t('m_' + m) + '<\/button>').join('') + '<\/div><button class=\"btn danger\" data-a=\"voidOk\">' + t('voidOk') + '<\/button>';\n    }\n    if (sh.type === 'tools') {\n      const r = sh.results;\n      return sheetHead(t('tools'), '') + '<button class=\"btn ghost\" data-a=\"seedAll\">' + t('seedAll') + '<\/button><button class=\"btn\" data-a=\"runTests\"' + (sh.busy ? ' disabled' : '') + '>' + t(sh.busy ? 'running' : 'runTests') + '<\/button>' +\n        (r ? '<span class=\"note ' + (r.every(x => x.ok) ? 'ok' : 'bad') + '\" id=\"test-sum\">' + t('result', { ok: r.filter(x => x.ok).length, n: r.length }) + '<\/span><div id=\"test-list\">' + r.filter(x => !x.ok).map(x => '<div class=\"testline\"><span>❌<\/span><div>' + esc(x.name) + '<div class=\"e\">' + esc(x.err) + '<\/div><\/div><\/div>').join('') + '<\/div>' : '') + '<button class=\"btn danger\" data-a=\"openWipe\">' + t('wipe') + '<\/button>';\n    }\n    if (sh.type === 'wipe') return sheetHead(t('wipe'), '') + '<span class=\"note warn\">' + t('wipeWarn') + '<\/span><div class=\"row2\"><button class=\"btn ghost\" data-a=\"closeSheet\">' + t('cancel') + '<\/button><button class=\"btn danger\" data-a=\"wipeOk\">' + t('wipeDo') + '<\/button><\/div>';\n    return '';\n  }\n\n  const app = () => document.getElementById('app');\n  function applyPrefs() { const th = core.getPref('theme'), de = document.documentElement; if (th === 'auto') de.removeAttribute('data-theme'); else de.setAttribute('data-theme', th); de.lang = LANG(); de.dir = LANG() === 'ar' ? 'rtl' : 'ltr'; }\n  function renderMain() { applyPrefs(); app().innerHTML = header() + '<main style=\"display:flex;flex-direction:column;gap:12px;flex:1\">' + screen() + '<\/main>'; }\n  function renderSheet() {\n    const root = document.getElementById('sheet-root'); if (!S.sheet) { root.innerHTML = ''; return; }\n    const old = root.querySelector('.sheet'), top = old ? old.scrollTop : 0, fresh = !!S.shee
